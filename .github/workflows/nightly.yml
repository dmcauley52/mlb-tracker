on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        default: 'nightly'
        type: choice
        options:
          - nightly
          - backfill
          - nightly-pitchers
          - backfill-pitchers
          - migrate-cache
          - backfill-games
          - nightly-cache
          - migrate-predictions
          - migrate-tuning
          - predict-games
          - prediction-outcomes
          - tune-model

  schedule:
    - cron: '0 9 * * *'   # 9 AM UTC — after all games are final (outcomes + gamelogs)
    - cron: '0 22 * * *'  # 10 PM UTC / 6 PM ET — lineups posted, run predictions

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install mlb-statsapi psycopg2-binary python-dotenv cryptography requests

      # ── One-time migrations ────────────────────────────────────────────────
      - name: Create cache tables (run once)
        if: github.event.inputs.mode == 'migrate-cache'
        run: python migrate_cache_tables.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Create game_predictions table (run once)
        if: github.event.inputs.mode == 'migrate-predictions'
        run: python migrate_game_predictions.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Create model_tuning_log table (run once)
        if: github.event.inputs.mode == 'migrate-tuning'
        run: python migrate_model_tuning.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # ── Backfill modes ────────────────────────────────────────────────────
      - name: Backfill hitter gamelogs
        if: github.event.inputs.mode == 'backfill'
        run: python backfill_stats.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Backfill pitcher gamelogs
        if: >
          github.event.inputs.mode == 'backfill' ||
          github.event.inputs.mode == 'backfill-pitchers'
        run: python backfill_pitcher_stats.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Backfill game results (full season)
        if: >
          github.event.inputs.mode == 'backfill' ||
          github.event.inputs.mode == 'backfill-games'
        run: python fetch_game_results.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MODE: backfill

      # ── Nightly hitters + pitchers (existing) ─────────────────────────────
      - name: Nightly hitter gamelogs
        if: >
          github.event.inputs.mode == 'nightly' ||
          github.event.inputs.mode == ''
        run: python fetch_stats.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Nightly pitcher gamelogs
        if: >
          github.event.inputs.mode == 'nightly' ||
          github.event.inputs.mode == 'nightly-pitchers' ||
          github.event.inputs.mode == ''
        run: python fetch_pitcher_stats.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # ── Nightly cache pipeline (runs after gamelogs are written) ──────────
      - name: Nightly game results
        if: >
          github.event.inputs.mode == 'nightly' ||
          github.event.inputs.mode == 'nightly-cache' ||
          github.event.inputs.mode == ''
        run: python fetch_game_results.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MODE: nightly

      - name: Nightly team stats cache
        if: >
          github.event.inputs.mode == 'nightly' ||
          github.event.inputs.mode == 'nightly-cache' ||
          github.event.inputs.mode == ''
        run: python fetch_team_stats.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Nightly pitcher profiles
        if: >
          github.event.inputs.mode == 'nightly' ||
          github.event.inputs.mode == 'nightly-cache' ||
          github.event.inputs.mode == ''
        run: python fetch_pitcher_profiles.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Nightly backtest cache (all teams)
        if: >
          github.event.inputs.mode == 'nightly' ||
          github.event.inputs.mode == 'nightly-cache' ||
          github.event.inputs.mode == ''
        run: python fetch_backtest_cache.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DAYS: 21

      - name: Nightly model tuning suggestions
        if: >
          github.event.inputs.mode == 'nightly' ||
          github.event.inputs.mode == 'nightly-cache' ||
          github.event.inputs.mode == 'tune-model' ||
          github.event.inputs.mode == ''
        run: python tune_model.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DAYS: 21

      - name: Nightly Kalshi tracker (fill outcomes only)
        if: >
          github.event.inputs.mode == 'nightly' ||
          github.event.inputs.mode == ''
        run: python fetch_kalshi_outcomes.py
        env:
          MODE: outcomes
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}

      # ── Prediction outcomes (9 AM run — fill actual scores after games finish) ──
      - name: Fill prediction outcomes
        if: >
          github.event.inputs.mode == 'nightly' ||
          github.event.inputs.mode == 'prediction-outcomes' ||
          github.event.inputs.mode == ''
        run: python fetch_prediction_outcomes.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # ── Game predictions (10 PM UTC run — lineups posted by ~6 PM ET) ─────────
      - name: Run game predictions (MC + wOBA)
        if: >
          github.event.inputs.mode == 'predict-games' ||
          github.event_name == 'schedule' && github.event.schedule == '0 22 * * *'
        run: python fetch_game_predictions.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
