on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        default: 'nightly'
        type: choice
        options:
          - nightly
          - backfill
          - nightly-pitchers
          - backfill-pitchers
          - migrate-cache
          - backfill-games
          - nightly-cache

  schedule:
    - cron: '0 9 * * *'   # 9 AM UTC — after all games are final

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install mlb-statsapi psycopg2-binary python-dotenv

      # ── One-time migrations ────────────────────────────────────────────────
      - name: Create cache tables (run once)
        if: github.event.inputs.mode == 'migrate-cache'
        run: python migrate_cache_tables.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # ── Backfill modes ────────────────────────────────────────────────────
      - name: Backfill hitter gamelogs
        if: github.event.inputs.mode == 'backfill'
        run: python backfill_stats.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Backfill pitcher gamelogs
        if: >
          github.event.inputs.mode == 'backfill' ||
          github.event.inputs.mode == 'backfill-pitchers'
        run: python backfill_pitcher_stats.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Backfill game results (full season)
        if: >
          github.event.inputs.mode == 'backfill' ||
          github.event.inputs.mode == 'backfill-games'
        run: python fetch_game_results.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MODE: backfill

      # ── Nightly hitters + pitchers (existing) ─────────────────────────────
      - name: Nightly hitter gamelogs
        if: >
          github.event.inputs.mode == 'nightly' ||
          github.event.inputs.mode == ''
        run: python fetch_stats.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Nightly pitcher gamelogs
        if: >
          github.event.inputs.mode == 'nightly' ||
          github.event.inputs.mode == 'nightly-pitchers' ||
          github.event.inputs.mode == ''
        run: python fetch_pitcher_stats.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # ── Nightly cache pipeline (runs after gamelogs are written) ──────────
      - name: Nightly game results
        if: >
          github.event.inputs.mode == 'nightly' ||
          github.event.inputs.mode == 'nightly-cache' ||
          github.event.inputs.mode == ''
        run: python fetch_game_results.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MODE: nightly

      - name: Nightly team stats cache
        if: >
          github.event.inputs.mode == 'nightly' ||
          github.event.inputs.mode == 'nightly-cache' ||
          github.event.inputs.mode == ''
        run: python fetch_team_stats.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Nightly pitcher profiles
        if: >
          github.event.inputs.mode == 'nightly' ||
          github.event.inputs.mode == 'nightly-cache' ||
          github.event.inputs.mode == ''
        run: python fetch_pitcher_profiles.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Nightly backtest cache (all teams)
        if: >
          github.event.inputs.mode == 'nightly' ||
          github.event.inputs.mode == 'nightly-cache' ||
          github.event.inputs.mode == ''
        run: python fetch_backtest_cache.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DAYS: 21
