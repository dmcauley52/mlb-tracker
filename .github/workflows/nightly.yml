on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode: nightly or backfill'
        required: true
        default: 'nightly'
        type: choice
        options:
          - nightly
          - backfill
          - nightly-pitchers
          - backfill-pitchers
  schedule:
    - cron: '0 9 * * *'

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install mlb-statsapi pandas psycopg2-binary python-dotenv

      - name: Run backfill (full season) — batters
        if: github.event.inputs.mode == 'backfill'
        run: python backfill_stats.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run backfill (full season) — pitchers
        if: >
          github.event.inputs.mode == 'backfill' ||
          github.event.inputs.mode == 'backfill-pitchers'
        run: python backfill_pitcher_stats.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run nightly fetch (yesterday only) — batters
        if: >
          github.event.inputs.mode == 'nightly' ||
          github.event.inputs.mode == ''
        run: python fetch_stats.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run nightly fetch (yesterday only) — pitchers
        if: >
          github.event.inputs.mode == 'nightly' ||
          github.event.inputs.mode == 'nightly-pitchers' ||
          github.event.inputs.mode == ''
        run: python fetch_pitcher_stats.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
