name: Kalshi Morning Snapshot

on:
  workflow_dispatch: {}   # allow manual trigger for testing

  schedule:
    - cron: '0 14 * * *'  # 14:00 UTC = 10 AM ET — pre-game, before most lines move

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install psycopg2-binary python-dotenv cryptography requests

      - name: Log today's Kalshi disagreements (morning snapshot)
        run: python fetch_kalshi_outcomes.py
        env:
          MODE:              morning
          DATABASE_URL:      ${{ secrets.DATABASE_URL }}
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
