Batting order spots: 1=leadoff, 2=second, 3=third, 4=cleanup, 5=fifth, 6=sixth, 7=seventh, 8=eighth, 9=ninth. Never use a spot name and number to refer to the same position (e.g. do not say "batting cleanup instead of fourth" — cleanup IS fourth).

My Team: ${myTeam}
Opponent: ${selectedGame.detail?.teamFullName||selectedGame.opponent} (${selectedGame.date})
Opp SP: ${sp?`${sp.name} (${sp.hand}HP) ERA ${sp.era?.toFixed(2)||"?"} WHIP ${sp.whip?.toFixed(2)||"?"} K/9 ${sp.k9?.toFixed(1)||"?"}`:"TBD"}
Opp Team ERA: ${selectedGame.detail?.teamEra?.toFixed(2)||"?"} · L10: ${selectedGame.detail?.teamWinPct!=null?Math.round(selectedGame.detail.teamWinPct*10)+"-"+(10-Math.round(selectedGame.detail.teamWinPct*10)):" ?"}

MY LINEUP (cycle-optimized):
${fmtMine}

OPPONENT LINEUP (projected by batting history):
${fmtOpp}

Write a tight 4-sentence manager's pregame brief: (1) our lineup's biggest advantage today, (2) the matchup we must exploit or neutralize, (3) one specific tactical recommendation (platoon, lineup tweak, etc.), (4) your game prediction. Use names and numbers from above — no generic baseball filler.`;
        try{
          const res=await fetch("/api/scout",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt})});
          if(!res.ok) throw new Error(`API ${res.status}`);
          const d=await res.json(); setAiSummary(d.text||"No summary returned.");
        }catch(e){ setAiSummary(e.message==="Failed to fetch"?"AI requires Vercel deployment.":"Error: "+e.message); }
        setAiLoading(false);
      };

      const wobaColor=w=>!w?'#64748b':w>=.370?'#22c55e':w>=.320?'#a3e635':w>=.280?'#f59e0b':'#ef4444';
      const tierIcon=t=>t==="hot"?"↑":t==="warm"?"↗":t==="cold"?"↓":"→";

      const LineupCard=({title,lineup,accentColor,pitcher,teamEra,teamWinPct})=>{
        const l10wins = teamWinPct!=null?Math.round(teamWinPct*10):null;
        const l10str  = l10wins!=null?`${l10wins}-${10-l10wins} L10`:null;
        return(
          <div style={{background:"#1e293b",borderRadius:12,padding:16,flex:1,minWidth:0}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10,paddingBottom:8,borderBottom:`2px solid ${accentColor}`}}>
              <span style={{fontWeight:800,fontSize:13,color:accentColor,textTransform:"uppercase",letterSpacing:1}}>{title}</span>
              {l10str&&<span style={{fontSize:10,color:teamWinPct<0.40?'#22c55e':teamWinPct>0.60?'#ef4444':'#f59e0b'}}>{l10str}</span>}
            </div>
            {pitcher?(
              <div style={{marginBottom:10,padding:"6px 8px",background:"#0f172a",borderRadius:6,fontSize:11}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <span style={{color:"#94a3b8",fontWeight:700}}>SP: {pitcher.name}</span>
                  <span style={{background:"#334155",borderRadius:3,padding:"1px 5px",color:"#94a3b8",fontSize:10}}>{pitcher.hand}HP</span>
                </div>
                <div style={{display:"flex",gap:12,marginTop:4,color:"#64748b"}}>
                  {[["ERA",pitcher.era?.toFixed(2)],["WHIP",pitcher.whip?.toFixed(2)],["K/9",pitcher.k9?.toFixed(1)],["Med IP",pitcher.medianIP]].map(([l,v])=>v!=null&&(
                    <span key={l}>{l} <b style={{color:l==="ERA"?(pitcher.era>=4.50?'#22c55e':pitcher.era>=3.50?'#f59e0b':'#ef4444'):"#94a3b8"}}>{v}</b></span>
                  ))}
                </div>
              </div>
            ):(
              <div style={{marginBottom:10,padding:"6px 8px",background:"#0f172a",borderRadius:6,fontSize:11,color:"#475569"}}>
                SP: TBD · team ERA <b style={{color:teamEra>=4.50?'#22c55e':teamEra>=3.50?'#f59e0b':'#ef4444'}}>{teamEra?.toFixed(2)||"—"}</b>
              </div>
            )}
            {(lineup||[]).map((entry,i)=>{
              const spot=i+1;
              if(!entry) return(
                <div key={spot} style={{display:"flex",alignItems:"center",gap:6,padding:"4px 6px",marginBottom:1}}>
                  <span style={{width:18,color:"#334155",fontSize:11,fontWeight:700}}>{spot}.</span>
                  <span style={{color:"#334155",fontSize:12}}>TBD</span>
                </div>
              );
              const {player}=entry, pred=predCache[player.player_name];
              const sc=pred?TIER_COLOR[pred.tier]:"#64748b";
              const diff=player.typicalSpot&&player.typicalSpot!==spot;
              return(
                <div key={spot} style={{display:"flex",alignItems:"center",gap:6,padding:"4px 6px",marginBottom:1,borderRadius:4,background:spot===3||spot===4?"rgba(255,255,255,0.02)":"transparent"}}>
                  <span style={{width:18,color:"#475569",fontSize:11,fontWeight:700,flexShrink:0}}>{spot}.</span>
                  <span style={{flex:1,fontSize:12,fontWeight:600,color:"#e2e8f0",overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis"}}>
                    {player.player_name}
                    {diff&&<span style={{color:"#334155",fontSize:9,marginLeft:3}} title={`usually bats ${player.typicalSpot}`}>†</span>}
                  </span>
                  <span style={{fontSize:10,color:"#64748b",width:26,flexShrink:0}}>{player.position?.split(",")[0]||"—"}</span>
                  <span style={{fontSize:11,fontWeight:700,color:wobaColor(player.avgWoba),width:36,flexShrink:0}}>{player.avgWoba?.toFixed(3)||"—"}</span>
                  {pred&&<span style={{fontSize:11,fontWeight:700,color:sc,width:26,flexShrink:0,textAlign:"right"}}>{pred.score}{tierIcon(pred.tier)}</span>}
                </div>
              );
            })}
            {!lineup&&<div style={{color:"#475569",fontSize:12,padding:8,textAlign:"center"}}>Select a game to build lineup</div>}
          </div>
        );
      };

      return(
        <div>
          {/* Team + game selector */}
          <div style={{background:"#1e293b",borderRadius:12,padding:16,marginBottom:16}}>
            <div style={{display:"flex",gap:10,alignItems:"center",marginBottom:12,flexWrap:"wrap"}}>
              <span style={{fontSize:12,color:"#64748b",fontWeight:700}}>MY TEAM</span>
              <select value={myTeam} onChange={e=>{setMyTeam(e.target.value);setSelectedGame(null);}}
                style={{background:"#0f172a",border:"1px solid #334155",borderRadius:6,padding:"6px 10px",color:"#f1f5f9",fontSize:12,cursor:"pointer"}}>
                <option value="">Select team…</option>
                {teams.map(t=><option key={t} value={t}>{t}</option>)}
              </select>
              {schedLoading&&<span style={{fontSize:12,color:"#64748b"}}>Loading schedule…</span>}
            </div>
            {schedule&&schedule.games.length>0&&(
              <div style={{display:"flex",gap:8,overflowX:"auto",paddingBottom:4}}>
                {schedule.games.map((game,i)=>{
                  const isSel=selectedGame===game;
                  const fc=game.factor>1.05?'#22c55e':game.factor<0.95?'#ef4444':'#f59e0b';
                  return(
                    <div key={i} onClick={()=>setSelectedGame(game)} style={{
                      flexShrink:0, padding:"8px 12px", borderRadius:8, cursor:"pointer", minWidth:110,
                      background:isSel?"#334155":"#0f172a",
                      border:`1px solid ${isSel?"#3b82f6":"#1e293b"}`,
                      outline:isSel?"2px solid #3b82f640":"none",
                    }}>
                      <div style={{fontSize:10,color:"#64748b",marginBottom:2}}>{game.date}</div>
                      <div style={{fontSize:13,fontWeight:700,color:"#e2e8f0"}}>vs {game.opponent}</div>
                      {game.detail?.pitcher?(
                        <div style={{fontSize:10,color:"#94a3b8",marginTop:2}}>{game.detail.pitcher.name.split(" ").pop()} <span style={{color:"#475569"}}>({game.detail.pitcher.hand}HP)</span></div>
                      ):<div style={{fontSize:10,color:"#334155",marginTop:2}}>SP TBD</div>}
                      {game.factor!=null&&<div style={{fontSize:10,color:fc,marginTop:1}}>{game.factor>1.05?"Favorable":game.factor<0.95?"Tough":"Even"}</div>}
                    </div>
                  );
                })}
              </div>
            )}
            {schedule&&schedule.games.length===0&&<div style={{color:"#475569",fontSize:12}}>No upcoming games found in the next 14 days.</div>}
          </div>

          {/* Lineups */}
          {(()=>{
            // Compute predicted runs for suggested + likely lineups (forward-looking)
            const oppEra = selectedGame?.detail?.pitcher?.era ?? selectedGame?.detail?.teamEra ?? LEAGUE_AVG_ERA;
            const oppWinPct = selectedGame?.detail?.teamWinPct ?? 0.500;
            // Our team: ERA we face + our win% for quality discount
            const myEra = selectedGame?.detail?.pitcher?.era ?? selectedGame?.detail?.teamEra ?? LEAGUE_AVG_ERA;
            // Opponent lineup avg wOBA — passed as oppLineupWoba so run estimate blends wOBA+win%
            const oppLineupAvgWoba = oppLineup?.length ? (()=>{
              const entries = oppLineup.filter(Boolean);
              if(!entries.length) return null;
              return +(entries.reduce((s,e)=>s+(e.player?.avgWoba||0.310),0)/entries.length).toFixed(3);
            })() : null;
            const lineupPred = (lineup) => {
              if(!lineup) return null;
              const wobas = lineup.filter(Boolean).map(e=>e.player?.avgWoba||0.310);
              const scores = lineup.filter(Boolean).map(e=>{
                const pr = predCache[e.player?.player_name];
                return pr?.score||50;
              });
              if(!wobas.length) return null;
              return _predictGame(wobas, scores, myEra, oppWinPct, oppLineupAvgWoba, myWinPct);
            };
            // Pad to 9 entries so LineupCard renders all spots
            const likelyLineupArr = likelyLineup
              ? Array.from({length:9},(_,i)=>likelyLineup[i]?{player:likelyLineup[i].player,spotScore:0}:null)
              : null;
            const likelyPred = selectedGame ? lineupPred(likelyLineupArr) : null;

            // Opponent prediction: independent _predictGame call (mirrors Today's Games approach)
            // Opponent faces our team ERA; our win% becomes their opponent win%
            const SPOT_WEIGHTS = [1.15,1.12,1.10,1.05,1.02,0.95,0.90,0.88,0.83];
            const oppAvgWoba = oppLineup?.length ? (()=>{
              const entries = oppLineup.filter(Boolean);
              const weightSum = entries.reduce((_,__,i)=>_+(SPOT_WEIGHTS[i]??0.83),0);
              const weighted  = entries.reduce((s,e,i)=>s+(e.player?.avgWoba||0.310)*(SPOT_WEIGHTS[i]??0.83),0);
              return +(weighted/weightSum).toFixed(3);
            })() : null;
            const oppScores = oppLineup?.length
              ? oppLineup.filter(Boolean).map(e=>predCache[e.player?.player_name]?.score||50)
              : Array(9).fill(50);
            const oppWobas = oppLineup?.length
              ? oppLineup.filter(Boolean).map(e=>e.player?.avgWoba||0.310)
              : Array(9).fill(oppAvgWoba||0.310);
            // Opponent faces our team's actual ERA (fetched from standings in fetchUpcomingSchedule)
            const rawOppPred = likelyPred && oppWobas.length
              ? _predictGame(oppWobas, oppScores, myTeamEra, myWinPct, null, oppWinPct)
              : null;
            // Normalise so both win probs sum to 1 (same as Today's Games)
            const rawMyProb  = likelyPred?.winProb ?? 0.5;
            const rawOppProb = rawOppPred?.winProb ?? (1 - rawMyProb);
            const probSum = rawMyProb + rawOppProb;
            const normMyProb  = probSum > 0 ? +(rawMyProb  / probSum).toFixed(3) : 0.500;
            const normOppProb = probSum > 0 ? +(rawOppProb / probSum).toFixed(3) : 0.500;
            const oppPred = rawOppPred ? {
              predictedRuns: rawOppPred.predictedRuns,
              predictedWoba: oppAvgWoba,
              predictedWin:  normOppProb >= 0.5,
              winProb:       normOppProb,
              oppRunsEst:    rawOppPred.oppRunsEst,
            } : null;
            // Patch likelyPred win prob with normalised value
            const myPred = likelyPred ? {...likelyPred, winProb: normMyProb, predictedWin: normMyProb >= 0.5} : null;

            const wobaVarianceColor = (mine, theirs) => {
              if(mine==null||theirs==null) return "#64748b";
              const pct = (mine - theirs) / theirs;
              if(pct >= 0.03)  return "#22c55e";
              if(pct >= 0.01)  return "#a3e635";
              if(pct >= -0.01) return "#f59e0b";
              if(pct >= -0.03) return "#fb923c";
              return "#ef4444";
            };
            const myWoba   = myPred?.predictedWoba ?? null;
            const oppWoba  = oppPred?.predictedWoba ?? null;

            const PredStrip = ({pred, color, wobaColor: wc2}) => {
              if(!pred||!selectedGame) return null;
              const wp = Math.round(pred.winProb*100);
              const wc = wp>=55?"#22c55e":wp>=45?"#f59e0b":"#ef4444";
              return(
                <div style={{display:"flex",gap:12,alignItems:"center",padding:"6px 8px",background:"#0f172a",borderRadius:6,marginBottom:8,fontSize:11}}>
                  <span style={{color:"#475569"}}>Predicted:</span>
                  <span style={{color:wc,fontWeight:700}}>{pred.predictedRuns}R</span>
                  <span style={{color:wc,fontWeight:700}}>{wp}% win</span>
                  <span style={{color:wc,fontWeight:700}}>{pred.predictedWin?"▲ W":"▼ L"}</span>
                  {pred.predictedWoba!=null&&<span style={{color:wc2||"#64748b",fontSize:10}}>avg wOBA {pred.predictedWoba.toFixed(3)}</span>}
                  <span style={{marginLeft:"auto",fontSize:9,color:"#334155",fontStyle:"italic"}}>historical batting order · may differ from Today's Games</span>
                </div>
              );
            };

            return(
              <div style={{display:"flex",gap:12,alignItems:"flex-start",marginBottom:4,flexWrap:"wrap"}}>
                {/* My lineup — official if confirmed, otherwise historical */}
                <div style={{flex:1,minWidth:0}}>
                  <PredStrip pred={myPred} color="#22c55e" wobaColor={wobaVarianceColor(myWoba, oppWoba)}/>
                  <LineupCard
                    title={confirmedLineup
                      ? `${myTeam||"My Team"} — Official ✓`
                      : `${myTeam||"My Team"} — Historical`}
                    lineup={likelyLineupArr}
                    accentColor={confirmedLineup?"#f472b6":"#22c55e"}
                    pitcher={null}
                    teamEra={null}
                    teamWinPct={null}
                  />
                </div>
                {/* Opponent — official if confirmed, otherwise historical */}
                <div style={{flex:1,minWidth:0}}>
                  <PredStrip pred={oppPred} color="#f59e0b" wobaColor={wobaVarianceColor(oppWoba, myWoba)}/>
                  <LineupCard
                    title={confirmedLineup
                      ? `${selectedGame?.detail?.teamFullName||selectedGame?.opponent||"Opponent"} — Official ✓`
                      : (selectedGame?.detail?.teamFullName||selectedGame?.opponent||"Opponent")}
                    lineup={oppLineup}
                    accentColor={confirmedLineup?"#f472b6":"#f59e0b"}
                    pitcher={selectedGame?.detail?.pitcher||null}
                    teamEra={selectedGame?.detail?.teamEra||null}
                    teamWinPct={selectedGame?.detail?.teamWinPct??null}
                  />
                </div>
              </div>
            );
          })()}

          {/* Legend */}
          {(likelyLineup||oppLineup)&&(
            <div style={{fontSize:10,color:"#334155",marginBottom:12}}>
              <span style={{color:"#22c55e"}}>Historical</span> = players ranked by most common batting spot in our DB (not guaranteed to start) ·
              † = batting outside historical spot · wOBA: <span style={{color:"#22c55e"}}>elite ≥.370</span> · <span style={{color:"#a3e635"}}>.320+</span> · <span style={{color:"#f59e0b"}}>.280+</span> · <span style={{color:"#ef4444"}}>&lt;.280</span>
            </div>
          )}

          {/* AI brief */}
          {myLineup&&selectedGame&&(
            <div style={{background:"#1e293b",borderRadius:12,padding:16}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:aiSummary?12:0}}>
                <span style={{fontWeight:700,fontSize:13,color:"#94a3b8"}}>Manager's Pregame Brief</span>
                <button onClick={generateAI} disabled={aiLoading}
                  style={{padding:"7px 16px",borderRadius:8,border:"none",cursor:aiLoading?"not-allowed":"pointer",
                    fontWeight:700,fontSize:12,background:"#3b82f6",color:"#fff",opacity:aiLoading?0.6:1}}>
                  {aiLoading?"Generating…":"Generate Brief"}
                </button>
              </div>
              {aiSummary&&<div style={{fontSize:13,color:"#cbd5e1",lineHeight:1.7,whiteSpace:"pre-wrap"}}>{aiSummary}</div>}
            </div>
          )}

          {/* ── Monte Carlo Sim ── */}
          {selectedGame&&(
            <MonteCarloSimPanel
              myTeam={myTeam}
              selectedGame={selectedGame}
              likelyLineup={likelyLineup}
              oppLineup={oppLineup}
              sbUrl={sbUrl}
              sbKey={sbKey}
              onOfficialLineup={handleOfficialLineup}
            />
          )}

          {/* ── Backtest Panel ── */}
          {myTeam&&(
            <div style={{background:"#1e293b",borderRadius:12,padding:16,marginTop:16}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:btResult||btError?12:0}}>
                <div>
                  <span style={{fontWeight:700,fontSize:13,color:"#94a3b8"}}>Prediction Backtest</span>
                  <span style={{fontSize:11,color:"#475569",marginLeft:8}}>last 3 weeks · {myTeam}</span>
                </div>
                <button onClick={runBacktest} disabled={btLoading}
                  style={{padding:"7px 16px",borderRadius:8,border:"none",cursor:btLoading?"not-allowed":"pointer",
                    fontWeight:700,fontSize:12,background:"#7c3aed",color:"#fff",opacity:btLoading?0.6:1}}>
                  {btLoading?"Running…":"Run Backtest"}
                </button>
              </div>

              {btError&&<div style={{color:"#ef4444",fontSize:12,padding:"8px 0"}}>{btError}</div>}

              {btResult&&(()=>{
                const r = btResult;
                const wobaColor = w => !w?'#64748b':w>=.370?'#22c55e':w>=.320?'#a3e635':w>=.280?'#f59e0b':'#ef4444';

                const SummaryGroup = ({label, accentColor, summary}) => {
                  if(!summary) return null;
                  const wp = Math.round(summary.winAccuracy*100);
                  const wc = wp>=60?"#22c55e":wp>=50?"#f59e0b":"#ef4444";
                  const rc = summary.avgRunMAE<=1.5?"#22c55e":summary.avgRunMAE<=2.5?"#f59e0b":"#ef4444";
                  const wbAcc = summary.avgWobaMAE!=null?(Math.max(0,1-summary.avgWobaMAE/0.100)*100).toFixed(0):null;
                  const wbC = wbAcc>=80?"#22c55e":wbAcc>=65?"#f59e0b":"#ef4444";
                  return(
                    <div style={{flex:1,minWidth:220,background:"#0f172a",borderRadius:8,padding:"10px 12px",borderTop:`2px solid ${accentColor}`}}>
                      <div style={{fontSize:10,fontWeight:700,color:accentColor,marginBottom:8,textTransform:"uppercase",letterSpacing:0.8}}>{label}</div>
                      <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
                        {[
                          ["W/L Acc", wp+"%", wc, summary.gamesEval+"g"],
                          ["Run MAE", summary.avgRunMAE+" R", rc, "avg error"],
                          wbAcc!=null&&["wOBA Acc", wbAcc+"%", wbC, "MAE "+summary.avgWobaMAE],
                        ].filter(Boolean).map(([lbl,val,col,sub],j)=>(
                          <div key={j} style={{minWidth:70}}>
                            <div style={{fontSize:9,color:"#475569"}}>{lbl}</div>
                            <div style={{fontSize:16,fontWeight:800,color:col,lineHeight:1.2}}>{val}</div>
                            <div style={{fontSize:9,color:"#334155"}}>{sub}</div>
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                };

                // ── Statistical summary panel ──────────────────────────────
                const validGames = r.games.filter(g=>g.actual);
                const n = validGames.length;
                // W/L correct count
                const correct = validGames.filter(g=>g.actual.predictedWin===g.actualWin).length;
                const pctCorrect = n ? Math.round(correct/n*100) : null;
                // Brier score: mean((p_win - actual_win)^2) — lower is better; 0.25 = random
                const brierScore = n ? +(validGames.reduce((s,g)=>{
                  const p = g.actual.winProb;
                  const a = g.actualWin ? 1 : 0;
                  return s + (p-a)*(p-a);
                },0)/n).toFixed(3) : null;
                // Brier skill score vs random baseline (0.25): higher=better, 1=perfect, 0=no better than random
                const bss = brierScore!=null ? +(1 - brierScore/0.25).toFixed(3) : null;
                // Calibration: avg predicted win prob vs actual win rate
                const avgPredWinProb = n ? +(validGames.reduce((s,g)=>s+g.actual.winProb,0)/n).toFixed(3) : null;
                const actualWinRate  = n ? +(validGames.filter(g=>g.actualWin).length/n).toFixed(3) : null;
                const calibrationErr = avgPredWinProb!=null&&actualWinRate!=null ? +(Math.abs(avgPredWinProb-actualWinRate)).toFixed(3) : null;
                // Run MAE from actual-lineup predictions
                const runMAE = n ? +(validGames.reduce((s,g)=>s+g.actual.runError,0)/n).toFixed(2) : null;

                const pctCol = pctCorrect==null?"#475569":pctCorrect>=60?"#22c55e":pctCorrect>=50?"#f59e0b":"#ef4444";
                const bssCol = bss==null?"#475569":bss>=0.10?"#22c55e":bss>=0?"#f59e0b":"#ef4444";
                const calCol = calibrationErr==null?"#475569":calibrationErr<=0.05?"#22c55e":calibrationErr<=0.10?"#f59e0b":"#ef4444";
                const runCol = runMAE==null?"#475569":runMAE<=1.5?"#22c55e":runMAE<=2.5?"#f59e0b":"#ef4444";

                return(
                  <div>
                    {/* Summary accuracy cards */}
                    <div style={{display:"flex",gap:10,marginBottom:12,flexWrap:"wrap"}}>
                      <SummaryGroup label="Actual Lineup (box score)" accentColor="#22c55e" summary={r.actualSummary}/>
                      <SummaryGroup label="Suggested Lineup (optimizer)" accentColor="#3b82f6" summary={r.suggestedSummary}/>
                    </div>

                    {/* Statistical summary panel */}
                    {n>0&&(
                      <div style={{background:"#0f172a",borderRadius:8,padding:"12px 14px",marginBottom:12,borderTop:"2px solid #7c3aed"}}>
                        <div style={{fontSize:10,fontWeight:700,color:"#7c3aed",marginBottom:10,textTransform:"uppercase",letterSpacing:0.8}}>
                          Statistical Summary · {n} games
                        </div>
                        <div style={{display:"flex",gap:16,flexWrap:"wrap"}}>
                          {/* W/L Accuracy */}
                          <div style={{minWidth:80}}>
                            <div style={{fontSize:9,color:"#475569",marginBottom:2}}>W/L Correct</div>
                            <div style={{fontSize:22,fontWeight:800,color:pctCol,lineHeight:1}}>{pctCorrect!=null?pctCorrect+"%":"—"}</div>
                            <div style={{fontSize:9,color:"#334155",marginTop:2}}>{correct}/{n} games</div>
                          </div>
                          {/* Brier Skill Score */}
                          <div style={{minWidth:80}}>
                            <div style={{fontSize:9,color:"#475569",marginBottom:2}}>Brier Skill Score</div>
                            <div style={{fontSize:22,fontWeight:800,color:bssCol,lineHeight:1}}>{bss!=null?bss:"—"}</div>
                            <div style={{fontSize:9,color:"#334155",marginTop:2}}>0=random · 1=perfect</div>
                          </div>
                          {/* Calibration */}
                          <div style={{minWidth:80}}>
                            <div style={{fontSize:9,color:"#475569",marginBottom:2}}>Calibration Error</div>
                            <div style={{fontSize:22,fontWeight:800,color:calCol,lineHeight:1}}>{calibrationErr!=null?calibrationErr:"—"}</div>
                            <div style={{fontSize:9,color:"#334155",marginTop:2}}>pred {avgPredWinProb!=null?Math.round(avgPredWinProb*100)+"%":"—"} vs act {actualWinRate!=null?Math.round(actualWinRate*100)+"%":"—"}</div>
                          </div>
                          {/* Run MAE */}
                          <div style={{minWidth:80}}>
                            <div style={{fontSize:9,color:"#475569",marginBottom:2}}>Run MAE</div>
                            <div style={{fontSize:22,fontWeight:800,color:runCol,lineHeight:1}}>{runMAE!=null?runMAE+"R":"—"}</div>
                            <div style={{fontSize:9,color:"#334155",marginTop:2}}>avg runs off</div>
                          </div>
                          {/* Legend */}
                          <div style={{marginLeft:"auto",fontSize:9,color:"#334155",lineHeight:1.8,alignSelf:"center"}}>
                            <div><span style={{color:"#22c55e"}}>●</span> Good &nbsp;<span style={{color:"#f59e0b"}}>●</span> OK &nbsp;<span style={{color:"#ef4444"}}>●</span> Poor</div>
                            <div>W/L: ≥60% good · ≥50% ok</div>
                            <div>BSS: ≥0.10 good · ≥0 ok</div>
                            <div>Cal: ≤0.05 good · ≤0.10 ok</div>
                          </div>
                        </div>
                      </div>
                    )}

                    {/* How to read */}
                    <div style={{background:"#0f172a",borderRadius:8,padding:"10px 12px",marginBottom:12,fontSize:11,color:"#64748b",lineHeight:1.7}}>
                      <div style={{fontWeight:700,color:"#94a3b8",marginBottom:4}}>How to read these results</div>
                      <div><span style={{color:"#22c55e",fontWeight:700}}>Act:</span> prediction if we had known the actual lineup that played · <span style={{color:"#3b82f6",fontWeight:700}}>Sug:</span> prediction from the optimizer's top-9 pick</div>
                      <div><b style={{color:"#e2e8f0"}}>X.XR</b> = predicted runs scored by our team · <b style={{color:"#e2e8f0"}}>Y%</b> = modeled win probability · <b style={{color:"#22c55e"}}>W</b>/<b style={{color:"#ef4444"}}>L</b> = predicted outcome (win if ≥50%)</div>
                      <div><b style={{color:"#e2e8f0"}}>✓</b> = predicted W/L matched the actual result · <b style={{color:"#ef4444"}}>✗</b> = mismatch · <b style={{color:"#e2e8f0"}}>wOBA</b> = team weighted on-base avg for that game</div>
                      <div style={{marginTop:2}}>Run color: <span style={{color:"#22c55e"}}>green</span> = &lt;1 run off · <span style={{color:"#f59e0b"}}>amber</span> = 1–2 runs off · <span style={{color:"#ef4444"}}>red</span> = &gt;2 runs off. Click any row to expand both lineups.</div>
                    </div>

                    {/* Column headers */}
                    <div style={{display:"grid",gridTemplateColumns:"82px 68px 1fr 1fr 1fr 20px",
                      gap:0,padding:"4px 10px",marginBottom:2}}>
                      <span style={{fontSize:9,color:"#334155",fontWeight:700}}>DATE</span>
                      <span style={{fontSize:9,color:"#334155",fontWeight:700}}>OPP</span>
                      <span style={{fontSize:9,color:"#334155",fontWeight:700}}>SP</span>
                      <span style={{fontSize:9,color:"#22c55e",fontWeight:700,paddingRight:8}}>US (pred → actual)</span>
                      <span style={{fontSize:9,color:"#f59e0b",fontWeight:700,paddingLeft:8}}>THEM (pred → actual)</span>
                      <span/>
                    </div>

                    {r.games.map((g,i)=>(
                      <BtGameRow key={i} g={g} idx={i} wobaColor={wobaColor}/>
                    ))}

                    <div style={{marginTop:10,fontSize:10,color:"#334155"}}>
                      Runs color: <span style={{color:"#22c55e"}}>green</span> ≤1 off · <span style={{color:"#f59e0b"}}>amber</span> 1–2 off · <span style={{color:"#ef4444"}}>red</span> &gt;2 off.
                      Opp runs estimated from opponent win% (offensive proxy). Season wOBA used for lineup — isolates roster quality vs matchup. Click row for actual lineup.
                    </div>
                  </div>
                );
              })()}
            </div>
          )}
        </div>
      );
    }

    // ── Pitchers Tab Component ────────────────────────────────────────────────
    function PitchersTab({ dataSource, sbUrl, sbKey, teamFilter }) {
      const [pitchers, setPitchers]         = useState([]);
      const [loading, setLoading]           = useState(true);
      const [error, setError]               = useState("");
      const [selected, setSelected]         = useState(null);
      const [sortBy, setSortBy]             = useState("predictionScore");
      const [pitcherView, setPitcherView]   = useState("trends");
      const [insight, setInsight]           = useState({});
      const [insightLoading, setInsightLoading] = useState({});
      const [search, setSearch]             = useState("");
      const [pitcherTeam, setPitcherTeam]   = useState("ALL");

      useEffect(() => {
        setLoading(true); setError(""); setPitchers([]); setSelected(null);
        if (dataSource === "live" && sbUrl && sbKey) {
          fetchPitchersFromDB(sbUrl, sbKey)
            .then(data => {
              if (!data.length) {
                setError("pitcher_gamelogs returned 0 rows. Check: (1) Supabase RLS — anon key needs SELECT policy on pitcher_gamelogs, (2) table has data for season " + SEASON + ".");
                return;
              }
              const sorted = data.sort((a,b) => b.predictionScore - a.predictionScore);
              setPitchers(sorted);
              setSelected(sorted[0] || null);
            })
            .catch(e => setError(e.message))
            .finally(() => setLoading(false));
        } else {
          // MLB API mode — pitchers require Live DB
          setPitchers([]);
          setSelected(null);
          setLoading(false);
        }
      }, [dataSource, sbUrl, sbKey]);

      const handleInsight = async (pitcher) => {
        setInsightLoading(prev => ({...prev, [pitcher.name]: true}));
        const summary = pitcher.gamelogs.slice(-10).map(g => {
          const ip = parseFloat(g.innings_pitched);
          const ks = parseFloat(g.strikeouts);
          const k9 = g.k_per_9 != null ? parseFloat(g.k_per_9).toFixed(1) : (ip > 0 && !isNaN(ks) ? ((ks / ip) * 9).toFixed(1) : '?');
          return `${g.game_date}: ERA ${g.era ?? '?'}, WHIP ${g.whip ?? '?'}, K/9 ${k9}, IP ${g.innings_pitched ?? '?'}`;
        }).join('\n');
        try {
          const res = await fetch('/api/scout', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              prompt: `You are a baseball analytics AI. Analyze ${pitcher.name}'s recent pitching performance:\n${summary}\n\nIn 3-4 sentences: describe the trend in ERA/WHIP/K9, identify any cycle or pattern (cycle length: ${pitcher.dominantCycleDays ?? 'unknown'} starts, prediction score: ${pitcher.predictionScore}/99), and give a concrete fantasy/lineup recommendation for the next 2-3 starts.`
            })
          });
          if (!res.ok) throw new Error(`API ${res.status}`);
          const d = await res.json();
          setInsight(prev => ({...prev, [pitcher.name]: d.text || d.insight || 'No insight returned.'}));
        } catch(e) {
          const msg = e.message === 'Failed to fetch'
            ? 'AI Scout requires the Vercel deployment — not available when running locally.'
            : 'Error: ' + e.message;
          setInsight(prev => ({...prev, [pitcher.name]: msg}));
        }
        setInsightLoading(prev => ({...prev, [pitcher.name]: false}));
      };

      const s = {
        card: {background:"#1e293b",borderRadius:12,padding:16},
        btn: (active, color="#3b82f6") => ({padding:"7px 14px",borderRadius:8,border:"none",cursor:"pointer",fontWeight:700,fontSize:12,background:active?color:"#334155",color:active?"#fff":"#94a3b8"}),
      };

      const teams = ["ALL", ...Array.from(new Set(pitchers.map(p => p.team).filter(Boolean))).sort()];

      const sorted = [...pitchers]
        .filter(p =>
          (pitcherTeam === "ALL" || p.team === pitcherTeam) &&
          p.name.toLowerCase().includes(search.toLowerCase())
        )
        .sort((a, b) => {
          if (sortBy === 'predictionScore') return b.predictionScore - a.predictionScore;
          if (sortBy === 'era')  return parseFloat(a.era)  - parseFloat(b.era);
          if (sortBy === 'whip') return parseFloat(a.whip) - parseFloat(b.whip);
          if (sortBy === 'k9')   return parseFloat(b.k9)   - parseFloat(a.k9);
          return 0;
        });

      if (loading) return <div style={{...s.card,textAlign:"center",padding:60,color:"#64748b"}}>Loading pitcher data…</div>;
      if (error)   return <div style={{...s.card,padding:20,color:"#fca5a5"}}>⚠️ {error}</div>;
      if (!pitchers.length) return <div style={{...s.card,textAlign:"center",padding:60,color:"#64748b"}}>No pitcher data found.</div>;

      return (
        <div style={{display:"grid",gridTemplateColumns:"260px 1fr",gap:16,alignItems:"start"}}>

          {/* Pitcher sidebar */}
          <div style={{...s.card,padding:12}}>
            <div style={{fontSize:12,fontWeight:700,color:"#94a3b8",marginBottom:10}}>PITCHERS</div>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Search…"
              style={{background:"#0f172a",border:"1px solid #334155",borderRadius:6,padding:"7px 10px",color:"#f1f5f9",fontSize:12,width:"100%",boxSizing:"border-box",marginBottom:8}}/>
            {dataSource === "live" && (
              <select value={pitcherTeam} onChange={e=>setPitcherTeam(e.target.value)}
                style={{background:"#0f172a",border:"1px solid #334155",borderRadius:6,padding:"7px 10px",color:"#f1f5f9",fontSize:12,width:"100%",boxSizing:"border-box",marginBottom:8,cursor:"pointer"}}>
                {teams.map(t => <option key={t} value={t}>{t === "ALL" ? "All Teams" : t}</option>)}
              </select>
            )}
            <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap"}}>
              {[["predictionScore","🔮 Score"],["era","ERA"],["whip","WHIP"],["k9","K/9"]].map(([v,label])=>(
                <button key={v} onClick={()=>setSortBy(v)}
                  style={{...s.btn(sortBy===v,"#a855f7"),flex:1,padding:"4px 6px",fontSize:10,minWidth:0}}>
                  {label}
                </button>
              ))}
            </div>
            <div style={{maxHeight:480,overflowY:"auto",fontSize:12}}>
              {sorted.length === 0 && (
                <div style={{color:"#475569",fontStyle:"italic",padding:8}}>No pitchers match.</div>
              )}
              {sorted.map((p, rank) => {
                const isSel = selected?.name === p.name;
                const color = scoreColor(p.predictionScore);
                return (
                  <div key={p.name} onClick={() => { setSelected(p); setPitcherView("trends"); }}
                    style={{padding:"8px 10px",borderRadius:6,cursor:"pointer",marginBottom:3,
                      background:isSel?"#7c3aed":"transparent"}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3}}>
                      <span style={{color:isSel?"#fff":"#cbd5e1",fontWeight:isSel?700:400,fontSize:12}}>
                        <span style={{color:isSel?"rgba(255,255,255,0.5)":"#475569",marginRight:5,fontSize:10}}>#{rank+1}</span>
                        {p.name}
                      </span>
                      <span style={{fontSize:11,fontWeight:700,color:isSel?"#fff":color}}>{p.predictionScore}</span>
                    </div>
                    {!isSel && (
                      <div style={{fontSize:10,color:"#64748b"}}>
                        {p.team && <div style={{color:"#475569",marginBottom:2}}>{p.team}</div>}
                        <div style={{display:"flex",gap:8}}>
                          <span>ERA <b style={{color:"#94a3b8"}}>{p.era}</b></span>
                          <span>WHIP <b style={{color:"#94a3b8"}}>{p.whip}</b></span>
                          <span>K/9 <b style={{color:"#94a3b8"}}>{p.k9}</b></span>
                        </div>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>

          {/* Pitcher detail */}
          {selected && (
            <div>
              {/* Header */}
              <div style={{...s.card,marginBottom:12,borderLeft:"4px solid #a855f7",display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:12}}>
                <div style={{flex:1,minWidth:200}}>
                  <div style={{fontSize:18,fontWeight:800}}>{selected.name}</div>
                  {selected.team && <div style={{fontSize:12,color:"#7c3aed",fontWeight:600,marginTop:1}}>{selected.team}</div>}
                  <div style={{fontSize:12,color:"#64748b",marginTop:2}}>
                    {selected.dominantCycleDays ? `Dominant cycle: ${selected.dominantCycleDays} starts` : "Cycle: analyzing…"}
                    {" · "}FFT Score {selected.predictionScore}/99
                  </div>
                  <div style={{display:"flex",alignItems:"center",gap:10,marginTop:8}}>
                    <div style={{flex:1,maxWidth:200,height:8,background:"#0f172a",borderRadius:8,overflow:"hidden"}}>
                      <div style={{width:`${selected.predictionScore}%`,height:"100%",background:scoreColor(selected.predictionScore),borderRadius:8,transition:"width 0.4s"}}/>
                    </div>
                    <span style={{fontSize:13,fontWeight:700,color:scoreColor(selected.predictionScore)}}>{selected.predictionScore}</span>
                  </div>
                </div>
                <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                  {[["ERA",selected.era],["WHIP",selected.whip],["K/9",selected.k9]].map(([l,v])=>(
                    <div key={l} style={{background:"#0f172a",borderRadius:8,padding:"6px 12px",textAlign:"center",minWidth:52}}>
                      <div style={{fontSize:10,color:"#64748b"}}>{l}</div>
                      <div style={{fontSize:16,fontWeight:800}}>{v}</div>
                    </div>
                  ))}
                </div>
              </div>

              {/* View tabs */}
              <div style={{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap"}}>
                {[["trends","📈 ERA/WHIP"],["k9","🔥 K/9"],["forecast","🔮 Forecast"],["log","📋 Game Log"]].map(([v,label])=>(
                  <button key={v} onClick={()=>setPitcherView(v)} style={s.btn(pitcherView===v,"#7c3aed")}>{label}</button>
                ))}
              </div>

              {/* ERA / WHIP trend */}
              {pitcherView === "trends" && (() => {
                const chartData = selected.gamelogs.map(g => ({
                  date: g.game_date.slice(5),
                  era:  parseFloat(g.era)  || null,
                  whip: parseFloat(g.whip) || null,
                }));
                return (
                  <div style={{...s.card,padding:"20px 12px 12px"}}>
                    <div style={{fontSize:12,color:"#64748b",marginBottom:12}}>ERA & WHIP per start (last {selected.gamelogs.length} starts)</div>
                    <ResponsiveContainer width="100%" height={220}>
                      <ComposedChart data={chartData} margin={{left:-10,right:10}}>
                        <CartesianGrid strokeDasharray="3 3" stroke="#334155"/>
                        <XAxis dataKey="date" tick={{fontSize:9,fill:"#64748b"}} interval={Math.max(1,Math.floor(chartData.length/7))}/>
                        <YAxis yAxisId="era"  domain={['auto','auto']} tick={{fontSize:10,fill:"#64748b"}} label={{value:"ERA",angle:-90,position:"insideLeft",fontSize:10,fill:"#64748b"}}/>
                        <YAxis yAxisId="whip" orientation="right" domain={['auto','auto']} tick={{fontSize:10,fill:"#64748b"}} label={{value:"WHIP",angle:90,position:"insideRight",fontSize:10,fill:"#64748b"}}/>
                        <Tooltip formatter={(v,n)=>[v?.toFixed(2),n.toUpperCase()]}
                          contentStyle={{background:"#1e293b",border:"1px solid #334155",borderRadius:8,fontSize:12}}/>
                        <Legend wrapperStyle={{fontSize:11}}/>
                        <Line yAxisId="era"  type="monotone" dataKey="era"  stroke="#f87171" strokeWidth={2} dot={{r:3,fill:"#f87171"}} name="ERA"/>
                        <Line yAxisId="whip" type="monotone" dataKey="whip" stroke="#60a5fa" strokeWidth={2} dot={{r:3,fill:"#60a5fa"}} name="WHIP"/>
                      </ComposedChart>
                    </ResponsiveContainer>
                  </div>
                );
              })()}

              {/* K/9 trend */}
              {pitcherView === "k9" && (() => {
                const chartData = selected.gamelogs.map(g => {
                  const ip = parseFloat(g.innings_pitched);
                  const ks = parseFloat(g.strikeouts);
                  const k9raw = g.k_per_9 != null ? parseFloat(g.k_per_9) : (ip > 0 && !isNaN(ks) ? (ks / ip) * 9 : null);
                  return {
                    date: g.game_date.slice(5),
                    k9:   k9raw != null ? +k9raw.toFixed(1) : null,
                    ip:   ip > 0 ? ip : null,
                  };
                });
                return (
                  <div style={{...s.card,padding:"20px 12px 12px"}}>
                    <div style={{fontSize:12,color:"#64748b",marginBottom:12}}>K/9 & Innings Pitched per start</div>
                    <ResponsiveContainer width="100%" height={220}>
                      <ComposedChart data={chartData} margin={{left:-10,right:10}}>
                        <defs>
                          <linearGradient id="k9Grad" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="5%"  stopColor="#a78bfa" stopOpacity={0.4}/>
                            <stop offset="95%" stopColor="#a78bfa" stopOpacity={0}/>
                          </linearGradient>
                        </defs>
                        <CartesianGrid strokeDasharray="3 3" stroke="#334155"/>
                        <XAxis dataKey="date" tick={{fontSize:9,fill:"#64748b"}} interval={Math.max(1,Math.floor(chartData.length/7))}/>
                        <YAxis yAxisId="k9" domain={['auto','auto']} tick={{fontSize:10,fill:"#64748b"}}/>
                        <YAxis yAxisId="ip" orientation="right" domain={[0,10]} tick={{fontSize:10,fill:"#64748b"}}/>
                        <Tooltip formatter={(v,n)=>[v?.toFixed(1),n]}
                          contentStyle={{background:"#1e293b",border:"1px solid #334155",borderRadius:8,fontSize:12}}/>
                        <Legend wrapperStyle={{fontSize:11}}/>
                        <Area yAxisId="k9" type="monotone" dataKey="k9" stroke="#a78bfa" strokeWidth={2} fill="url(#k9Grad)" name="K/9"/>
                        <Bar  yAxisId="ip" dataKey="ip" fill="#334155" opacity={0.5} name="IP" radius={[2,2,0,0]}/>
                      </ComposedChart>
                    </ResponsiveContainer>
                  </div>
                );
              })()}

              {/* FFT Forecast */}
              {pitcherView === "forecast" && (() => {
                const histData = selected.gamelogs.slice(-15).map(g => ({
                  date:  g.game_date.slice(5),
                  value: parseFloat(g[selected.fftMetric]) || null,
                  type:  "actual",
                }));
                const fcData = selected.forecast.map(f => ({
                  date:  f.date.slice(5),
                  value: f.value,
                  type:  "forecast",
                }));
                const combined = [
                  ...histData,
                  { date: histData[histData.length-1]?.date, value: histData[histData.length-1]?.value, type:"bridge" },
                  ...fcData,
                ];
                return (
                  <div style={{...s.card,padding:"20px 12px 12px"}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                      <div style={{fontSize:12,color:"#64748b"}}>
                        14-start FFT forecast · metric: <b style={{color:"#a78bfa"}}>{selected.fftMetric === 'game_score' ? 'Game Score' : 'ERA'}</b>
                        {selected.dominantCycleDays && <span> · dominant cycle: <b style={{color:"#a78bfa"}}>{selected.dominantCycleDays} starts</b></span>}
                      </div>
                    </div>
                    <ResponsiveContainer width="100%" height={220}>
                      <ComposedChart margin={{left:-10,right:10}}>
                        <defs>
                          <linearGradient id="fcGrad" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="5%"  stopColor="#34d399" stopOpacity={0.3}/>
                            <stop offset="95%" stopColor="#34d399" stopOpacity={0}/>
                          </linearGradient>
                        </defs>
                        <CartesianGrid strokeDasharray="3 3" stroke="#334155"/>
                        <XAxis dataKey="date" data={combined} tick={{fontSize:9,fill:"#64748b"}} interval={Math.max(1,Math.floor(combined.length/7))}/>
                        <YAxis tick={{fontSize:10,fill:"#64748b"}}/>
                        <Tooltip formatter={(v)=>[v?.toFixed(1)]} contentStyle={{background:"#1e293b",border:"1px solid #334155",borderRadius:8,fontSize:12}}/>
                        <ReferenceLine x={histData[histData.length-1]?.date} stroke="#94a3b8" strokeDasharray="3 3"
                          label={{value:"NOW",fontSize:9,fill:"#94a3b8",position:"insideTopRight"}}/>
                        <Line data={histData} type="monotone" dataKey="value" stroke="#a78bfa" strokeWidth={2} dot={{r:3}} name="Actual" connectNulls/>
                        <Area data={fcData}   type="monotone" dataKey="value" stroke="#34d399" strokeWidth={2} strokeDasharray="5 3" fill="url(#fcGrad)" name="Forecast" dot={false} connectNulls/>
                      </ComposedChart>
                    </ResponsiveContainer>
                    <div style={{display:"flex",gap:16,justifyContent:"center",marginTop:10}}>
                      {[["#a78bfa","Actual"],["#34d399","14-start forecast (FFT cycle)"]].map(([c,l])=>(
                        <div key={l} style={{display:"flex",alignItems:"center",gap:5,fontSize:11}}>
                          <div style={{width:24,height:2,background:c}}/><span style={{color:"#94a3b8"}}>{l}</span>
                        </div>
                      ))}
                    </div>
                    <div style={{marginTop:12,padding:"8px 10px",background:"#0f172a",borderRadius:6,fontSize:10,color:"#475569",lineHeight:1.5}}>
                      FFT on {selected.gamelogs.length}-start {selected.fftMetric === 'game_score' ? 'game score' : 'ERA'} signal. Dominant cycle: {selected.dominantCycleDays ?? '?'} starts. Forecast extrapolates this cycle 14 starts forward.
                    </div>
                  </div>
                );
              })()}

              {/* Game Log */}
              {pitcherView === "log" && (
                <div style={{...s.card,padding:"16px 12px"}}>
                  <div style={{fontSize:12,color:"#64748b",marginBottom:12}}>Recent starts (newest first)</div>
                  <div style={{overflowX:"auto"}}>
                    <table style={{width:"100%",fontSize:11,borderCollapse:"collapse"}}>
                      <thead>
                        <tr style={{color:"#64748b"}}>
                          {["Date","IP","ERA","WHIP","K/9","Game Score"].map(h=>(
                            <td key={h} style={{padding:"4px 8px",borderBottom:"1px solid #334155",textAlign:h==="Date"?"left":"center"}}>{h}</td>
                          ))}
                        </tr>
                      </thead>
                      <tbody>
                        {[...selected.gamelogs].reverse().map((g, i) => {
                          const gs = parseFloat(g.game_score);
                          const gsColor = gs >= 60 ? "#22c55e" : gs >= 45 ? "#f59e0b" : "#ef4444";
                          return (
                            <tr key={i} style={{borderBottom:"1px solid #1e293b"}}>
                              <td style={{padding:"5px 8px",color:"#94a3b8"}}>{g.game_date}</td>
                              <td style={{padding:"5px 8px",textAlign:"center"}}>{g.innings_pitched ?? '—'}</td>
                              <td style={{padding:"5px 8px",textAlign:"center",color: parseFloat(g.era)<3.50?"#22c55e":parseFloat(g.era)>5?"#ef4444":"#f1f5f9",fontWeight:700}}>{g.era ?? '—'}</td>
                              <td style={{padding:"5px 8px",textAlign:"center",color: parseFloat(g.whip)<1.10?"#22c55e":parseFloat(g.whip)>1.50?"#ef4444":"#f1f5f9"}}>{g.whip ?? '—'}</td>
                              {(() => { const ip2=parseFloat(g.innings_pitched),ks2=parseFloat(g.strikeouts); const k9v=g.k_per_9!=null?parseFloat(g.k_per_9):(ip2>0&&!isNaN(ks2)?(ks2/ip2)*9:null); return <td style={{padding:"5px 8px",textAlign:"center",color:k9v>=10?"#a78bfa":"#f1f5f9",fontWeight:k9v>=10?700:400}}>{k9v!=null?k9v.toFixed(1):'—'}</td>; })()}
                              <td style={{padding:"5px 8px",textAlign:"center",fontWeight:700,color:isNaN(gs)?"#64748b":gsColor}}>{isNaN(gs)?'—':Math.round(gs)}</td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* AI Scout */}
              <div style={{...s.card,marginTop:12}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                  <div style={{fontWeight:700,fontSize:13}}>🤖 AI Scouting Insight</div>
                  <button onClick={()=>handleInsight(selected)} disabled={insightLoading[selected.name]}
                    style={{padding:"7px 14px",borderRadius:8,border:"none",cursor:"pointer",fontWeight:700,fontSize:12,
                      background:insightLoading[selected.name]?"#334155":"#7c3aed",
                      color:"#fff",opacity:insightLoading[selected.name]?0.6:1}}>
                    {insightLoading[selected.name] ? "Analyzing…" : `Analyze ${selected.name.split(" ").pop()}`}
                  </button>
                </div>
                {insight[selected.name]
                  ? <p style={{fontSize:13,color:"#cbd5e1",lineHeight:1.7,margin:0}}>{insight[selected.name]}</p>
                  : <p style={{fontSize:13,color:"#475569",fontStyle:"italic",margin:0}}>Click Analyze for a Claude-powered pitching report incorporating cycle analysis.</p>
                }
              </div>
            </div>
          )}
        </div>
      );
    }

    // ── App ───────────────────────────────────────────────────────────────────
    function App(){
      const [sbUrl,setSbUrl]           = useState(()=>getCredential("sb-url","sbUrl"));
      const [sbKey,setSbKey]           = useState(()=>getCredential("sb-key","sbKey"));
      const [dataSource,setDataSource] = useState(() => {
        const url = getCredential("sb-url","sbUrl");
        const key = getCredential("sb-key","sbKey");
        return (url && key) ? "live" : "mlb";
      });
      const [mainTab,setMainTab]       = useState("hitters");  // "hitters" | "pitchers"
      const [roster,setRoster]         = useState([]);
      const [rosterLoading,setRosterLoading] = useState(false);
      const [rosterError,setRosterError]     = useState("");
      const [sortBy,setSortBy]         = useState("name");
      const [rankedSort,setRankedSort] = useState("score");
      const [teamFilter,setTeamFilter] = useState(()=>{ const t=readMeta("default-team"); return t||"ALL"; });
      const [search,setSearch]         = useState("");
      const [selectedPlayer,setSelectedPlayer] = useState(null);
      const [gameData,setGameData]     = useState([]);
      const [seasonStats,setSeasonStats] = useState(null);
      const [dataLoading,setDataLoading] = useState(false);
      const [dataError,setDataError]   = useState("");
      const [view,setView]             = useState("timeline");
      const [aiInsight,setAiInsight]   = useState("");
      const [aiLoading,setAiLoading]   = useState(false);
      const [mlbQuery,setMlbQuery]     = useState("");
      const [mlbSearching,setMlbSearching] = useState(false);
      const [mlbError,setMlbError]     = useState("");
      const [predCache,setPredCache]   = useState({});
      const [currentPred,setCurrentPred] = useState(null);
      const [cycleAnalysis,setCycleAnalysis] = useState(null);
      const [hitterSplits,setHitterSplits]     = useState(null);
      const [backtestResult,setBacktestResult] = useState(null);
      const [batchProgress,setBatchProgress] = useState(null);
      const mlbRef = useRef(null);
      const batchRunId = useRef(0);

      const loadRoster = useCallback(async()=>{
        if(dataSource==="mlb"){
          setRoster(Object.keys(MLB_IDS).map(name=>({player_name:name,team:"MLB"}))); setSelectedPlayer(null); setRosterError(""); return;
        }
        if(!sbUrl||!sbKey){
          setRoster([]); setSelectedPlayer(null);
          setRosterError("Enter your Supabase URL and API key above, then click Connect.");
          return;
        }
        setRosterLoading(true); setRosterError("");
        try{
          const players = await fetchRoster(sbUrl,sbKey);
          if(!players.length) throw new Error("No players returned — check table name and RLS policies.");
          setRoster(players); setSelectedPlayer(players.find(p=>teamFilter&&teamFilter!=='ALL'&&p.team===teamFilter)||players[0]);
        }catch(e){ setRosterError(e.message); setRoster([]); setSelectedPlayer(null); }
        setRosterLoading(false);
      },[dataSource,sbUrl,sbKey]);

      const loadGames = useCallback(async()=>{
        if(!selectedPlayer) return;
        setDataLoading(true); setDataError(""); setAiInsight(""); setSeasonStats(null); setCurrentPred(null); setCycleAnalysis(null); setHitterSplits(null); setBacktestResult(null);
        try{
          let games=[], ss=null, teamName=selectedPlayer.team, splitsForPred=null;
          if(dataSource==="mlb"){
            const pid = selectedPlayer.mlbId||MLB_IDS[selectedPlayer.player_name];
            if(!pid){ setDataError("No MLB ID."); setDataLoading(false); return; }
            const[splits,ssRaw,info,battingSplits] = await Promise.all([mlbFetchGameLog(pid),mlbFetchSeasonStats(pid),mlbFetchInfo(pid),mlbFetchBattingSplits(pid)]);
            teamName = info.currentTeam?.name||selectedPlayer.team||"";
            const transformed = transformMLBSplits(splits);
            if(transformed.length===0){ setDataError(`No ${SEASON} game log found.`); setDataLoading(false); return; }
            games=transformed;
            ss={avg:ssRaw.avg||".---",ops:ssRaw.ops||".---",hr:ssRaw.homeRuns||0,rbi:ssRaw.rbi||0,hits:ssRaw.hits||0,ab:ssRaw.atBats||0,games:ssRaw.gamesPlayed||0,team:teamName,pos:info.primaryPosition?.abbreviation||""};
            setSeasonStats(ss);
            splitsForPred = battingSplits;
            setHitterSplits({overall:ssRaw.avg||null, ...battingSplits});
          }else if(dataSource==="live"&&sbUrl&&sbKey){
            const pid = selectedPlayer.mlbId||MLB_IDS[selectedPlayer.player_name];
            const [rows, homeSplits] = await Promise.all([
              fetchPlayerGames(sbUrl,sbKey,selectedPlayer.player_name),
              pid ? fetchHitterSplits(pid).catch(()=>null) : Promise.resolve(null),
            ]);
            if(!rows.length){ setDataError("No rows found in Live DB for this player."); setDataLoading(false); return; }
            games = transformRows(rows);
            if(homeSplits) setHitterSplits({overall:null, ...homeSplits});
            // Also fetch L/R splits asynchronously for the splits UI panel
            if(pid) mlbFetchBattingSplits(pid).then(battingSplits=>{
              setHitterSplits(prev=>({...(prev||{}), ...battingSplits}));
              splitsForPred = {...(homeSplits||{}), ...battingSplits};
            }).catch(()=>{});
            splitsForPred = homeSplits;
          }
          const analysis = analyzePlayerCycles(games);
          setCycleAnalysis(analysis);
          if(analysis) games = applyPhaseColoring(games, analysis);
          setGameData(games);
          setBacktestResult(backtestForecast(games));
          const schedData = await fetchUpcomingSchedule(teamName||selectedPlayer.team);
          const pred = computePredictionScore(selectedPlayer.player_name, teamName||selectedPlayer.team, games, ss, schedData, splitsForPred);
          setCurrentPred(pred);
          setPredCache(prev=>({...prev,[selectedPlayer.player_name]:pred}));
        }catch(e){
          setDataError(e.message);
        }
        setDataLoading(false);
      },[selectedPlayer,dataSource,sbUrl,sbKey]);


      useEffect(()=>{ loadRoster(); },[loadRoster]);
      useEffect(()=>{ loadGames(); },[loadGames]);

      useEffect(()=>{
        if(!roster.length) return;
        if(dataSource==="live"&&(!sbUrl||!sbKey)) return;
        const runId = ++batchRunId.current;
        setPredCache({});
        const prioritized = [...roster].sort((a,b)=>{
          const scoreOf = p => (p.totalAB||0)*0.5 + ((p.avgWoba||0)/0.350)*0.5*200;
          return scoreOf(b)-scoreOf(a);
        });
        setBatchProgress({done:0,total:prioritized.length});
        let idx=0, done=0;
        const CONC = dataSource==="live"?8:2;
        const worker = async()=>{
          while(idx<prioritized.length){
            if(batchRunId.current!==runId) return;
            const player = prioritized[idx++];
            try{
              let games=[], ss=null, hitterSplits=null;
              const pid = player.mlbId||MLB_IDS[player.player_name];
              if(dataSource==="live"){
                const rows = await fetchPlayerGames(sbUrl,sbKey,player.player_name);
                if(!rows.length){ done++; setBatchProgress({done,total:prioritized.length}); continue; }
                games = transformRows(rows);
                // Fetch home/away splits in parallel with schedule (both need mlbId)
                if(pid) hitterSplits = await fetchHitterSplits(pid).catch(()=>null);
              }else{
                if(!pid){ done++; setBatchProgress({done,total:prioritized.length}); continue; }
                const[splits,ssRaw,homeSplits] = await Promise.all([
                  mlbFetchGameLog(pid),
                  mlbFetchSeasonStats(pid),
                  fetchHitterSplits(pid).catch(()=>null),
                ]);
                const t = transformMLBSplits(splits);
                if(!t.length){ done++; setBatchProgress({done,total:prioritized.length}); continue; }
                games=t;
                ss={avg:ssRaw.avg||".---",ops:ssRaw.ops||".---",hr:ssRaw.homeRuns||0,rbi:ssRaw.rbi||0,hits:ssRaw.hits||0,ab:ssRaw.atBats||0,games:ssRaw.gamesPlayed||0,team:player.team};
                hitterSplits = homeSplits;
              }
              const analysis = analyzePlayerCycles(games);
              if(analysis) games = applyPhaseColoring(games,analysis);
              const schedData = await fetchUpcomingSchedule(player.team).catch(()=>null);
              const pred = computePredictionScore(player.player_name,player.team,games,ss,schedData,hitterSplits);
              if(batchRunId.current!==runId) return;
              setPredCache(prev=>({...prev,[player.player_name]:pred}));
            }catch(e){}
            done++;
            setBatchProgress({done,total:prioritized.length});
          }
        };
        Promise.all(Array(CONC).fill(null).map(worker))
          .then(()=>{ if(batchRunId.current===runId) setBatchProgress(null); });
      },[roster,dataSource,sbUrl,sbKey]);

      const doMlbSearch = async()=>{
        if(!mlbQuery.trim()) return;
        setMlbSearching(true); setMlbError("");
        try{
          const person = await mlbSearchPlayer(mlbQuery.trim());
          if(!person){ setMlbError("Player not found — try full name"); setMlbSearching(false); return; }
          const p = {player_name:person.fullName||mlbQuery, team:"MLB", mlbId:person.id};
          setRoster(prev=>prev.find(x=>x.player_name===p.player_name)?prev:[p,...prev]);
          setSelectedPlayer(p); setMlbQuery("");
        }catch(e){ setMlbError(e.message); }
        setMlbSearching(false);
      };

      const saveCredentials = ()=>{
        localStorage.setItem("sbUrl",sbUrl);
        localStorage.setItem("sbKey",sbKey);
        setRosterLoading(true); setRosterError("");
        fetchRoster(sbUrl,sbKey)
          .then(players=>{
            if(!players.length) throw new Error("No players returned — check table name and RLS policies.");
            setRoster(players); setSelectedPlayer(players.find(p=>teamFilter&&teamFilter!=='ALL'&&p.team===teamFilter)||players[0]);
          })
          .catch(e=>{ setRosterError(e.message); setRoster([]); setSelectedPlayer(null); })
          .finally(()=>setRosterLoading(false));
      };

      const currentCycleDay = gameData.length?gameData[gameData.length-1].cycleDay:0;
      // Use DFT-derived phase from last game row when available; fall back to static lookup
      const lastGamePhase = gameData.length ? gameData[gameData.length-1].phase : null;
      const activePhaseConfig = (cycleAnalysis?.dynamicPhaseConfig) || PHASE_CONFIG;
      const currentPhase = lastGamePhase
        ? (activePhaseConfig.find(p=>p.name===lastGamePhase) || getPhase(currentCycleDay))
        : getPhase(currentCycleDay);

      const teams = ["ALL",...Array.from(new Set(roster.map(p=>p.team))).sort()];
      const filteredRoster = roster
        .filter(p=>(teamFilter==="ALL"||(p.team||"").trim()===teamFilter.trim())&&p.player_name.toLowerCase().includes(search.toLowerCase()))
        .sort((a,b)=>{
          if(sortBy==="prediction"){
            if(rankedSort==="r2") return (predCache[b.player_name]?.r2??-1)-(predCache[a.player_name]?.r2??-1);
            return (predCache[b.player_name]?.score||0)-(predCache[a.player_name]?.score||0);
          }
          if(sortBy==="positions")
            return (predCache[b.player_name]?.score||0)-(predCache[a.player_name]?.score||0);
          if(sortBy==="consistency")
            return (predCache[b.player_name]?.consistency??-1)-(predCache[a.player_name]?.consistency??-1);
          return a.player_name.localeCompare(b.player_name);
        });

      const grouped = sortBy==="prediction"
        ? {"rankings":filteredRoster}
        : sortBy==="positions"
          ? filteredRoster.reduce((acc,p)=>{ const pos=p.position?p.position.split(",")[0].trim()||"—":"—"; (acc[pos]=acc[pos]||[]).push(p); return acc; },{})
          : sortBy==="consistency"
            ? filteredRoster.reduce((acc,p)=>{ const c=predCache[p.player_name]?.consistency; const bucket=c==null?"Unscored":c>=70?"Reliable":c<=30?"Streaky":"Average"; (acc[bucket]=acc[bucket]||[]).push(p); return acc; },{})
            : filteredRoster.reduce((acc,p)=>{ (acc[p.team]=acc[p.team]||[]).push(p); return acc; },{});

      const posGroupOrder = sortBy==="positions"
        ? Object.keys(grouped).sort((a,b)=>{
            const avg=g=>{ const ps=grouped[g].map(p=>predCache[p.player_name]?.score).filter(Boolean); return ps.length?ps.reduce((s,v)=>s+v,0)/ps.length:0; };
            return avg(b)-avg(a);
          })
        : [];

      const teamScores = React.useMemo(()=>{
        const t={};
        roster.forEach(p=>{
          const pred=predCache[p.player_name];
          if(!t[p.team]) t[p.team]={sum:0,count:0,total:roster.filter(x=>x.team===p.team).length};
          if(pred){ t[p.team].sum+=pred.score; t[p.team].count++; }
        });
        return Object.entries(t)
          .filter(([,v])=>v.count>0)
          .map(([team,v])=>({team,avg:Math.round(v.sum/v.count),sum:v.sum,count:v.count,total:v.total}))
          .sort((a,b)=>b.avg-a.avg);
      },[predCache,roster]);

      const positionScores = React.useMemo(()=>{
        const t={};
        roster.forEach(p=>{
          const pred=predCache[p.player_name];
          const pos=p.position?p.position.split(",")[0].trim()||"—":"—";
          if(!t[pos]) t[pos]={sum:0,count:0,total:0};
          t[pos].total++;
          if(pred){ t[pos].sum+=pred.score; t[pos].count++; }
        });
        const POS_ORDER=["C","1B","2B","3B","SS","LF","CF","RF","OF","DH","—"];
        return Object.entries(t)
          .filter(([,v])=>v.count>0)
          .map(([pos,v])=>({pos,avg:Math.round(v.sum/v.count),count:v.count,total:v.total}))
          .sort((a,b)=>{
            const ai=POS_ORDER.indexOf(a.pos), bi=POS_ORDER.indexOf(b.pos);
            return (ai===-1?99:ai)-(bi===-1?99:bi);
          });
      },[predCache,roster]);

      const fetchInsight = async()=>{
        setAiLoading(true);
        const last10=gameData.slice(-10), l10H=last10.reduce((a,g)=>a+g.hits,0), l10AB=last10.reduce((a,g)=>a+g.ab,0), l10HR=last10.reduce((a,g)=>a+g.hr,0);
        const last5=gameData.slice(-5), l5H=last5.reduce((a,g)=>a+g.hits,0), l5AB=last5.reduce((a,g)=>a+g.ab,0);
        const ssLine=seasonStats?`Season ${SEASON}: AVG ${seasonStats.avg}, OPS ${seasonStats.ops}, HR ${seasonStats.hr}, RBI ${seasonStats.rbi}, G ${seasonStats.games}`:`${gameData.length} games sampled`;
        let cycleSection;
        if(cycleAnalysis && cycleAnalysis.dominantCycles.length > 0){
          const cycles = cycleAnalysis.dominantCycles.map((c,i)=>`  Cycle ${i+1}: ${c.periodDays}-day period, ${c.pctVariance}% of variance, amplitude ${c.amplitude.toFixed(3)}`).join("\n");
          const fv = cycleAnalysis.forecastValues.slice(0,7);
          const fSlope = fv[fv.length-1] - fv[0];
          const fDir = fSlope > 0.015 ? "strongly rising" : fSlope > 0.005 ? "rising" : fSlope < -0.015 ? "strongly falling" : fSlope < -0.005 ? "falling" : "flat";
          const fAvg = (fv.reduce((a,b)=>a+b,0)/fv.length + cycleAnalysis.mean).toFixed(3);
          const phaseDesc = cycleAnalysis.dynamicPhaseConfig
            ? `Dynamic phases (${cycleAnalysis.dominantPeriod}-game cycle): `+cycleAnalysis.dynamicPhaseConfig.map(p=>`${p.name} ~${p.avgGames}g`).join(", ")
            : "";
          const currentPhaseNote = `Currently in ${currentPhase?.name} phase (day ${currentCycleDay+1}/${cycleAnalysis.dominantPeriod})`;
          cycleSection=`Detected performance cycles (DFT analysis, R²=${cycleAnalysis.r2.toFixed(2)}):\n${cycles}\n${phaseDesc}\n${currentPhaseNote}\nForecast next 7 games: trend is ${fDir}, projected avg ~${fAvg}`;
        } else {
          const ps=activePhaseConfig.map(p=>`  ${p.name}: AVG ${phaseAvg(gameData,p.name,"avg")}, OPS ${phaseAvg(gameData,p.name,"ops")}`).join("\n");
          cycleSection=`Fixed 28-day cycle phase averages (insufficient data for DFT):\n${ps}\nCurrent: ${currentPhase?.name} phase, day ${currentCycleDay+1}/${CYCLE_LENGTH}`;
        }
        const predLine=currentPred?`\nPerformance prediction score: ${currentPred.score}/99 (${currentPred.tier}) — ${currentPred.label}`:"";
        const prompt=`You are a baseball analytics AI specializing in time-series performance cycle analysis.

Player: ${selectedPlayer?.player_name} (${seasonStats?.team||selectedPlayer?.team||""})
${ssLine}
Last 10 games: ${l10H}H / ${l10AB}AB (.${l10AB>0?Math.round(l10H/l10AB*1000).toString().padStart(3,"0"):"000"}), ${l10HR} HR
Last 5 games:  ${l5H}H / ${l5AB}AB (.${l5AB>0?Math.round(l5H/l5AB*1000).toString().padStart(3,"0"):"000"})
${predLine}

${cycleSection}

Based specifically on the detected cycle periods and forecast direction above — not generic baseball intuition — provide 3-4 sentences covering: what the dominant cycle(s) tell us about this player's rhythm, where they are in that cycle right now, a concrete fantasy/lineup recommendation for the next 3-5 days, and one bold prediction grounded in the cycle data.`;

        try{
          const res=await fetch("/api/scout",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt})});
          if(!res.ok){ const e=await res.text(); throw new Error(`API ${res.status}: ${e}`); }
          const d=await res.json();
          setAiInsight(d.text||"No insight returned.");
        }catch(e){ setAiInsight(e.message==="Failed to fetch"?"AI Scout requires the Vercel deployment — not available when running locally.":"Error: "+e.message); }
        setAiLoading(false);
      };

      const s = {
        card:{background:"#1e293b",borderRadius:12,padding:16},
        input:{background:"#0f172a",border:"1px solid #334155",borderRadius:6,padding:"7px 10px",color:"#f1f5f9",fontSize:12,width:"100%",boxSizing:"border-box"},
        btn:(active,color="#3b82f6")=>({padding:"7px 14px",borderRadius:8,border:"none",cursor:"pointer",fontWeight:700,fontSize:12,background:active?color:"#334155",color:active?"#fff":"#94a3b8"}),
      };

      return(
        <div style={{background:"#0f172a",minHeight:"100vh",color:"#f1f5f9",fontFamily:"Inter,sans-serif",padding:"20px 16px"}}>
          <div style={{maxWidth:980,margin:"0 auto"}}>

            <div style={{marginBottom:20}}>
              <h1 style={{fontSize:22,fontWeight:800}}>⚾ MLB Cycle Analyzer</h1>
              <p style={{color:"#64748b",fontSize:13,marginTop:4}}>28-day performance cycle · Season {SEASON} · MIN_AT_BATS: {MIN_AT_BATS} · {roster.length} players</p>
            </div>

            {/* Source bar */}
            <div style={{...s.card,marginBottom:20}}>
              <div style={{display:"flex",gap:8,marginBottom:12,flexWrap:"wrap"}}>
                {[["live","🔴 Live DB"],["mlb","⚾ MLB API"]].map(([m,label])=>(
                  <button key={m} onClick={()=>setDataSource(m)} style={s.btn(dataSource===m,m==="live"?"#22c55e":"#f59e0b")}>{label}</button>
                ))}
                {rosterLoading&&<span style={{fontSize:12,color:"#64748b",alignSelf:"center"}}>Loading...</span>}
                {dataSource==="live"&&!rosterLoading&&roster.length>0&&!rosterError&&<span style={{fontSize:12,color:"#22c55e",alignSelf:"center"}}>✓ {roster.length} players</span>}
              </div>
              {dataSource==="mlb"&&(
                <div style={{display:"flex",gap:8}}>
                  <input ref={mlbRef} value={mlbQuery} onChange={e=>setMlbQuery(e.target.value)} onKeyDown={e=>e.key==="Enter"&&doMlbSearch()} placeholder="Search any MLB player…" style={{...s.input,flex:1}}/>
                  <button onClick={doMlbSearch} disabled={mlbSearching} style={{...s.btn(true,"#f59e0b"),whiteSpace:"nowrap",opacity:mlbSearching?0.6:1}}>{mlbSearching?"Searching…":"Search ↗"}</button>
                </div>
              )}
              {mlbError&&<div style={{fontSize:12,color:"#fca5a5",marginTop:4}}>{mlbError}</div>}
              {dataSource==="live"&&(
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr auto",gap:8,marginTop:8}}>
                  <div><div style={{fontSize:11,color:"#64748b",marginBottom:4}}>Supabase URL</div><input value={sbUrl} onChange={e=>setSbUrl(e.target.value)} placeholder="https://xxxx.supabase.co" style={s.input}/></div>
                  <div><div style={{fontSize:11,color:"#64748b",marginBottom:4}}>Anon Key</div><input type="password" value={sbKey} onChange={e=>setSbKey(e.target.value)} placeholder="eyJhbGci…" style={s.input}/></div>
                  <div style={{alignSelf:"flex-end"}}><button onClick={saveCredentials} style={{...s.btn(true,"#22c55e"),padding:"8px 16px"}}>Connect</button></div>
                </div>
              )}
              {(rosterError||dataError)&&<div style={{marginTop:10,padding:"8px 12px",background:"#450a0a",borderRadius:6,fontSize:12,color:"#fca5a5"}}>⚠️ {rosterError||dataError}</div>}
            </div>

            {/* ── Main tab bar: Hitters / Pitchers ── */}
            <div style={{display:"flex",gap:4,marginBottom:16,borderBottom:"1px solid #334155",paddingBottom:0}}>
              {[["hitters","🏏 Hitters"],["pitchers","⚾ Pitchers"],["gameplan","📋 Game Predictions"],["predacc","🎯 Prediction Accuracy"],["todaygames","⚡ Today's Games"],["disagree","📊 Disagreement Tracker"]].map(([tab,label])=>(
                <button key={tab} onClick={()=>setMainTab(tab)}
                  style={{padding:"9px 20px",borderRadius:"8px 8px 0 0",border:"none",cursor:"pointer",fontWeight:700,fontSize:13,
                    background:mainTab===tab?"#1e293b":"transparent",
                    color:mainTab===tab?"#f1f5f9":"#64748b",
                    borderBottom:mainTab===tab?"2px solid #3b82f6":"2px solid transparent",
                    marginBottom:"-1px"}}>
                  {label}
                </button>
              ))}
            </div>

            {/* ── GAME PREDICTIONS TAB ── */}
            {mainTab === "gameplan" && (
              <GamePlanTab roster={roster} predCache={predCache} dataSource={dataSource} sbUrl={sbUrl} sbKey={sbKey}/>
            )}

            {/* ── PREDICTION ACCURACY TAB ── */}
            {mainTab === "predacc" && (
              <PredictionAccuracyTab roster={roster} predCache={predCache} sbUrl={sbUrl} sbKey={sbKey}/>
            )}

            {/* ── TODAY'S GAMES TAB ── */}
            {mainTab === "todaygames" && (
              <TodayMatchupsTab roster={roster} predCache={predCache} sbUrl={sbUrl} sbKey={sbKey}/>
            )}

            {/* ── DISAGREEMENT TRACKER TAB ── */}
            {mainTab === "disagree" && (
              <DisagreementTrackerTab sbUrl={sbUrl} sbKey={sbKey}/>
            )}

            {/* ── PITCHERS TAB ── */}
            {mainTab === "pitchers" && (
              <PitchersTab
                dataSource={dataSource}
                sbUrl={sbUrl}
                sbKey={sbKey}
                teamFilter={teamFilter}
              />
            )}

            {/* ── HITTERS TAB ── */}
            {mainTab === "hitters" && (
            <div style={{display:"grid",gridTemplateColumns:"280px 1fr",gap:16,alignItems:"start"}}>

              {/* Sidebar */}
              <div style={{...s.card,padding:12}}>
                <div style={{fontSize:12,fontWeight:700,color:"#94a3b8",marginBottom:10}}>PLAYERS</div>
                <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Search…" style={{...s.input,marginBottom:8}}/>
                <div style={{display:"flex",gap:6,marginBottom:6}}>
                  <button onClick={()=>setSortBy("name")} style={{...s.btn(sortBy==="name"),flex:1,padding:"5px 8px",fontSize:11}}>A–Z</button>
                  <button onClick={()=>setSortBy("prediction")} style={{...s.btn(sortBy==="prediction","#f59e0b"),flex:1,padding:"5px 8px",fontSize:11}}>🔮 Ranked</button>
                </div>
                <div style={{display:"flex",gap:6,marginBottom:6}}>
                  <button onClick={()=>setSortBy("teams")} style={{...s.btn(sortBy==="teams","#22c55e"),flex:1,padding:"5px 8px",fontSize:11}}>🏆 Teams</button>
                  <button onClick={()=>setSortBy("positions")} style={{...s.btn(sortBy==="positions","#a78bfa"),flex:1,padding:"5px 8px",fontSize:11}}>📍 Positions</button>
                </div>
                <div style={{marginBottom:8}}>
                  <button onClick={()=>setSortBy("consistency")} style={{...s.btn(sortBy==="consistency","#60a5fa"),width:"100%",padding:"5px 8px",fontSize:11}}>= Consistency</button>
                </div>
                {batchProgress&&(
                  <div style={{marginBottom:8}}>
                    <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:"#64748b",marginBottom:3}}>
                      <span>Scoring players…</span><span>{batchProgress.done}/{batchProgress.total}</span>
                    </div>
                    <div style={{background:"#1e293b",borderRadius:4,height:3}}>
                      <div style={{background:"#3b82f6",height:3,borderRadius:4,width:`${Math.round(batchProgress.done/batchProgress.total*100)}%`,transition:"width 0.3s"}}/>
                    </div>
                  </div>
                )}
                {dataSource!=="mlb"&&(sortBy==="name"||sortBy==="prediction"||sortBy==="positions"||sortBy==="consistency")&&(
                  <select value={teamFilter} onChange={e=>setTeamFilter(e.target.value)} style={{...s.input,marginBottom:8,cursor:"pointer"}}>
                    {teams.map(t=><option key={t} value={t}>{t==="ALL"?"All Teams":t}</option>)}
                  </select>
                )}
                <div style={{maxHeight:520,overflowY:"auto",fontSize:12}}>
                  {sortBy==="teams"?(
                    teamScores.length===0?(
                      <div style={{color:"#475569",fontStyle:"italic",padding:8}}>Scores loading…</div>
                    ):teamScores.map((t,i)=>{
                      const color = t.avg>=75?"#22c55e":t.avg>=50?"#f59e0b":"#ef4444";
                      return(
                        <div key={t.team} onClick={()=>{setTeamFilter(t.team);setSortBy("prediction");}}
                          style={{padding:"8px 10px",borderRadius:6,cursor:"pointer",marginBottom:4,background:"#0f172a"}}>
                          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                            <span style={{color:"#cbd5e1",fontWeight:600}}>
                              <span style={{color:"#475569",marginRight:5,fontSize:10}}>#{i+1}</span>{t.team}
                            </span>
                            <span style={{fontSize:13,fontWeight:800,color}}>{t.avg}</span>
                          </div>
                          <div style={{background:"#1e293b",borderRadius:3,height:5,marginBottom:4}}>
                            <div style={{background:color,height:5,borderRadius:3,width:`${t.avg}%`,transition:"width 0.4s"}}/>
                          </div>
                          <div style={{fontSize:10,color:"#475569"}}>{t.count}/{t.total} players scored · avg outlook</div>
                        </div>
                      );
                    })
                  ):(
                    (sortBy==="positions"?posGroupOrder:sortBy==="consistency"?["Reliable","Average","Streaky","Unscored"].filter(k=>grouped[k]):Object.keys(grouped).sort()).map(groupKey=>(
                      <div key={groupKey}>
                        {sortBy==="prediction"&&(
                          <div style={{padding:"4px 6px",marginBottom:4}}>
