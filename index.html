<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MLB Cycle Analyzer</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts@2.10.0/umd/Recharts.js"></script>
  <script src="analytics.js"></script>
  <meta name="sb-url" content="%SB_URL%">
  <meta name="sb-key" content="%SB_KEY%">
  <meta name="default-team" content="%DEFAULT_TEAM%">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0f172a; color: #f1f5f9; font-family: Inter, sans-serif; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #1e293b; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;
    const { AreaChart, Area, BarChart, Bar, LineChart, Line, ComposedChart,
            XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer,
            ReferenceLine, Cell, Legend } = Recharts;

    const SEASON = 2026;
    const MIN_AT_BATS = 20;

    const TIER_COLOR = { hot:"#22c55e", warm:"#f59e0b", neutral:"#60a5fa", cold:"#ef4444" };


    // MLB player ID lookup
    const MLB_IDS = {
      "Aaron Judge":592450, "Shohei Ohtani":660271, "Mookie Betts":605141,
      "Freddie Freeman":518692, "Juan Soto":665742, "Mike Trout":545361,
      "Ronald Acuña Jr.":660670, "Bryce Harper":547180, "Trea Turner":607208,
      "José Ramírez":608070, "Nolan Arenado":571448, "Paul Goldschmidt":502671,
      "Pete Alonso":624413, "Vladimir Guerrero Jr.":665489, "Bo Bichette":666182,
      "Yordan Alvarez":670541, "Kyle Tucker":663538, "Julio Rodríguez":677594,
      "Gunnar Henderson":683002, "Corey Seager":608369, "Marcus Semien":543760,
      "Rafael Devers":646240, "Austin Riley":663586, "Matt Olson":621566,
      "Corbin Carroll":682998, "Jarren Duran":680776, "Adolis García":666969,
      "Ha-Seong Kim":673490, "Jeff McNeil":643446, "Max Muncy":571970,
      "Ketel Marte":606466, "Christian Yelich":592885, "Teoscar Hernández":606192,
    };



    const CustomTooltip = ({active,payload}) => {
      if(!active||!payload?.length) return null;
      const d = payload[0].payload;
      return (
        <div style={{background:"#1e293b",border:`1px solid ${d.phaseColor||"#334155"}`,borderRadius:8,padding:"10px 14px",fontSize:12}}>
          <div style={{color:"#94a3b8",marginBottom:4}}>{d.date}</div>
          <div style={{color:d.phaseColor,fontWeight:700,marginBottom:6}}>📍 {d.phase} (Day {d.cycleDay+1})</div>
          <div style={{color:"#f1f5f9"}}>AVG: <b>{(+d.avg).toFixed(3)}</b> · OPS: <b>{(+d.ops).toFixed(3)}</b>{d.woba!=null?<> · wOBA: <b style={{color:"#f59e0b"}}>{(+d.woba).toFixed(3)}</b></>:null}</div>
          <div style={{color:"#f1f5f9"}}>Hits: <b>{d.hits}</b> · HR: <b>{d.hr}</b>{d.ab?` · AB: `+d.ab:""}</div>
        </div>
      );
    };

    // Supabase helpers
    async function sbFetch(url,key,path){
      const r = await fetch(`${url}/rest/v1/${path}`,{headers:{apikey:key,Authorization:`Bearer ${key}`}});
      if(!r.ok) throw new Error(`Supabase ${r.status}: ${await r.text()}`);
      return r.json();
    }
    async function fetchRoster(url,key){
      const PAGE = 1000;
      let offset = 0, all = [], page;
      do {
        page = await sbFetch(url, key,
          `player_gamelogs?select=player_name,team,position,at_bats,woba,obp,home_runs,stolen_bases,batting_order&order=player_name.asc,team.asc,game_date.desc&limit=${PAGE}&offset=${offset}`);
        all = all.concat(page);
        offset += PAGE;
      } while (page.length === PAGE);
      const map = {};
      all.forEach(r=>{
        const k = `${r.player_name}||${(r.team||"").trim()}`;
        if(!map[k]) map[k] = {player_name:r.player_name, team:(r.team||"").trim(), posScores:{}, rowIdx:0,
          totalAB:0, wobaSum:0, wobaCount:0, obpSum:0, obpCount:0,
          sumHR:0, sumSB:0, spotCounts:{}};
        if(r.position){
          const pos = r.position.trim();
          const w = 1/(1+map[k].rowIdx);
          map[k].posScores[pos] = (map[k].posScores[pos]||0)+w;
        }
        map[k].totalAB += r.at_bats||0;
        map[k].sumHR   += r.home_runs||0;
        map[k].sumSB   += r.stolen_bases||0;
        const wb = parseFloat(r.woba);
        // Fix 2: weight recent games more — rows arrive desc by game_date so rowIdx=0 is most recent
        if(!isNaN(wb)&&wb>0){
          const recencyW = map[k].rowIdx < 21 ? 1.5 : 1.0;
          map[k].wobaSum+=wb*recencyW; map[k].wobaCount+=recencyW;
        }
        const op = parseFloat(r.obp);
        if(!isNaN(op)&&op>0){ map[k].obpSum+=op; map[k].obpCount++; }
        if(r.batting_order) map[k].spotCounts[r.batting_order]=(map[k].spotCounts[r.batting_order]||0)+1;
        map[k].rowIdx++;
      });
      return Object.values(map).map(r=>{
        const topSpot = Object.entries(r.spotCounts).sort((a,b)=>b[1]-a[1])[0];
        return {
          player_name:  r.player_name,
          team:         r.team,
          position:     Object.entries(r.posScores).sort((a,b)=>b[1]-a[1]).map(e=>e[0]).join(","),
          totalAB:      r.totalAB,
          gamesPlayed:  r.rowIdx,
          avgWoba:      r.wobaCount>0 ? +(r.wobaSum/r.wobaCount).toFixed(4) : null,
          avgObp:       r.obpCount>0  ? +(r.obpSum/r.obpCount).toFixed(3)  : null,
          sumHR:        r.sumHR,
          sumSB:        r.sumSB,
          typicalSpot:  topSpot ? +topSpot[0] : null,
        };
      });
    }
    async function fetchPlayerGames(url,key,playerName){
      const since = new Date(); since.setDate(since.getDate()-90);
      const iso = since.toISOString().split("T")[0];
      return sbFetch(url,key,`player_gamelogs?player_name=eq.${encodeURIComponent(playerName)}&game_date=gte.${iso}&order=game_date.asc&select=*`);
    }

    // Fetch pitchers from Supabase
    async function fetchPitchersFromDB(url, key) {
      const PAGE = 1000;
      let offset = 0, all = [], page;
      do {
        page = await sbFetch(url, key,
          `pitcher_gamelogs?order=game_date.desc&limit=${PAGE}&offset=${offset}&select=*`);
        all = all.concat(page);
        offset += PAGE;
      } while (page.length === PAGE);

      const byPlayer = {};
      for (const row of all) {
        if (!byPlayer[row.player_name]) byPlayer[row.player_name] = [];
        byPlayer[row.player_name].push(row);
      }

      return Object.entries(byPlayer).map(([name, logs]) => {
        const sorted = [...logs].sort((a, b) => a.game_date.localeCompare(b.game_date));
        const recent = sorted.slice(-30);
        const avg = (key) => {
          const vals = recent.map(g => parseFloat(g[key])).filter(v => !isNaN(v));
          return vals.length ? (vals.reduce((a, b) => a + b, 0) / vals.length).toFixed(2) : '—';
        };
        // Calculate K/9 from strikeouts and innings_pitched
        const k9Vals = recent.map(g => {
          const ip = parseFloat(g.innings_pitched);
          const k = parseFloat(g.strikeouts);
          return (ip > 0 && !isNaN(k)) ? (k / ip) * 9 : NaN;
        }).filter(v => !isNaN(v));
        const k9 = k9Vals.length ? (k9Vals.reduce((a, b) => a + b, 0) / k9Vals.length).toFixed(2) : '—';
        
        const team = sorted[sorted.length - 1]?.team || '';
        const fftMetric = recent.some(g => g.game_score != null) ? 'game_score' : 'era';
        const { predictionScore, dominantCycleDays, forecast } = buildPitcherForecast(recent, fftMetric);
        return { name, team, gamelogs: recent, era: avg('era'), whip: avg('whip'), k9, fftMetric, predictionScore, dominantCycleDays, forecast };
      });
    }

    // MLB Stats API helpers
    async function mlbSearchPlayer(query){
      try{
        const r = await fetch(`https://statsapi.mlb.com/api/v1/people/search?names=${encodeURIComponent(query)}&sportIds=1&active=true`);
        const d = await r.json();
        if(d.people?.length) return d.people[0];
      }catch(_){}
      const lower = query.toLowerCase();
      const match = Object.entries(MLB_IDS).find(([n])=>n.toLowerCase().includes(lower));
      return match ? {id:match[1],fullName:match[0]} : null;
    }
    async function mlbFetchGameLog(id){
      const r = await fetch(`https://statsapi.mlb.com/api/v1/people/${id}/stats?stats=gameLog&season=${SEASON}&group=hitting&sportId=1`);
      const d = await r.json(); return d.stats?.[0]?.splits||[];
    }
    async function mlbFetchSeasonStats(id){
      const r = await fetch(`https://statsapi.mlb.com/api/v1/people/${id}/stats?stats=season&season=${SEASON}&group=hitting&sportId=1`);
      const d = await r.json(); return d.stats?.[0]?.splits?.[0]?.stat||{};
    }
    async function mlbFetchInfo(id){
      const r = await fetch(`https://statsapi.mlb.com/api/v1/people/${id}?hydrate=currentTeam`);
      const d = await r.json(); return d.people?.[0]||{};
    }
    async function mlbFetchBattingSplits(id){
      const r = await fetch(`https://statsapi.mlb.com/api/v1/people/${id}/stats?stats=statSplits&group=hitting&season=${SEASON}&sitCodes=vr,vl&sportId=1`);
      const d = await r.json();
      const splits = d.stats?.[0]?.splits||[];
      return {
        vsRHP: splits.find(s=>s.split?.code==='vr')?.stat?.avg||null,
        vsLHP: splits.find(s=>s.split?.code==='vl')?.stat?.avg||null,
      };
    }

    // Score bar
    const ScoreBar = ({score,tier,size="sm"}) => {
      const color = TIER_COLOR[tier]||"#64748b", h = size==="lg"?10:5;
      return(
        <div style={{display:"flex",alignItems:"center",gap:size==="lg"?10:6}}>
          <div style={{flex:1,height:h,background:"#0f172a",borderRadius:h,overflow:"hidden",minWidth:size==="lg"?80:44}}>
            <div style={{width:`${score}%`,height:"100%",background:color,borderRadius:h,transition:"width 0.4s"}}/>
          </div>
          <span style={{fontSize:size==="lg"?15:11,fontWeight:700,color,minWidth:size==="lg"?28:20,textAlign:"right"}}>{score}</span>
        </div>
      );
    };

    const BacktestPanel = ({bt}) => {
      if(!bt) return null;
      const dirPct  = Math.round(bt.avgDirectionalAccuracy * 100);
      const maePts  = Math.round(bt.avgMAE * 1000);
      const dirColor = dirPct>=70?'#22c55e':dirPct>=60?'#f59e0b':'#ef4444';
      const maeColor = maePts<=10?'#22c55e':maePts<=20?'#f59e0b':'#ef4444';
      const dirLabel = dirPct>=70?'Strong':dirPct>=60?'Decent':dirPct>=50?'Weak':'Poor';
      const maeLabel = maePts<=10?'High':maePts<=20?'Moderate':'Low';
      const chartData = bt.recentActual.map((a,i)=>({
        g: bt.recentStartGame+i,
        actual:   +a.toFixed(3),
        forecast: +Math.max(0.05,bt.recentForecast[i]).toFixed(3),
      }));
      return(
        <div style={{background:"#0f172a",borderRadius:10,padding:16,marginTop:12}}>
          <div style={{fontSize:13,fontWeight:700,color:"#94a3b8",marginBottom:10}}>Forecast Backtest</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:14}}>
            {[
              ["Windows",   bt.windowCount,       "#64748b",  null,     null],
              ["Direction", dirPct+"%",            dirColor,   dirLabel, dirColor],
              ["Avg Error", "."+String(maePts).padStart(3,"0"), maeColor, maeLabel+" accuracy", maeColor],
            ].map(([lbl,val,vc,sub,sc])=>(
              <div key={lbl} style={{background:"#1e293b",borderRadius:8,padding:"10px 12px"}}>
                <div style={{fontSize:10,color:"#475569",marginBottom:4}}>{lbl}</div>
                <div style={{fontSize:18,fontWeight:800,color:vc}}>{val}</div>
                {sub&&<div style={{fontSize:10,color:sc,marginTop:2}}>{sub}</div>}
              </div>
            ))}
          </div>
          <div style={{fontSize:11,color:"#64748b",marginBottom:6}}>Most recent window — games {bt.recentStartGame}–{bt.recentStartGame+bt.recentActual.length-1}</div>
          <ResponsiveContainer width="100%" height={110}>
            <LineChart data={chartData} margin={{top:4,right:4,left:-24,bottom:0}}>
              <XAxis dataKey="g" tick={{fontSize:10,fill:"#475569"}} tickLine={false} axisLine={false}/>
              <YAxis tick={{fontSize:10,fill:"#475569"}} tickLine={false} axisLine={false} tickFormatter={v=>v.toFixed(2)} domain={["auto","auto"]}/>
              <Tooltip formatter={(v,n)=>[v.toFixed(3),n==="actual"?"Actual":"Forecast"]} contentStyle={{background:"#1e293b",border:"none",fontSize:11}}/>
              <Line type="monotone" dataKey="forecast" stroke="#3b82f6" strokeWidth={1.5} dot={false} strokeDasharray="4 2"/>
              <Line type="monotone" dataKey="actual"   stroke="#22c55e" strokeWidth={1.5} dot={{r:2,fill:"#22c55e"}}/>
            </LineChart>
          </ResponsiveContainer>
          <div style={{display:"flex",gap:14,marginTop:6,fontSize:10,color:"#475569"}}>
            <span><span style={{color:"#3b82f6"}}>— —</span> Forecast</span>
            <span><span style={{color:"#22c55e"}}>——</span> Actual</span>
          </div>
        </div>
      );
    };

    const PredictionPanel = ({pred, hitterSplits}) => {
      if(!pred) return null;
      const color = TIER_COLOR[pred.tier];
      const matchupNote = pred.opponents?.length
        ? <span>vs {pred.opponents.map((opp,i)=>{
            const f    = pred.opponentFactors?.[i];
            const hand = pred.matchupDetails?.[i]?.pitcher?.hand;
            const ba   = hand==='L' ? parseFloat(hitterSplits?.vsLHP)
                       : hand==='R' ? parseFloat(hitterSplits?.vsRHP) : NaN;
            const sf   = !isNaN(ba)&&ba>0 ? Math.max(0.85,Math.min(1.15,ba/0.255)) : null;
            const adjF = f!=null&&sf!=null ? +(f*0.65+sf*0.35).toFixed(3) : f;
            const c    = opp==='---' ? '#475569' : adjF==null ? '#94a3b8' : adjF>1.05 ? '#22c55e' : adjF>=0.95 ? '#f59e0b' : '#ef4444';
            return <span key={i} style={{color:c}}>{opp}{i<pred.opponents.length-1?', ':''}</span>;
          })}</span>
        : "TBD";
      const bd = pred.breakdown || {};
      const nextGame = pred.nextGame || pred.matchupDetails?.find(d=>d!=null);
      const rows = [
        ["Cycle phase",        bd.phaseScore,    30, pred.phaseLabel||null],
        ["Last-5 avg trend",   bd.trendScore,    25, null],
        ["Season OPS",         bd.opsScore,      20, null],
        ["10-game momentum",   bd.momentumScore, 15, null],
        ["Matchup quality",    bd.matchupScore,  10, matchupNote],
        ...(bd.fatigueScore < 0 ? [["Fatigue penalty", bd.fatigueScore, 0, `${bd.fatigueScore} pts`]] : []),
      ];
      return(
        <div style={{background:"#0f172a",borderRadius:10,padding:16}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <div style={{fontSize:13,fontWeight:700,color}}>3–5 Day Performance Outlook</div>
            <div style={{fontSize:26,fontWeight:800,color}}>{pred.score}<span style={{fontSize:11,color:"#64748b",fontWeight:400}}>/99</span></div>
          </div>
          <div style={{fontSize:12,color:"#94a3b8",marginBottom:pred.usingFixedCycle?6:14,lineHeight:1.5}}>{pred.label}</div>
          {pred.insufficientData&&(
            <div style={{fontSize:11,color:"#475569",background:"#1e293b",borderRadius:6,padding:"6px 10px",marginBottom:12}}>
              ⚠ Not enough data for cycle analysis — need at least 10 games.
            </div>
          )}
          {pred.usingFixedCycle&&!pred.insufficientData&&(
            <div style={{fontSize:11,color:"#475569",background:"#1e293b",borderRadius:6,padding:"6px 10px",marginBottom:12}}>
              No significant cycles detected — using 28-day fixed cycle as fallback.
            </div>
          )}
          {rows.map(([lbl,val,max,note])=>{
            const isNegRow = val < 0;
            const barPct = max > 0 ? (val/max)*100 : 0;
            const barColor = isNegRow ? '#ef4444' : barPct>80?'#22c55e':barPct>=40?'#f59e0b':'#ef4444';
            return (
              <div key={lbl} style={{marginBottom:10}}>
                <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:"#64748b",marginBottom:3}}>
                  <span>{lbl}{note?<span style={{color:"#475569",marginLeft:5}}>· {note}</span>:""}</span>
                  <span style={{fontWeight:600,color:isNegRow?'#ef4444':"#94a3b8"}}>{max>0?`${val}/${max}`:val}</span>
                </div>
                {max>0&&(
                  <div style={{height:4,background:"#1e293b",borderRadius:4,overflow:"hidden"}}>
                    <div style={{width:`${barPct}%`,height:"100%",background:barColor,borderRadius:4}}/>
                  </div>
                )}
              </div>
            );
          })}
          {nextGame&&(
            <div style={{borderTop:'1px solid #1e293b',paddingTop:8,marginTop:4,display:'flex',gap:8,flexWrap:'wrap'}}>
              {nextGame.venueAbbr&&(()=>{
                const pf = nextGame.parkFactor||1.0;
                const pfPct = Math.round((pf-1)*100);
                const pfColor = pf>=1.06?'#22c55e':pf<=0.95?'#ef4444':'#64748b';
                return <span style={{fontSize:10,color:pfColor,background:'#0f172a',borderRadius:4,padding:'2px 7px'}}>
                  🏟 {nextGame.venueAbbr} park {pfPct>=0?'+':''}{pfPct}%
                </span>;
              })()}
              {nextGame.isHome!=null&&(
                <span style={{fontSize:10,color:'#64748b',background:'#0f172a',borderRadius:4,padding:'2px 7px'}}>
                  {nextGame.isHome?'🏠 Home':'✈ Away'}
                </span>
              )}
            </div>
          )}
          {pred.consistency!=null&&(()=>{
            const c = pred.consistency;
            const label = c>=70?'Reliable · low variance':c<=30?'Streaky · high variance':'Average variance';
            const color = c>=70?'#60a5fa':c<=30?'#f59e0b':'#64748b';
            return(
              <div style={{marginBottom:10,paddingTop:4,borderTop:'1px solid #1e293b'}}>
                <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:"#64748b",marginBottom:3}}>
                  <span>Game-to-game consistency <span style={{color:"#475569"}}>· {label}</span></span>
                  <span style={{fontWeight:600,color}}>{c}/100</span>
                </div>
                <div style={{height:4,background:"#1e293b",borderRadius:4,overflow:"hidden"}}>
                  <div style={{width:`${c}%`,height:"100%",background:color,borderRadius:4}}/>
                </div>
              </div>
            );
          })()}
          {(()=>{
            const details = (pred.matchupDetails||[]).filter(Boolean);
            if(!details.length) return null;
            const seen=new Set(), unique=[];
            details.forEach(md=>{
              const key=md.pitcher?md.pitcher.name:(md.team+'-TBD');
              if(!seen.has(key)){seen.add(key);unique.push(md);}
            });
            return(
              <div style={{marginTop:12,borderTop:'1px solid #1e293b',paddingTop:12}}>
                {hitterSplits&&(hitterSplits.overall||hitterSplits.vsRHP||hitterSplits.vsLHP)&&(
                  <div style={{display:'flex',gap:14,fontSize:11,marginBottom:10,paddingBottom:10,borderBottom:'1px solid #1e293b'}}>
                    {hitterSplits.overall&&<span style={{color:'#64748b'}}>Overall <b style={{color:'#94a3b8'}}>{hitterSplits.overall}</b></span>}
                    <span style={{color:'#64748b'}}>vs RHP <b style={{color:hitterSplits.vsRHP?'#94a3b8':'#475569'}}>{hitterSplits.vsRHP||'—'}</b></span>
                    <span style={{color:'#64748b'}}>vs LHP <b style={{color:hitterSplits.vsLHP?'#94a3b8':'#475569'}}>{hitterSplits.vsLHP||'—'}</b></span>
                  </div>
                )}
                {unique.map((md,i)=>(
                  <div key={i} style={{marginBottom:10,fontSize:11}}>
                    <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:4}}>
                      <span style={{color:'#cbd5e1',fontWeight:700}}>{md.team}</span>
                      <span style={{color:'#475569'}}>·</span>
                      <span style={{color:'#e2e8f0'}}>{md.pitcher?md.pitcher.name:'TBD'}</span>
                      {md.pitcher&&<span style={{background:'#0f172a',border:'1px solid #334155',padding:'1px 5px',borderRadius:3,fontSize:10,color:'#94a3b8'}}>{md.pitcher.hand}HP</span>}
                    </div>
                    {(()=>{
                      const eraColor=era=>era==null?'#64748b':era>=4.50?'#22c55e':era>=3.50?'#f59e0b':'#ef4444';
                      const wlStr=md.teamWinPct!=null?`${Math.round(md.teamWinPct*10)}-${10-Math.round(md.teamWinPct*10)} L10`:null;
                      return md.pitcher?(
                        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'3px 10px',color:'#64748b',paddingLeft:2}}>
                          <span>ERA <b style={{color:eraColor(md.pitcher.era)}}>{md.pitcher.era!=null?md.pitcher.era.toFixed(2):'—'}</b> <span style={{color:'#334155',fontSize:10}}>(team {md.teamEra!=null?md.teamEra.toFixed(2):'—'})</span></span>
                          <span>Rank <b style={{color:'#94a3b8'}}>{md.pitcher.eraRank?'#'+md.pitcher.eraRank+' '+md.pitcher.league:'—'}</b></span>
                          <span>WHIP <b style={{color:'#94a3b8'}}>{md.pitcher.whip!=null?md.pitcher.whip.toFixed(2):'—'}</b></span>
                          <span>K/9 <b style={{color:'#94a3b8'}}>{md.pitcher.k9!=null?md.pitcher.k9.toFixed(1):'—'}</b></span>
                          <span>Med IP <b style={{color:'#94a3b8'}}>{md.pitcher.medianIP??'—'}</b></span>
                          {wlStr&&<span>L10 <b style={{color:md.teamWinPct<0.40?'#22c55e':md.teamWinPct>0.60?'#ef4444':'#f59e0b'}}>{wlStr}</b></span>}
                        </div>
                      ):(
                        <div style={{color:'#475569',paddingLeft:2,display:'flex',gap:10,flexWrap:'wrap'}}>
                          <span>Starter TBD · team ERA <b style={{color:eraColor(md.teamEra)}}>{md.teamEra!=null?md.teamEra.toFixed(2):'—'}</b></span>
                          {wlStr&&<span>· L10 <b style={{color:md.teamWinPct<0.40?'#22c55e':md.teamWinPct>0.60?'#ef4444':'#f59e0b'}}>{wlStr}</b></span>}
                        </div>
                      );
                    })()}
                  </div>
                ))}
              </div>
            );
          })()}
          <div style={{marginTop:14,padding:"10px 12px",background:"#1e293b",borderRadius:8,fontSize:11,color:"#475569",lineHeight:1.6}}>
            <b style={{color:"#64748b"}}>Methodology:</b> Cycle phase position (30) + Last-5 avg (25) + Season OPS (20) + 10-game momentum (15) + Matchup quality (10). Matchup data from live Apr 27–May 1 schedule.
          </div>
        </div>
      );
    };

    function readMeta(name) {
      const el = document.querySelector(`meta[name="${name}"]`);
      const val = el ? el.getAttribute("content") : "";
      return (val && !val.startsWith("%")) ? val : "";
    }
    function getCredential(metaName, lsKey) {
      return localStorage.getItem(lsKey) || readMeta(metaName) || "";
    }

    // ── Backtest game row (needs its own component so useState is legal) ──────

            <div style={{display:"flex",flexDirection:"column",gap:1,paddingRight:8,borderRight:"1px solid #1e293b"}}>
              <div style={{display:"flex",gap:5,alignItems:"center"}}>

                {actP&&<span style={{color:actP.predictedWin?"#22c55e":"#ef4444",fontWeight:700,fontSize:11}}>{actP.predictedWin?"W":"L"}</span>}

              <div style={{display:"flex",gap:5,alignItems:"center"}}>

                <span style={{color:"#e2e8f0",fontWeight:700,fontSize:11}}>{ourActRuns}R</span>
                <span style={{fontWeight:800,fontSize:11,color:g.actualWin?"#22c55e":"#ef4444"}}>{g.actualWin?"W":"L"}</span>
                {ourActWoba&&<span style={{color:wobaColor(ourActWoba),fontSize:9}}>wOBA {ourActWoba.toFixed(3)}</span>}
                {correct!=null&&<span style={{fontSize:12,marginLeft:2}}>{correct?"✓":"✗"}</span>}
              </div>
            </div>

            {/* Opponent column: pred → actual */}
            <div style={{display:"flex",flexDirection:"column",gap:1,paddingLeft:8}}>
              <div style={{display:"flex",gap:5,alignItems:"center"}}>
                <span style={{fontSize:9,color:"#475569",width:30}}>Pred</span>
                <span style={{color:oppP?runErrCol(oppRunErr):"#475569",fontWeight:700,fontSize:11}}>{oppPredRuns}R</span>
              </div>
              <div style={{display:"flex",gap:5,alignItems:"center"}}>
                <span style={{fontSize:9,color:"#475569",width:30}}>Act</span>
                <span style={{color:"#e2e8f0",fontWeight:700,fontSize:11}}>{oppActRuns}R</span>
                {oppActWoba&&<span style={{color:wobaColor(oppActWoba),fontSize:9}}>wOBA {oppActWoba.toFixed(3)}</span>}

            <span style={{color:"#334155",fontSize:11,textAlign:"right"}}>{expanded?"▲":"▼"}</span>
          </div>

          {/* Expanded: actual lineup */}
          {expanded&&(
            <div style={{background:"#0a1628",padding:"10px 12px"}}>
              <div style={{fontSize:10,fontWeight:700,color:"#94a3b8",marginBottom:6,textTransform:"uppercase",letterSpacing:0.8}}>Actual Lineup</div>
              {(g.actualLineup||[]).length===0
                ?<div style={{color:"#334155",fontSize:11}}>Box score data unavailable</div>
                :(g.actualLineup||[]).map((p,j)=>(

                    <span style={{fontSize:10,color:"#475569",width:22}}>{p.position||"—"}</span>

    // ── Today's Matchups Tab ─────────────────────────────────────────────────
    // Extracted game card so useState (lineup toggle) is legal inside .map()
    function MatchupCard({g, roster, predCache, fmtTime, fmtPct, winColor, mismatchColor, spLabel, kalshi, vegas}) {
      const [showLineups,   setShowLineups]   = React.useState(false);
      const [lineups,       setLineups]       = React.useState(null);
      const [badgeHovered,  setBadgeHovered]  = React.useState(false);

      const wobaColor = w => !w?'#64748b':w>=.370?'#22c55e':w>=.320?'#a3e635':w>=.280?'#f59e0b':'#ef4444';
      const tierIcon  = t => t==="hot"?"↑":t==="warm"?"↗":t==="cold"?"↓":"→";

      const buildLineups = React.useCallback(() => {
        if (lineups) return; // already built
        const teams = typeof _fetchTeamsList !== 'undefined' ? null : null; // teams available via roster
        const awayPool = roster.filter(p => p.team === g.awayName && (p.gamesPlayed||0) >= 5)
          .sort((a,b) => (predCache[b.player_name]?.score||0) - (predCache[a.player_name]?.score||0)).slice(0,14);
        const homePool = roster.filter(p => p.team === g.homeName && (p.gamesPlayed||0) >= 5)
          .sort((a,b) => (predCache[b.player_name]?.score||0) - (predCache[a.player_name]?.score||0)).slice(0,14);
        setLineups({
          away: buildOpponentLineup(awayPool, predCache),
          home: buildOpponentLineup(homePool, predCache),
        });
      }, [g.awayName, g.homeName, roster, predCache, lineups]);

      const handleToggle = () => {
        if (!showLineups) buildLineups();
        setShowLineups(v => !v);
      };

      const mPct = Math.round(g.mismatch * 100);

      const isLive = g.state === 'Live';
      const modelHomeProb  = g.home?.winProb ?? null;
      const kalshiHomeProb = kalshi?.homeWinProb ?? null;
      const kalshiAwayProb = kalshi?.awayWinProb ?? null;

      // ── Edge Meter computation ─────────────────────────────────────────────
      // Score 0–4: how many independent signals agree on the same favorite
      // Then compute the market gap (Kalshi or Vegas vs model) to size the edge
      const modelFav   = g.favorite; // 'home' | 'away'
      const vegasHomeP = vegas?.home_prob ?? null;
      const vegasFav   = vegasHomeP != null ? (vegasHomeP >= 0.5 ? 'home' : 'away') : null;
      const ceFav      = g.cycleEdge?.favorite ?? null;
      // Kalshi favorite from implied probs
      const kalshiFav  = kalshiHomeProb != null
        ? (kalshiHomeProb >= 0.5 ? 'home' : 'away') : null;

      // Signals that exist (have data) and their agreement with modelFav
      const signals = [
        { key: 'Model',     fav: modelFav,  always: true },
        { key: 'Cycle',     fav: ceFav,     always: false },
        { key: 'Vegas',     fav: vegasFav,  always: false },
        { key: 'Kalshi',    fav: kalshiFav, always: false },
      ].filter(s => s.fav != null);

      const signalCount   = signals.length;
      const agreeCount    = signals.filter(s => s.fav === modelFav).length;
      // Edge team = team most signals point to
      const edgeFav       = modelFav; // model is anchor; agreement bolsters it
      const edgeTeamAbbr  = edgeFav === 'home' ? g.homeAbbr : g.awayAbbr;

      // Market gap: model minus market on the HOME team (positive = model likes home more than market)
      const homeGap = (kalshiHomeProb != null && modelHomeProb != null)
        ? +(modelHomeProb - kalshiHomeProb).toFixed(3) : null;
      const vegasGap = (vegasHomeP != null && modelHomeProb != null)
        ? +(modelHomeProb - vegasHomeP).toFixed(3) : null;
      // Use whichever gap is available; Kalshi preferred
      const bestGap = homeGap ?? vegasGap;

      // favoredGap: gap in the direction of the model's favorite
      // Positive = model thinks favorite is underpriced (value bet)
      // Negative = market overprices the model's favorite (no value)
      const favoredGap = bestGap != null
        ? (modelFav === 'home' ? bestGap : -bestGap)
        : null;
      const gapPct = favoredGap != null ? favoredGap * 100 : 0;

      // Edge strength classification — gap must be in model's favor (market underpricing)
      // Strong: 3+ signals agree AND model sees ≥10pp of underpricing
      // Moderate: 2+ agree AND ≥8pp underpricing
      // Watch: 2+ agree but gap is small or no market data
      // None: signals split OR market already overprices model's pick (gapPct ≤ 0)
      const marketUnderprices = favoredGap == null || favoredGap > 0;
      const edgeStrength = (() => {
        if (isLive) return 'live';
        if (!marketUnderprices) return 'none'; // market already overprices — no value regardless of signal count
        if (agreeCount >= 3 && gapPct >= 10) return 'strong';
        if (agreeCount >= 2 && gapPct >= 8) return 'moderate';
        if (agreeCount >= 2) return 'watch'; // positive gap but small, or no market data
        return 'none';
      })();

      const edgeColors = {
        strong:   { border: '#22c55e', badge: '#22c55e', bg: 'rgba(34,197,94,0.08)'   },
        moderate: { border: '#f59e0b', badge: '#f59e0b', bg: 'rgba(245,158,11,0.08)'  },
        watch:    { border: '#6366f1', badge: '#6366f1', bg: 'rgba(99,102,241,0.06)'  },
        live:     { border: '#475569', badge: '#475569', bg: 'transparent'             },
        none:     { border: 'transparent', badge: '#475569', bg: 'transparent'         },
      };
      const ec = edgeColors[edgeStrength];

      const edgeBadgeLabel = {
        strong:   `🎯 STRONG EDGE: ${edgeTeamAbbr}`,
        moderate: `⚡ EDGE: ${edgeTeamAbbr}`,
        watch:    `👀 WATCH: ${edgeTeamAbbr}`,
        live:     '🔴 LIVE',
        none:     '',
      }[edgeStrength];

      // Tooltip: explain why this badge was shown
      const edgeTooltip = (() => {
        if (edgeStrength === 'none' || edgeStrength === 'live') return null;
        const agreeNames = signals.filter(s => s.fav === modelFav).map(s => s.key);
        const disagreeName = signals.filter(s => s.fav !== modelFav).map(s => s.key);
        const lines = [];
        lines.push(`${agreeCount}/${signalCount} signals favor ${edgeTeamAbbr}: ${agreeNames.join(', ')}`);
        if (disagreeName.length) lines.push(`Against: ${disagreeName.join(', ')}`);
        if (favoredGap != null && favoredGap > 0)
          lines.push(`Market underprices ${edgeTeamAbbr} by ${gapPct.toFixed(0)}pp`);
        else if (favoredGap == null)
          lines.push('No market data — based on signal agreement only');
        if (edgeStrength === 'strong')
          lines.push('Bet size: consider full unit');
        else if (edgeStrength === 'moderate')
          lines.push('Bet size: consider half unit');
        else
          lines.push('Gap is small — monitor for price movement');
        return lines;
      })();

      const LineupPanel = ({title, lineup, sp, spEra, accentColor}) => {
        const l10wins = null; // not available in today's context
        return (
          <div style={{background:'#0f172a',borderRadius:8,padding:'10px 14px',flex:1,minWidth:0}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8,paddingBottom:6,borderBottom:`2px solid ${accentColor}`}}>
              <span style={{fontWeight:800,fontSize:12,color:accentColor,textTransform:'uppercase',letterSpacing:1}}>{title}</span>
            </div>
            {sp ? (
              <div style={{marginBottom:8,padding:'5px 8px',background:'#1e293b',borderRadius:5,fontSize:11}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                  <span style={{color:'#94a3b8',fontWeight:700}}>Facing: {sp.name}</span>
                  <span style={{background:'#334155',borderRadius:3,padding:'1px 5px',color:'#94a3b8',fontSize:10}}>{sp.hand}HP</span>
                </div>
                <div style={{display:'flex',gap:12,marginTop:3,color:'#64748b'}}>
                  {[['ERA',sp.era?.toFixed(2)],['WHIP',sp.whip?.toFixed(2)],['K/9',sp.k9?.toFixed(1)]].map(([l,v])=>v!=null&&(
                    <span key={l}>{l} <b style={{color:l==='ERA'?(sp.era>=4.50?'#22c55e':sp.era>=3.50?'#f59e0b':'#ef4444'):'#94a3b8'}}>{v}</b></span>
                  ))}
                </div>
              </div>
            ) : (
              <div style={{marginBottom:8,padding:'5px 8px',background:'#1e293b',borderRadius:5,fontSize:11,color:'#475569'}}>
                Facing: TBD · opp ERA <b>{spEra?.toFixed(2)||'—'}</b>
              </div>
            )}
            {lineup && lineup.length > 0 ? lineup.map((entry, i) => {
              const spot = i + 1;
              if (!entry) return (
                <div key={spot} style={{display:'flex',alignItems:'center',gap:6,padding:'3px 4px',marginBottom:1}}>
                  <span style={{width:18,color:'#334155',fontSize:11,fontWeight:700}}>{spot}.</span>
                  <span style={{color:'#334155',fontSize:12}}>TBD</span>
                </div>
              );
              const {player} = entry, pred = predCache[player.player_name];
              const sc = pred ? TIER_COLOR[pred.tier] : '#64748b';
              const diff = player.typicalSpot && player.typicalSpot !== spot;
              return (
                <div key={spot} style={{display:'flex',alignItems:'center',gap:6,padding:'3px 4px',marginBottom:1,borderRadius:4,
                  background:spot===3||spot===4?'rgba(255,255,255,0.02)':'transparent'}}>
                  <span style={{width:18,color:'#475569',fontSize:11,fontWeight:700,flexShrink:0}}>{spot}.</span>
                  <span style={{flex:1,fontSize:12,fontWeight:600,color:'#e2e8f0',overflow:'hidden',whiteSpace:'nowrap',textOverflow:'ellipsis'}}>
                    {player.player_name}
                    {diff && <span style={{color:'#334155',fontSize:9,marginLeft:3}} title={`usually bats ${player.typicalSpot}`}>†</span>}
                  </span>
                  <span style={{fontSize:10,color:'#64748b',width:26,flexShrink:0}}>{player.position?.split(',')[0]||'—'}</span>
                  <span style={{fontSize:11,fontWeight:700,color:wobaColor(player.avgWoba),width:36,flexShrink:0}}>{player.avgWoba?.toFixed(3)||'—'}</span>
                  {pred && <span style={{fontSize:11,fontWeight:700,color:sc,width:26,flexShrink:0,textAlign:'right'}}>{pred.score}{tierIcon(pred.tier)}</span>}
                </div>
              );
            }) : (
              <div style={{color:'#475569',fontSize:12,padding:'8px 0',textAlign:'center'}}>
                No roster data for this team
              </div>
            )}
          </div>
        );
      };

      return (
        <div style={{background:'#1e293b',borderRadius:12,padding:16,marginBottom:10,
          border: `1px solid ${ec.border}`}}>
          {/* Header row */}
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12,flexWrap:'wrap',gap:8}}>
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <span style={{fontWeight:800,fontSize:16,color:'#f1f5f9'}}>{g.awayAbbr} @ {g.homeAbbr}</span>
              <span style={{fontSize:12,color:'#475569'}}>{fmtTime(g.gameTime)}</span>
              {g.state === 'Live' && <span style={{fontSize:10,fontWeight:700,color:'#22c55e',background:'rgba(34,197,94,0.1)',padding:'2px 7px',borderRadius:4}}>LIVE</span>}
              {g.lineupSource === 'actual' && <span style={{fontSize:10,color:'#3b82f6',background:'rgba(59,130,246,0.1)',padding:'2px 7px',borderRadius:4}}>Lineup confirmed</span>}
              {g.lineupSource === 'estimated' && <span style={{fontSize:10,color:'#475569',background:'rgba(71,85,105,0.1)',padding:'2px 7px',borderRadius:4}}>Est. lineup</span>}
            </div>
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <button onClick={handleToggle}
                style={{padding:'5px 12px',borderRadius:6,border:'none',cursor:'pointer',fontWeight:700,fontSize:11,
                  background:showLineups?'#334155':'#1e3a5f',color:showLineups?'#94a3b8':'#60a5fa'}}>
                {showLineups ? 'Hide Lineups' : 'Lineups'}
              </button>
              <div style={{display:'flex',alignItems:'center',gap:6}}>
                <span style={{fontSize:11,color:'#475569'}}>Confidence</span>
                <span style={{fontSize:20,fontWeight:800,color:mismatchColor(g.mismatch)}}>{mPct}%</span>
              </div>
            </div>
          </div>

          {/* Two-column matchup stats */}
          <div style={{display:'grid',gridTemplateColumns:'1fr auto 1fr',gap:8,alignItems:'center'}}>
            {/* Away team */}
            <div style={{background:'#0f172a',borderRadius:8,padding:'10px 14px',
              border: g.favorite==='away' ? '1px solid #22c55e' : '1px solid transparent'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
                <span style={{fontWeight:700,fontSize:14,color:'#e2e8f0'}}>{g.awayAbbr}</span>

              <div style={{fontSize:12,color:'#64748b',marginBottom:8}}>Faces: {spLabel(g.homeSp, g.homeSpEra)}</div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:4}}>

              <div style={{fontSize:12,color:'#64748b',marginBottom:8}}>Faces: {spLabel(g.awaySp, g.awaySpEra)}</div>
