<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;
    const { AreaChart, Area, BarChart, Bar, LineChart, Line, ComposedChart,
            XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer,
            ReferenceLine, Cell, Legend } = Recharts;

    const SEASON = 2026;
    const MIN_AT_BATS = 20;
    const CYCLE_LENGTH = 28;
    const PHASE_CONFIG = [
      { name:"Peak",      start:0,  end:6,  color:"#22c55e", desc:"High energy, strong output" },
      { name:"Ovulation", start:7,  end:13, color:"#3b82f6", desc:"Sustained performance window" },
      { name:"Luteal",    start:14, end:20, color:"#f59e0b", desc:"Slight decline, still capable" },
      { name:"Recovery",  start:21, end:27, color:"#ef4444", desc:"Rest & reset phase" },
    ];
    const getPhase = d => PHASE_CONFIG.find(p => d >= p.start && d <= p.end);

    const UPCOMING_SCHEDULE = {
      "New York Yankees":       { opponents:["TEX","TEX","TEX"], matchupFactor:1.15 },
      "Los Angeles Dodgers":    { opponents:["MIA","MIA","MIA"], matchupFactor:1.20 },
      "Houston Astros":         { opponents:["BAL","BAL"],       matchupFactor:1.05 },
      "Seattle Mariners":       { opponents:["MIN","MIN","MIN"], matchupFactor:1.08 },
      "Boston Red Sox":         { opponents:["TOR","TOR","TOR"], matchupFactor:1.05 },
      "San Diego Padres":       { opponents:["CHC","CHC","CHC"], matchupFactor:1.10 },
      "Chicago Cubs":           { opponents:["SD","SD","SD"],    matchupFactor:0.95 },
      "Atlanta Braves":         { opponents:["DET","DET","DET"], matchupFactor:1.18 },
      "Philadelphia Phillies":  { opponents:["SF","SF","SF"],    matchupFactor:1.02 },
      "Cleveland Guardians":    { opponents:["TB","TB","TB"],    matchupFactor:1.05 },
      "Tampa Bay Rays":         { opponents:["CLE","CLE","CLE"], matchupFactor:0.98 },
      "Minnesota Twins":        { opponents:["SEA","SEA","SEA"], matchupFactor:0.97 },
      "St. Louis Cardinals":    { opponents:["PIT","PIT","PIT"], matchupFactor:1.18 },
      "Kansas City Royals":     { opponents:["ATH","ATH"],       matchupFactor:1.12 },
      "Cincinnati Reds":        { opponents:["COL","COL","COL"], matchupFactor:1.22 },
      "Pittsburgh Pirates":     { opponents:["STL","STL","STL"], matchupFactor:0.92 },
      "Baltimore Orioles":      { opponents:["HOU","HOU"],       matchupFactor:0.95 },
      "Toronto Blue Jays":      { opponents:["BOS","BOS","BOS"], matchupFactor:1.00 },
      "Texas Rangers":          { opponents:["NYY","NYY","NYY"], matchupFactor:0.90 },
      "Chicago White Sox":      { opponents:["LAA","LAA","LAA"], matchupFactor:1.10 },
      "default":                { opponents:[],                  matchupFactor:1.00 },
    };

    function computePredictionScore(playerName, teamName, gameData, seasonStats) {
      if (!gameData || gameData.length < 3) return { score:50, label:"Insufficient data", tier:"neutral", breakdown:{phaseScore:0,trendScore:0,opsScore:0,momentumScore:0,matchupScore:0}, opponents:[] };

      let phaseScore = 15;
      let phaseLabel = "current cycle";
      const analysis = analyzePlayerCycles(gameData);
      if (analysis && analysis.forecastValues.length > 0) {
        const f = analysis.forecastValues;
        const trend3  = f.slice(0,3).reduce((a,b)=>a+b,0)/3;
        const trend3b = f.slice(1,4).reduce((a,b)=>a+b,0)/3;
        const slope   = trend3b - trend3;
        const level   = f[0] - analysis.mean;
        phaseScore = slope > 0.010 ? 30 : slope > 0.004 ? 26
                   : slope > 0     ? 20 : slope > -0.004 ? 14
                   : slope > -0.010 ? 8 : 4;
        if (level > 0.015) phaseScore = Math.min(30, phaseScore + 4);
        const topPeriod = analysis.dominantCycles[0]?.periodDays;
        phaseLabel = topPeriod
          ? (slope > 0 ? `rising ${topPeriod}d cycle` : `falling ${topPeriod}d cycle`)
          : (slope > 0 ? "rising cycle" : "falling cycle");
      } else {
        const lastCycleDay = gameData[gameData.length - 1]?.cycleDay ?? 0;
        const nextCycleDay = (lastCycleDay + 1) % CYCLE_LENGTH;
        const np = getPhase(nextCycleDay);
        phaseScore = np.name === "Peak" ? 30 : np.name === "Ovulation" ? 22 : np.name === "Luteal" ? 12 : 4;
        phaseLabel = np.name + " phase";
      }

      const last5     = gameData.slice(-5);
      const last5Avg  = last5.reduce((s,g) => s + g.avg, 0) / last5.length;
      const trendScore = Math.min(25, Math.round(last5Avg * 75));

      const ops      = seasonStats ? parseFloat(seasonStats.ops) : 0;
      const opsScore = ops >= 0.900 ? 20 : ops >= 0.800 ? 16 : ops >= 0.700 ? 11 : ops >= 0.600 ? 6 : 3;

      const last10     = gameData.slice(-10);
      const firstHalf  = last10.slice(0,5).reduce((s,g) => s + g.avg, 0) / 5;
      const secondHalf = last10.slice(5).reduce((s,g) => s + g.avg, 0) / Math.max(last10.slice(5).length, 1);
      const momentumScore = secondHalf > firstHalf ? Math.min(15, Math.round((secondHalf - firstHalf) * 100)) : 0;

      const sched       = UPCOMING_SCHEDULE[teamName] || UPCOMING_SCHEDULE["default"];
      const matchupScore = Math.max(0, Math.min(10, Math.round((sched.matchupFactor - 0.85) / 0.45 * 10)));

      const score = Math.min(99, Math.max(1, phaseScore + trendScore + opsScore + momentumScore + matchupScore));
      const tier  = score >= 75 ? "hot" : score >= 55 ? "warm" : score >= 35 ? "neutral" : "cold";
      const label = score >= 75 ? `Fire — ${phaseLabel}, strong outlook`
                  : score >= 55 ? `Trending up — ${phaseLabel}`
                  : score >= 35 ? `Steady — ${phaseLabel}`
                  : `Cooling off — ${phaseLabel}`;

      return { score, tier, label, phaseLabel, opponents: sched.opponents,
               breakdown: { phaseScore, trendScore, opsScore, momentumScore, matchupScore } };
    }

    const TIER_COLOR = { hot:"#22c55e", warm:"#f59e0b", neutral:"#64748b", cold:"#ef4444" };

    // ── DFT cycle analysis (hitters) ─────────────────────────────────────────
    function dft(signal) {
      const N = signal.length;
      const re = new Float64Array(N), im = new Float64Array(N);
      for (let k = 0; k < N; k++) {
        for (let n = 0; n < N; n++) {
          const angle = (2 * Math.PI * k * n) / N;
          re[k] += signal[n] * Math.cos(angle);
          im[k] -= signal[n] * Math.sin(angle);
        }
        re[k] /= N; im[k] /= N;
      }
      return { re, im };
    }

    function reconstructAt(components, N, positions) {
      return positions.map(x => {
        let v = 0;
        for (const { k, re, im } of components) {
          const angle = (2 * Math.PI * k * x) / N;
          v += re * Math.cos(angle) - im * Math.sin(angle);
        }
        return v;
      });
    }

    const FORECAST_DAYS = 14;
    const MAX_COMPONENTS = 5;
    const MIN_PERIOD = 4;
    const MIN_AMPLITUDE = 0.005;

    function analyzePlayerCycles(gameData) {
      const N = gameData.length;
      if (N < 10) return null;
      const raw = gameData.map(g => g.avg);
      const mean = raw.reduce((a,b)=>a+b,0) / N;
      const signal = raw.map(v => v - mean);
      const { re, im } = dft(signal);
      const spectrum = [];
      for (let k = 1; k <= Math.floor(N / 2); k++) {
        const amp = 2 * Math.sqrt(re[k]*re[k] + im[k]*im[k]);
        const periodDays = N / k;
        if (periodDays < MIN_PERIOD) continue;
        spectrum.push({ k, amp, periodDays, re: re[k], im: im[k] });
      }
      spectrum.sort((a,b) => b.amp - a.amp);
      const totalPower = spectrum.reduce((s,c) => s + c.amp*c.amp, 0) || 1;
      const kept = spectrum.filter(c => c.amp >= MIN_AMPLITUDE).slice(0, MAX_COMPONENTS);
      if (kept.length === 0) return null;
      const components = [{ k:0, re: mean, im: 0 }, ...kept];
      const positions = Array.from({ length: N }, (_,i) => i);
      const reconstructed = reconstructAt(components, N, positions);
      const ssTot = raw.reduce((s,v) => s + (v-mean)**2, 0);
      const ssRes = raw.reduce((s,v,i) => s + (v-reconstructed[i])**2, 0);
      const r2 = ssTot > 0 ? Math.max(0, 1 - ssRes/ssTot) : 0;
      const forecastPositions = Array.from({ length: FORECAST_DAYS }, (_,i) => N + i);
      const forecastValues = reconstructAt(components, N, forecastPositions);
      const dominantCycles = kept.map(c => ({
        periodDays: +c.periodDays.toFixed(1),
        amplitude:  +c.amp.toFixed(4),
        pctVariance: +(100 * c.amp*c.amp / totalPower).toFixed(1),
      }));
      return { dominantCycles, reconstructed, forecastValues, components, N, mean, r2 };
    }

    function buildCycleChartData(gameData, analysis) {
      if (!analysis) return [];
      const { reconstructed, forecastValues } = analysis;
      const historical = gameData.map((g,i) => ({
        date:     g.date,
        actual:   +g.avg.toFixed(3),
        fitted:   +Math.max(0.050, reconstructed[i]).toFixed(3),
        forecast: null,
      }));
      const lastFitted = historical.length ? historical[historical.length-1].fitted : 0;
      const forecastPoints = forecastValues.map((v,i) => ({
        date:     `+${i+1}d`,
        actual:   null,
        fitted:   null,
        forecast: +Math.max(0.050, v).toFixed(3),
        isForecast: true,
      }));
      if (forecastPoints.length && historical.length) {
        forecastPoints.unshift({
          date:     historical[historical.length-1].date,
          actual:   null,
          fitted:   lastFitted,
          forecast: +Math.max(0.050, forecastValues[0]).toFixed(3),
          isForecast: false,
        });
      }
      return [...historical, ...forecastPoints];
    }

    // ── Pitcher FFT helpers ───────────────────────────────────────────────────
    function fftPitcher(values) {
      const N = values.length;
      if (N < 4) return { dominantCycleDays: null, amplitude: 0, predictionScore: 0 };
      const mean = values.reduce((a, b) => a + b, 0) / N;
      const signal = values.map(v => v - mean);
      // Simple DFT (reuse same approach as hitter engine)
      const re = new Float64Array(N), im = new Float64Array(N);
      for (let k = 0; k < N; k++) {
        for (let n = 0; n < N; n++) {
          const angle = (2 * Math.PI * k * n) / N;
          re[k] += signal[n] * Math.cos(angle);
          im[k] -= signal[n] * Math.sin(angle);
        }
        re[k] /= N; im[k] /= N;
      }
      let bestIdx = 1, bestMag = 0;
      for (let i = 1; i <= Math.floor(N / 2); i++) {
        const mag = 2 * Math.sqrt(re[i]*re[i] + im[i]*im[i]);
        if (mag > bestMag) { bestMag = mag; bestIdx = i; }
      }
      const cycleDays = Math.round(N / bestIdx);
      const amplitude = bestMag;
      const variance = signal.reduce((a, b) => a + b * b, 0) / N;
      const score = variance > 0 ? Math.min(99, Math.round((amplitude / Math.sqrt(variance)) * 33)) : 0;
      return { dominantCycleDays: cycleDays, amplitude, predictionScore: score };
    }

    function buildPitcherForecast(gamelogs, metric) {
      const vals = gamelogs.map(g => parseFloat(g[metric]) || 0);
      const { dominantCycleDays, predictionScore } = fftPitcher(vals);
      if (!dominantCycleDays) return { forecast: [], predictionScore: 0, dominantCycleDays: null };
      const last = vals.slice(-dominantCycleDays);
      const lastDate = new Date(gamelogs[gamelogs.length - 1].game_date + "T12:00:00");
      const forecast = Array.from({ length: 14 }, (_, i) => {
        const d = new Date(lastDate);
        d.setDate(d.getDate() + i + 1);
        const idx = i % dominantCycleDays;
        return {
          date: d.toISOString().slice(0, 10),
          value: +(last[idx % last.length] || 0).toFixed(3),
        };
      });
      return { forecast, predictionScore, dominantCycleDays };
    }

    function scoreColor(score) {
      if (score >= 75) return '#22c55e';
      if (score >= 50) return '#f59e0b';
      return '#ef4444';
    }

    // MLB player ID lookup
    const MLB_IDS = {
      "Aaron Judge":592450, "Shohei Ohtani":660271, "Mookie Betts":605141,
      "Freddie Freeman":518692, "Juan Soto":665742, "Mike Trout":545361,
      "Ronald Acuña Jr.":660670, "Bryce Harper":547180, "Trea Turner":607208,
      "José Ramírez":608070, "Nolan Arenado":571448, "Paul Goldschmidt":502671,
      "Pete Alonso":624413, "Vladimir Guerrero Jr.":665489, "Bo Bichette":666182,
      "Yordan Alvarez":670541, "Kyle Tucker":663538, "Julio Rodríguez":677594,
      "Gunnar Henderson":683002, "Corey Seager":608369, "Marcus Semien":543760,
      "Rafael Devers":646240, "Austin Riley":663586, "Matt Olson":621566,
      "Corbin Carroll":682998, "Jarren Duran":680776, "Adolis García":666969,
      "Ha-Seong Kim":673490, "Jeff McNeil":643446, "Max Muncy":571970,
      "Ketel Marte":606466, "Christian Yelich":592885, "Teoscar Hernández":606192,
    };

    const DEMO_PLAYERS = Object.keys(MLB_IDS).slice(0,6).map(name=>({player_name:name,team:"MLB"}));

    const rng = s => { let x = Math.sin(s)*10000; return x - Math.floor(x); };
    const genDemo = (name, seed) => Array.from({length:90}, (_, i) => {
      const d = new Date(); d.setDate(d.getDate() - (89 - i));
      const cyc = i % CYCLE_LENGTH, ph = getPhase(cyc);
      const avg = Math.max(0.1, Math.min(0.5,
        0.260 + 0.040 * Math.sin((2*Math.PI*i)/CYCLE_LENGTH + seed) + (rng(seed*i+1)-0.5)*0.08));
      return {
        date: d.toLocaleDateString("en-US",{month:"short",day:"numeric"}),
        cycleDay:cyc, phase:ph.name, phaseColor:ph.color,
        avg:+avg.toFixed(3), ops:+(avg*1.7+rng(seed*i+2)*0.15).toFixed(3),
        hits:Math.floor(rng(seed*i+3)*3)+(ph.name==="Peak"?1:0),
        hr:rng(seed*i+4)>0.88?1:0, ab:Math.floor(rng(seed*i+5)*3)+2, rbi:0,
      };
    });

    // Demo pitcher data generator
    const genDemoPitcher = (name, seed) => {
      const starts = Array.from({length: 20}, (_, i) => {
        const d = new Date(); d.setDate(d.getDate() - (19 - i) * 5);
        const era  = Math.max(1.0, Math.min(8.0, 3.80 + 1.2*Math.sin((2*Math.PI*i)/6 + seed) + (rng(seed*i+1)-0.5)*0.8));
        const whip = Math.max(0.8, Math.min(2.0, 1.20 + 0.3*Math.sin((2*Math.PI*i)/6 + seed+1) + (rng(seed*i+2)-0.5)*0.3));
        const k9   = Math.max(4.0, Math.min(14.0, 9.0 + 2.0*Math.sin((2*Math.PI*i)/8 + seed+2) + (rng(seed*i+3)-0.5)*1.5));
        const gs   = Math.max(20, Math.min(85, 58 + 18*Math.sin((2*Math.PI*i)/6 + seed) + (rng(seed*i+4)-0.5)*12));
        const ip   = Math.max(3.0, Math.min(9.0, 5.5 + 1.5*Math.sin((2*Math.PI*i)/7 + seed) + (rng(seed*i+5)-0.5)*1.0));
        return {
          game_date: d.toISOString().slice(0,10),
          era: +era.toFixed(2), whip: +whip.toFixed(2),
          k_per_9: +k9.toFixed(1), game_score: Math.round(gs),
          innings_pitched: +ip.toFixed(1),
        };
      });
      return starts;
    };

    const DEMO_PITCHERS = [
      "Gerrit Cole","Clayton Kershaw","Max Scherzer","Justin Verlander",
      "Jacob deGrom","Shane Bieber","Corbin Burnes","Sandy Alcantara",
    ].map((name, i) => ({ name, gamelogs: genDemoPitcher(name, i * 1.7 + 1) }));

    const phaseAvg = (games,ph,stat) => {
      const f = games.filter(g=>g.phase===ph);
      return f.length ? (f.reduce((s,g)=>s+g[stat],0)/f.length).toFixed(3) : "—";
    };

    const CustomTooltip = ({active,payload}) => {
      if(!active||!payload?.length) return null;
      const d = payload[0].payload;
      return (
        <div style={{background:"#1e293b",border:`1px solid ${d.phaseColor||"#334155"}`,borderRadius:8,padding:"10px 14px",fontSize:12}}>
          <div style={{color:"#94a3b8",marginBottom:4}}>{d.date}</div>
          <div style={{color:d.phaseColor,fontWeight:700,marginBottom:6}}>📍 {d.phase} (Day {d.cycleDay+1})</div>
          <div style={{color:"#f1f5f9"}}>AVG: <b>{(+d.avg).toFixed(3)}</b> · OPS: <b>{(+d.ops).toFixed(3)}</b></div>
          <div style={{color:"#f1f5f9"}}>Hits: <b>{d.hits}</b> · HR: <b>{d.hr}</b>{d.ab?` · AB: `+d.ab:""}</div>
        </div>
      );
    };

    // Supabase helpers
    async function sbFetch(url,key,path){
      const r = await fetch(`${url}/rest/v1/${path}`,{headers:{apikey:key,Authorization:`Bearer ${key}`}});
      if(!r.ok) throw new Error(`Supabase ${r.status}: ${await r.text()}`);
      return r.json();
    }
    async function fetchRoster(url,key){
      const PAGE = 1000;
      let offset = 0, all = [], page;
      do {
        page = await sbFetch(url, key,
          `player_gamelogs?select=player_name,team&order=player_name.asc,team.asc&limit=${PAGE}&offset=${offset}`);
        all = all.concat(page);
        offset += PAGE;
      } while (page.length === PAGE);
      const seen = new Set();
      return all.filter(r=>{const k=`${r.player_name}||${r.team}`;if(seen.has(k))return false;seen.add(k);return true;});
    }
    async function fetchPlayerGames(url,key,playerName){
      const since = new Date(); since.setDate(since.getDate()-90);
      const iso = since.toISOString().split("T")[0];
      return sbFetch(url,key,`player_gamelogs?player_name=eq.${encodeURIComponent(playerName)}&game_date=gte.${iso}&order=game_date.asc&select=*`);
    }
    function transformRows(rows){
      return rows.map((row,i)=>{
        const cyc=i%CYCLE_LENGTH, ph=getPhase(cyc), avg=parseFloat(row.batting_avg)||0;
        return{
          date:new Date(row.game_date+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"}),
          cycleDay:cyc, phase:ph.name, phaseColor:ph.color,
          avg:+avg.toFixed(3), ops:+(parseFloat(row.ops)||avg*1.7).toFixed(3),
          hits:row.hits||0, hr:row.home_runs||0, ab:row.at_bats||0, rbi:row.rbi||0,
        };
      });
    }

    // Fetch pitchers from Supabase
    async function fetchPitchersFromDB(url, key, team) {
      const PAGE = 1000;
      let offset = 0, all = [], page;
      const teamClause = team && team !== 'ALL' ? `&team=eq.${encodeURIComponent(team)}` : '';
      do {
        page = await sbFetch(url, key,
          `pitcher_gamelogs?order=game_date.desc${teamClause}&limit=${PAGE}&offset=${offset}&select=*`);
        all = all.concat(page);
        offset += PAGE;
      } while (page.length === PAGE);

      const byPlayer = {};
      for (const row of all) {
        if (!byPlayer[row.player_name]) byPlayer[row.player_name] = [];
        byPlayer[row.player_name].push(row);
      }

      return Object.entries(byPlayer).map(([name, logs]) => {
        const sorted = [...logs].sort((a, b) => a.game_date.localeCompare(b.game_date));
        const recent = sorted.slice(-30);
        const avg = (key) => {
          const vals = recent.map(g => parseFloat(g[key])).filter(v => !isNaN(v));
          return vals.length ? (vals.reduce((a, b) => a + b, 0) / vals.length).toFixed(2) : '—';
        };
        const fftMetric = recent.some(g => g.game_score != null) ? 'game_score' : 'era';
        const { predictionScore, dominantCycleDays, forecast } = buildPitcherForecast(recent, fftMetric);
        return { name, gamelogs: recent, era: avg('era'), whip: avg('whip'), k9: avg('k_per_9'), fftMetric, predictionScore, dominantCycleDays, forecast };
      });
    }

    // MLB Stats API helpers
    async function mlbSearchPlayer(query){
      try{
        const r = await fetch(`https://statsapi.mlb.com/api/v1/people/search?names=${encodeURIComponent(query)}&sportIds=1&active=true`);
        const d = await r.json();
        if(d.people?.length) return d.people[0];
      }catch(_){}
      const lower = query.toLowerCase();
      const match = Object.entries(MLB_IDS).find(([n])=>n.toLowerCase().includes(lower));
      return match ? {id:match[1],fullName:match[0]} : null;
    }
    async function mlbFetchGameLog(id){
      const r = await fetch(`https://statsapi.mlb.com/api/v1/people/${id}/stats?stats=gameLog&season=${SEASON}&group=hitting&sportId=1`);
      const d = await r.json(); return d.stats?.[0]?.splits||[];
    }
    async function mlbFetchSeasonStats(id){
      const r = await fetch(`https://statsapi.mlb.com/api/v1/people/${id}/stats?stats=season&season=${SEASON}&group=hitting&sportId=1`);
      const d = await r.json(); return d.stats?.[0]?.splits?.[0]?.stat||{};
    }
    async function mlbFetchInfo(id){
      const r = await fetch(`https://statsapi.mlb.com/api/v1/people/${id}?hydrate=currentTeam`);
      const d = await r.json(); return d.people?.[0]||{};
    }
    function transformMLBSplits(splits){
      return splits.filter(s=>(s.stat?.atBats||0)>0).map((s,i)=>{
        const cyc=i%CYCLE_LENGTH, ph=getPhase(cyc), avg=parseFloat(s.stat?.avg)||0, obp=parseFloat(s.stat?.obp)||0, slg=parseFloat(s.stat?.slg)||0;
        return{
          date:s.date?new Date(s.date+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"}):`G${i+1}`,
          cycleDay:cyc, phase:ph.name, phaseColor:ph.color,
          avg:+avg.toFixed(3), ops:+(obp+slg).toFixed(3),
          hits:s.stat?.hits||0, hr:s.stat?.homeRuns||0, ab:s.stat?.atBats||0, rbi:s.stat?.rbi||0,
        };
      });
    }

    // Score bar
    const ScoreBar = ({score,tier,size="sm"}) => {
      const color = TIER_COLOR[tier]||"#64748b", h = size==="lg"?10:5;
      return(
        <div style={{display:"flex",alignItems:"center",gap:size==="lg"?10:6}}>
          <div style={{flex:1,height:h,background:"#0f172a",borderRadius:h,overflow:"hidden",minWidth:size==="lg"?80:44}}>
            <div style={{width:`${score}%`,height:"100%",background:color,borderRadius:h,transition:"width 0.4s"}}/>
          </div>
          <span style={{fontSize:size==="lg"?15:11,fontWeight:700,color,minWidth:size==="lg"?28:20,textAlign:"right"}}>{score}</span>
        </div>
      );
    };

    const PredictionPanel = ({pred}) => {
      if(!pred) return null;
      const color = TIER_COLOR[pred.tier];
      const rows = [
        ["Cycle phase",        pred.breakdown.phaseScore,    30, pred.phaseLabel||null],
        ["Last-5 avg trend",   pred.breakdown.trendScore,    25, null],
        ["Season OPS",         pred.breakdown.opsScore,      20, null],
        ["10-game momentum",   pred.breakdown.momentumScore, 15, null],
        ["Matchup quality",    pred.breakdown.matchupScore,  10, pred.opponents?.length ? "vs "+pred.opponents.join(", ") : "TBD"],
      ];
      return(
        <div style={{background:"#0f172a",borderRadius:10,padding:16}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <div style={{fontSize:13,fontWeight:700,color}}>3–5 Day Performance Outlook</div>
            <div style={{fontSize:26,fontWeight:800,color}}>{pred.score}<span style={{fontSize:11,color:"#64748b",fontWeight:400}}>/99</span></div>
          </div>
          <div style={{fontSize:12,color:"#94a3b8",marginBottom:14,lineHeight:1.5}}>{pred.label}</div>
          {rows.map(([lbl,val,max,note])=>(
            <div key={lbl} style={{marginBottom:10}}>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:"#64748b",marginBottom:3}}>
                <span>{lbl}{note?<span style={{color:"#475569",marginLeft:5}}>· {note}</span>:""}</span>
                <span style={{fontWeight:600,color:"#94a3b8"}}>{val}/{max}</span>
              </div>
              <div style={{height:4,background:"#1e293b",borderRadius:4,overflow:"hidden"}}>
                <div style={{width:`${(val/max)*100}%`,height:"100%",background:color,borderRadius:4}}/>
              </div>
            </div>
          ))}
          <div style={{marginTop:14,padding:"10px 12px",background:"#1e293b",borderRadius:8,fontSize:11,color:"#475569",lineHeight:1.6}}>
            <b style={{color:"#64748b"}}>Methodology:</b> Cycle phase position (30) + Last-5 avg (25) + Season OPS (20) + 10-game momentum (15) + Matchup quality (10). Matchup data from live Apr 27–May 1 schedule.
          </div>
        </div>
      );
    };

    function readMeta(name) {
      const el = document.querySelector(`meta[name="${name}"]`);
      const val = el ? el.getAttribute("content") : "";
      return (val && !val.startsWith("%")) ? val : "";
    }
    function getCredential(metaName, lsKey) {
      return localStorage.getItem(lsKey) || readMeta(metaName) || "";
    }

    // ── Pitchers Tab Component ────────────────────────────────────────────────
    function PitchersTab({ dataSource, sbUrl, sbKey, teamFilter }) {
      const [pitchers, setPitchers]         = useState([]);
      const [loading, setLoading]           = useState(true);
      const [error, setError]               = useState("");
      const [selected, setSelected]         = useState(null);
      const [sortBy, setSortBy]             = useState("predictionScore");
      const [pitcherView, setPitcherView]   = useState("trends");
      const [insight, setInsight]           = useState({});
      const [insightLoading, setInsightLoading] = useState({});

      useEffect(() => {
        setLoading(true); setError(""); setPitchers([]); setSelected(null);
        if (dataSource === "live" && sbUrl && sbKey) {
          fetchPitchersFromDB(sbUrl, sbKey, teamFilter)
            .then(data => {
              const sorted = data.sort((a,b) => b.predictionScore - a.predictionScore);
              setPitchers(sorted);
              setSelected(sorted[0] || null);
            })
            .catch(e => setError(e.message))
            .finally(() => setLoading(false));
        } else {
          // Demo / MLB API mode — use generated demo pitchers
          setTimeout(() => {
            const enriched = DEMO_PITCHERS.map(p => {
              const fftMetric = 'game_score';
              const { predictionScore, dominantCycleDays, forecast } = buildPitcherForecast(p.gamelogs, fftMetric);
              const avg = (key) => {
                const vals = p.gamelogs.map(g => parseFloat(g[key])).filter(v => !isNaN(v));
                return vals.length ? (vals.reduce((a,b) => a+b, 0) / vals.length).toFixed(2) : '—';
              };
              return { ...p, era: avg('era'), whip: avg('whip'), k9: avg('k_per_9'), fftMetric, predictionScore, dominantCycleDays, forecast };
            }).sort((a,b) => b.predictionScore - a.predictionScore);
            setPitchers(enriched);
            setSelected(enriched[0] || null);
            setLoading(false);
          }, 300);
        }
      }, [dataSource, sbUrl, sbKey, teamFilter]);

      const handleInsight = async (pitcher) => {
        setInsightLoading(prev => ({...prev, [pitcher.name]: true}));
        const summary = pitcher.gamelogs.slice(-10).map(g =>
          `${g.game_date}: ERA ${g.era ?? '?'}, WHIP ${g.whip ?? '?'}, K/9 ${g.k_per_9 ?? '?'}, IP ${g.innings_pitched ?? '?'}`
        ).join('\n');
        try {
          const res = await fetch('/api/scout', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              prompt: `You are a baseball analytics AI. Analyze ${pitcher.name}'s recent pitching performance:\n${summary}\n\nIn 3-4 sentences: describe the trend in ERA/WHIP/K9, identify any cycle or pattern (cycle length: ${pitcher.dominantCycleDays ?? 'unknown'} starts, prediction score: ${pitcher.predictionScore}/99), and give a concrete fantasy/lineup recommendation for the next 2-3 starts.`
            })
          });
          if (!res.ok) throw new Error(`API ${res.status}`);
          const d = await res.json();
          setInsight(prev => ({...prev, [pitcher.name]: d.text || d.insight || 'No insight returned.'}));
        } catch(e) {
          setInsight(prev => ({...prev, [pitcher.name]: 'Error: ' + e.message}));
        }
        setInsightLoading(prev => ({...prev, [pitcher.name]: false}));
      };

      const s = {
        card: {background:"#1e293b",borderRadius:12,padding:16},
        btn: (active, color="#3b82f6") => ({padding:"7px 14px",borderRadius:8,border:"none",cursor:"pointer",fontWeight:700,fontSize:12,background:active?color:"#334155",color:active?"#fff":"#94a3b8"}),
      };

      const sorted = [...pitchers].sort((a, b) => {
        if (sortBy === 'predictionScore') return b.predictionScore - a.predictionScore;
        if (sortBy === 'era')  return parseFloat(a.era)  - parseFloat(b.era);
        if (sortBy === 'whip') return parseFloat(a.whip) - parseFloat(b.whip);
        if (sortBy === 'k9')   return parseFloat(b.k9)   - parseFloat(a.k9);
        return 0;
      });

      if (loading) return <div style={{...s.card,textAlign:"center",padding:60,color:"#64748b"}}>Loading pitcher data…</div>;
      if (error)   return <div style={{...s.card,padding:20,color:"#fca5a5"}}>⚠️ {error}</div>;
      if (!pitchers.length) return <div style={{...s.card,textAlign:"center",padding:60,color:"#64748b"}}>No pitcher data found.</div>;

      return (
        <div style={{display:"grid",gridTemplateColumns:"260px 1fr",gap:16,alignItems:"start"}}>

          {/* Pitcher sidebar */}
          <div style={{...s.card,padding:12}}>
            <div style={{fontSize:12,fontWeight:700,color:"#94a3b8",marginBottom:10}}>PITCHERS</div>
            <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap"}}>
              {[["predictionScore","🔮 Score"],["era","ERA"],["whip","WHIP"],["k9","K/9"]].map(([v,label])=>(
                <button key={v} onClick={()=>setSortBy(v)}
                  style={{...s.btn(sortBy===v,"#a855f7"),flex:1,padding:"4px 6px",fontSize:10,minWidth:0}}>
                  {label}
                </button>
              ))}
            </div>
            <div style={{maxHeight:520,overflowY:"auto",fontSize:12}}>
              {sorted.map((p, rank) => {
                const isSel = selected?.name === p.name;
                const color = scoreColor(p.predictionScore);
                return (
                  <div key={p.name} onClick={() => { setSelected(p); setPitcherView("trends"); }}
                    style={{padding:"8px 10px",borderRadius:6,cursor:"pointer",marginBottom:3,
                      background:isSel?"#7c3aed":"transparent"}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3}}>
                      <span style={{color:isSel?"#fff":"#cbd5e1",fontWeight:isSel?700:400,fontSize:12}}>
                        <span style={{color:isSel?"rgba(255,255,255,0.5)":"#475569",marginRight:5,fontSize:10}}>#{rank+1}</span>
                        {p.name}
                      </span>
                      <span style={{fontSize:11,fontWeight:700,color:isSel?"#fff":color}}>{p.predictionScore}</span>
                    </div>
                    {!isSel && (
                      <div style={{display:"flex",gap:8,fontSize:10,color:"#64748b"}}>
                        <span>ERA <b style={{color:"#94a3b8"}}>{p.era}</b></span>
                        <span>WHIP <b style={{color:"#94a3b8"}}>{p.whip}</b></span>
                        <span>K/9 <b style={{color:"#94a3b8"}}>{p.k9}</b></span>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>

          {/* Pitcher detail */}
          {selected && (
            <div>
              {/* Header */}
              <div style={{...s.card,marginBottom:12,borderLeft:"4px solid #a855f7",display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:12}}>
                <div style={{flex:1,minWidth:200}}>
                  <div style={{fontSize:18,fontWeight:800}}>{selected.name}</div>
                  <div style={{fontSize:12,color:"#64748b",marginTop:2}}>
                    {selected.dominantCycleDays ? `Dominant cycle: ${selected.dominantCycleDays} starts` : "Cycle: analyzing…"}
                    {" · "}FFT Score {selected.predictionScore}/99
                  </div>
                  <div style={{display:"flex",alignItems:"center",gap:10,marginTop:8}}>
                    <div style={{flex:1,maxWidth:200,height:8,background:"#0f172a",borderRadius:8,overflow:"hidden"}}>
                      <div style={{width:`${selected.predictionScore}%`,height:"100%",background:scoreColor(selected.predictionScore),borderRadius:8,transition:"width 0.4s"}}/>
                    </div>
                    <span style={{fontSize:13,fontWeight:700,color:scoreColor(selected.predictionScore)}}>{selected.predictionScore}</span>
                  </div>
                </div>
                <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                  {[["ERA",selected.era],["WHIP",selected.whip],["K/9",selected.k9]].map(([l,v])=>(
                    <div key={l} style={{background:"#0f172a",borderRadius:8,padding:"6px 12px",textAlign:"center",minWidth:52}}>
                      <div style={{fontSize:10,color:"#64748b"}}>{l}</div>
                      <div style={{fontSize:16,fontWeight:800}}>{v}</div>
                    </div>
                  ))}
                </div>
              </div>

              {/* View tabs */}
              <div style={{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap"}}>
                {[["trends","📈 ERA/WHIP"],["k9","🔥 K/9"],["forecast","🔮 Forecast"],["log","📋 Game Log"]].map(([v,label])=>(
                  <button key={v} onClick={()=>setPitcherView(v)} style={s.btn(pitcherView===v,"#7c3aed")}>{label}</button>
                ))}
              </div>

              {/* ERA / WHIP trend */}
              {pitcherView === "trends" && (() => {
                const chartData = selected.gamelogs.map(g => ({
                  date: g.game_date.slice(5),
                  era:  parseFloat(g.era)  || null,
                  whip: parseFloat(g.whip) || null,
                }));
                return (
                  <div style={{...s.card,padding:"20px 12px 12px"}}>
                    <div style={{fontSize:12,color:"#64748b",marginBottom:12}}>ERA & WHIP per start (last {selected.gamelogs.length} starts)</div>
                    <ResponsiveContainer width="100%" height={220}>
                      <ComposedChart data={chartData} margin={{left:-10,right:10}}>
                        <CartesianGrid strokeDasharray="3 3" stroke="#334155"/>
                        <XAxis dataKey="date" tick={{fontSize:9,fill:"#64748b"}} interval={Math.max(1,Math.floor(chartData.length/7))}/>
                        <YAxis yAxisId="era"  domain={['auto','auto']} tick={{fontSize:10,fill:"#64748b"}} label={{value:"ERA",angle:-90,position:"insideLeft",fontSize:10,fill:"#64748b"}}/>
                        <YAxis yAxisId="whip" orientation="right" domain={['auto','auto']} tick={{fontSize:10,fill:"#64748b"}} label={{value:"WHIP",angle:90,position:"insideRight",fontSize:10,fill:"#64748b"}}/>
                        <Tooltip formatter={(v,n)=>[v?.toFixed(2),n.toUpperCase()]}
                          contentStyle={{background:"#1e293b",border:"1px solid #334155",borderRadius:8,fontSize:12}}/>
                        <Legend wrapperStyle={{fontSize:11}}/>
                        <Line yAxisId="era"  type="monotone" dataKey="era"  stroke="#f87171" strokeWidth={2} dot={{r:3,fill:"#f87171"}} name="ERA"/>
                        <Line yAxisId="whip" type="monotone" dataKey="whip" stroke="#60a5fa" strokeWidth={2} dot={{r:3,fill:"#60a5fa"}} name="WHIP"/>
                      </ComposedChart>
                    </ResponsiveContainer>
                  </div>
                );
              })()}

              {/* K/9 trend */}
              {pitcherView === "k9" && (() => {
                const chartData = selected.gamelogs.map(g => ({
                  date: g.game_date.slice(5),
                  k9:   parseFloat(g.k_per_9) || null,
                  ip:   parseFloat(g.innings_pitched) || null,
                }));
                return (
                  <div style={{...s.card,padding:"20px 12px 12px"}}>
                    <div style={{fontSize:12,color:"#64748b",marginBottom:12}}>K/9 & Innings Pitched per start</div>
                    <ResponsiveContainer width="100%" height={220}>
                      <ComposedChart data={chartData} margin={{left:-10,right:10}}>
                        <defs>
                          <linearGradient id="k9Grad" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="5%"  stopColor="#a78bfa" stopOpacity={0.4}/>
                            <stop offset="95%" stopColor="#a78bfa" stopOpacity={0}/>
                          </linearGradient>
                        </defs>
                        <CartesianGrid strokeDasharray="3 3" stroke="#334155"/>
                        <XAxis dataKey="date" tick={{fontSize:9,fill:"#64748b"}} interval={Math.max(1,Math.floor(chartData.length/7))}/>
                        <YAxis yAxisId="k9" domain={['auto','auto']} tick={{fontSize:10,fill:"#64748b"}}/>
                        <YAxis yAxisId="ip" orientation="right" domain={[0,10]} tick={{fontSize:10,fill:"#64748b"}}/>
                        <Tooltip formatter={(v,n)=>[v?.toFixed(1),n]}
                          contentStyle={{background:"#1e293b",border:"1px solid #334155",borderRadius:8,fontSize:12}}/>
                        <Legend wrapperStyle={{fontSize:11}}/>
                        <Area yAxisId="k9" type="monotone" dataKey="k9" stroke="#a78bfa" strokeWidth={2} fill="url(#k9Grad)" name="K/9"/>
                        <Bar  yAxisId="ip" dataKey="ip" fill="#334155" opacity={0.5} name="IP" radius={[2,2,0,0]}/>
                      </ComposedChart>
                    </ResponsiveContainer>
                  </div>
                );
              })()}

              {/* FFT Forecast */}
              {pitcherView === "forecast" && (() => {
                const histData = selected.gamelogs.slice(-15).map(g => ({
                  date:  g.game_date.slice(5),
                  value: parseFloat(g[selected.fftMetric]) || null,
                  type:  "actual",
                }));
                const fcData = selected.forecast.map(f => ({
                  date:  f.date.slice(5),
                  value: f.value,
                  type:  "forecast",
                }));
                const combined = [
                  ...histData,
                  { date: histData[histData.length-1]?.date, value: histData[histData.length-1]?.value, type:"bridge" },
                  ...fcData,
                ];
                return (
                  <div style={{...s.card,padding:"20px 12px 12px"}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                      <div style={{fontSize:12,color:"#64748b"}}>
                        14-start FFT forecast · metric: <b style={{color:"#a78bfa"}}>{selected.fftMetric === 'game_score' ? 'Game Score' : 'ERA'}</b>
                        {selected.dominantCycleDays && <span> · dominant cycle: <b style={{color:"#a78bfa"}}>{selected.dominantCycleDays} starts</b></span>}
                      </div>
                    </div>
                    <ResponsiveContainer width="100%" height={220}>
                      <ComposedChart margin={{left:-10,right:10}}>
                        <defs>
                          <linearGradient id="fcGrad" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="5%"  stopColor="#34d399" stopOpacity={0.3}/>
                            <stop offset="95%" stopColor="#34d399" stopOpacity={0}/>
                          </linearGradient>
                        </defs>
                        <CartesianGrid strokeDasharray="3 3" stroke="#334155"/>
                        <XAxis dataKey="date" data={combined} tick={{fontSize:9,fill:"#64748b"}} interval={Math.max(1,Math.floor(combined.length/7))}/>
                        <YAxis tick={{fontSize:10,fill:"#64748b"}}/>
                        <Tooltip formatter={(v)=>[v?.toFixed(1)]} contentStyle={{background:"#1e293b",border:"1px solid #334155",borderRadius:8,fontSize:12}}/>
                        <ReferenceLine x={histData[histData.length-1]?.date} stroke="#94a3b8" strokeDasharray="3 3"
                          label={{value:"NOW",fontSize:9,fill:"#94a3b8",position:"insideTopRight"}}/>
                        <Line data={histData} type="monotone" dataKey="value" stroke="#a78bfa" strokeWidth={2} dot={{r:3}} name="Actual" connectNulls/>
                        <Area data={fcData}   type="monotone" dataKey="value" stroke="#34d399" strokeWidth={2} strokeDasharray="5 3" fill="url(#fcGrad)" name="Forecast" dot={false} connectNulls/>
                      </ComposedChart>
                    </ResponsiveContainer>
                    <div style={{display:"flex",gap:16,justifyContent:"center",marginTop:10}}>
                      {[["#a78bfa","Actual"],["#34d399","14-start forecast (FFT cycle)"]].map(([c,l])=>(
                        <div key={l} style={{display:"flex",alignItems:"center",gap:5,fontSize:11}}>
                          <div style={{width:24,height:2,background:c}}/><span style={{color:"#94a3b8"}}>{l}</span>
                        </div>
                      ))}
                    </div>
                    <div style={{marginTop:12,padding:"8px 10px",background:"#0f172a",borderRadius:6,fontSize:10,color:"#475569",lineHeight:1.5}}>
                      FFT on {selected.gamelogs.length}-start {selected.fftMetric === 'game_score' ? 'game score' : 'ERA'} signal. Dominant cycle: {selected.dominantCycleDays ?? '?'} starts. Forecast extrapolates this cycle 14 starts forward.
                    </div>
                  </div>
                );
              })()}

              {/* Game Log */}
              {pitcherView === "log" && (
                <div style={{...s.card,padding:"16px 12px"}}>
                  <div style={{fontSize:12,color:"#64748b",marginBottom:12}}>Recent starts (newest first)</div>
                  <div style={{overflowX:"auto"}}>
                    <table style={{width:"100%",fontSize:11,borderCollapse:"collapse"}}>
                      <thead>
                        <tr style={{color:"#64748b"}}>
                          {["Date","IP","ERA","WHIP","K/9","Game Score"].map(h=>(
                            <td key={h} style={{padding:"4px 8px",borderBottom:"1px solid #334155",textAlign:h==="Date"?"left":"center"}}>{h}</td>
                          ))}
                        </tr>
                      </thead>
                      <tbody>
                        {[...selected.gamelogs].reverse().map((g, i) => {
                          const gs = parseFloat(g.game_score);
                          const gsColor = gs >= 60 ? "#22c55e" : gs >= 45 ? "#f59e0b" : "#ef4444";
                          return (
                            <tr key={i} style={{borderBottom:"1px solid #1e293b"}}>
                              <td style={{padding:"5px 8px",color:"#94a3b8"}}>{g.game_date}</td>
                              <td style={{padding:"5px 8px",textAlign:"center"}}>{g.innings_pitched ?? '—'}</td>
                              <td style={{padding:"5px 8px",textAlign:"center",color: parseFloat(g.era)<3.50?"#22c55e":parseFloat(g.era)>5?"#ef4444":"#f1f5f9",fontWeight:700}}>{g.era ?? '—'}</td>
                              <td style={{padding:"5px 8px",textAlign:"center",color: parseFloat(g.whip)<1.10?"#22c55e":parseFloat(g.whip)>1.50?"#ef4444":"#f1f5f9"}}>{g.whip ?? '—'}</td>
                              <td style={{padding:"5px 8px",textAlign:"center",color: parseFloat(g.k_per_9)>=10?"#a78bfa":"#f1f5f9",fontWeight:parseFloat(g.k_per_9)>=10?700:400}}>{g.k_per_9 ?? '—'}</td>
                              <td style={{padding:"5px 8px",textAlign:"center",fontWeight:700,color:isNaN(gs)?"#64748b":gsColor}}>{isNaN(gs)?'—':Math.round(gs)}</td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* AI Scout */}
              <div style={{...s.card,marginTop:12}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                  <div style={{fontWeight:700,fontSize:13}}>🤖 AI Scouting Insight</div>
                  <button onClick={()=>handleInsight(selected)} disabled={insightLoading[selected.name]}
                    style={{padding:"7px 14px",borderRadius:8,border:"none",cursor:"pointer",fontWeight:700,fontSize:12,
                      background:insightLoading[selected.name]?"#334155":"#7c3aed",
                      color:"#fff",opacity:insightLoading[selected.name]?0.6:1}}>
                    {insightLoading[selected.name] ? "Analyzing…" : `Analyze ${selected.name.split(" ").pop()}`}
                  </button>
                </div>
                {insight[selected.name]
                  ? <p style={{fontSize:13,color:"#cbd5e1",lineHeight:1.7,margin:0}}>{insight[selected.name]}</p>
                  : <p style={{fontSize:13,color:"#475569",fontStyle:"italic",margin:0}}>Click Analyze for a Claude-powered pitching report incorporating cycle analysis.</p>
                }
              </div>
            </div>
          )}
        </div>
      );
    }

    // ── App ───────────────────────────────────────────────────────────────────
    function App(){
      const [sbUrl,setSbUrl]           = useState(()=>getCredential("sb-url","sbUrl"));
      const [sbKey,setSbKey]           = useState(()=>getCredential("sb-key","sbKey"));
      const [dataSource,setDataSource] = useState("demo");
      const [mainTab,setMainTab]       = useState("hitters");  // "hitters" | "pitchers"
      const [roster,setRoster]         = useState([]);
      const [rosterLoading,setRosterLoading] = useState(false);
      const [rosterError,setRosterError]     = useState("");
      const [sortBy,setSortBy]         = useState("name");
      const [teamFilter,setTeamFilter] = useState(()=>{ const t=readMeta("default-team"); return t||"ALL"; });
      const [search,setSearch]         = useState("");
      const [selectedPlayer,setSelectedPlayer] = useState(null);
      const [gameData,setGameData]     = useState([]);
      const [seasonStats,setSeasonStats] = useState(null);
      const [dataLoading,setDataLoading] = useState(false);
      const [dataError,setDataError]   = useState("");
      const [view,setView]             = useState("timeline");
      const [aiInsight,setAiInsight]   = useState("");
      const [aiLoading,setAiLoading]   = useState(false);
      const [mlbQuery,setMlbQuery]     = useState("");
      const [mlbSearching,setMlbSearching] = useState(false);
      const [mlbError,setMlbError]     = useState("");
      const [predCache,setPredCache]   = useState({});
      const [currentPred,setCurrentPred] = useState(null);
      const [cycleAnalysis,setCycleAnalysis] = useState(null);
      const mlbRef = useRef(null);

      const loadRoster = useCallback(async()=>{
        if(dataSource==="demo"){
          setRoster(DEMO_PLAYERS); setSelectedPlayer(DEMO_PLAYERS.find(p=>teamFilter&&teamFilter!=='ALL'&&p.team===teamFilter)||DEMO_PLAYERS[0]); setRosterError(""); return;
        }
        if(dataSource==="mlb"){
          setRoster(Object.keys(MLB_IDS).map(name=>({player_name:name,team:"MLB"}))); setSelectedPlayer(null); setRosterError(""); return;
        }
        if(!sbUrl||!sbKey){
          setRoster([]); setSelectedPlayer(null);
          setRosterError("Enter your Supabase URL and API key above, then click Connect.");
          return;
        }
        setRosterLoading(true); setRosterError("");
        try{
          const players = await fetchRoster(sbUrl,sbKey);
          if(!players.length) throw new Error("No players returned — check table name and RLS policies.");
          setRoster(players); setSelectedPlayer(players.find(p=>teamFilter&&teamFilter!=='ALL'&&p.team===teamFilter)||players[0]);
        }catch(e){ setRosterError(e.message); setRoster([]); setSelectedPlayer(null); }
        setRosterLoading(false);
      },[dataSource,sbUrl,sbKey]);

      const loadGames = useCallback(async()=>{
        if(!selectedPlayer) return;
        setDataLoading(true); setDataError(""); setAiInsight(""); setSeasonStats(null); setCurrentPred(null); setCycleAnalysis(null);
        try{
          let games=[], ss=null, teamName=selectedPlayer.team;
          if(dataSource==="mlb"){
            const pid = selectedPlayer.mlbId||MLB_IDS[selectedPlayer.player_name];
            if(!pid){ setDataError("No MLB ID."); setDataLoading(false); return; }
            const[splits,ssRaw,info] = await Promise.all([mlbFetchGameLog(pid),mlbFetchSeasonStats(pid),mlbFetchInfo(pid)]);
            teamName = info.currentTeam?.name||selectedPlayer.team||"";
            const transformed = transformMLBSplits(splits);
            if(transformed.length===0){ setDataError(`No ${SEASON} game log — showing demo.`); games=genDemo(selectedPlayer.player_name,1.5); }
            else games=transformed;
            ss={avg:ssRaw.avg||".---",ops:ssRaw.ops||".---",hr:ssRaw.homeRuns||0,rbi:ssRaw.rbi||0,hits:ssRaw.hits||0,ab:ssRaw.atBats||0,games:ssRaw.gamesPlayed||0,team:teamName,pos:info.primaryPosition?.abbreviation||""};
            setSeasonStats(ss);
          }else if(dataSource==="live"&&sbUrl&&sbKey){
            const rows = await fetchPlayerGames(sbUrl,sbKey,selectedPlayer.player_name);
            games = rows.length?transformRows(rows):genDemo(selectedPlayer.player_name,1.5);
            if(!rows.length) setDataError("No rows found — showing demo.");
          }else{
            const idx = DEMO_PLAYERS.findIndex(p=>p.player_name===selectedPlayer.player_name);
            await new Promise(r=>setTimeout(r,300));
            games = genDemo(selectedPlayer.player_name, idx>=0?idx*1.3+1:1.5);
            ss = {avg:".271",ops:".792",hr:12,rbi:38,hits:44,ab:162,games:45,team:"MLB",pos:"OF"};
            setSeasonStats(ss);
          }
          setGameData(games);
          const analysis = analyzePlayerCycles(games);
          setCycleAnalysis(analysis);
          const pred = computePredictionScore(selectedPlayer.player_name, teamName||selectedPlayer.team, games, ss);
          setCurrentPred(pred);
          setPredCache(prev=>({...prev,[selectedPlayer.player_name]:pred}));
        }catch(e){
          setDataError(e.message);
          setGameData(genDemo(selectedPlayer.player_name,1.5));
        }
        setDataLoading(false);
      },[selectedPlayer,dataSource,sbUrl,sbKey]);

      useEffect(()=>{
        if(dataSource!=="demo") return;
        const cache={};
        DEMO_PLAYERS.forEach((p,idx)=>{
          const g = genDemo(p.player_name, idx*1.3+1);
          const ss = {avg:".271",ops:".792",hr:12,rbi:38,hits:44,ab:162,games:45,team:p.team,pos:"OF"};
          cache[p.player_name] = computePredictionScore(p.player_name, p.team, g, ss);
        });
        setPredCache(cache);
      },[dataSource]);

      useEffect(()=>{ loadRoster(); },[loadRoster]);
      useEffect(()=>{ loadGames(); },[loadGames]);

      const doMlbSearch = async()=>{
        if(!mlbQuery.trim()) return;
        setMlbSearching(true); setMlbError("");
        try{
          const person = await mlbSearchPlayer(mlbQuery.trim());
          if(!person){ setMlbError("Player not found — try full name"); setMlbSearching(false); return; }
          const p = {player_name:person.fullName||mlbQuery, team:"MLB", mlbId:person.id};
          setRoster(prev=>prev.find(x=>x.player_name===p.player_name)?prev:[p,...prev]);
          setSelectedPlayer(p); setMlbQuery("");
        }catch(e){ setMlbError(e.message); }
        setMlbSearching(false);
      };

      const saveCredentials = ()=>{
        localStorage.setItem("sbUrl",sbUrl);
        localStorage.setItem("sbKey",sbKey);
        setRosterLoading(true); setRosterError("");
        fetchRoster(sbUrl,sbKey)
          .then(players=>{
            if(!players.length) throw new Error("No players returned — check table name and RLS policies.");
            setRoster(players); setSelectedPlayer(players.find(p=>teamFilter&&teamFilter!=='ALL'&&p.team===teamFilter)||players[0]);
          })
          .catch(e=>{ setRosterError(e.message); setRoster([]); setSelectedPlayer(null); })
          .finally(()=>setRosterLoading(false));
      };

      const currentCycleDay = gameData.length?gameData[gameData.length-1].cycleDay:0;
      const currentPhase = getPhase(currentCycleDay);

      const teams = ["ALL",...Array.from(new Set(roster.map(p=>p.team))).sort()];
      const filteredRoster = roster
        .filter(p=>(teamFilter==="ALL"||p.team===teamFilter)&&p.player_name.toLowerCase().includes(search.toLowerCase()))
        .sort((a,b)=>{
          if(sortBy==="prediction"){
            return (predCache[b.player_name]?.score||50)-(predCache[a.player_name]?.score||50);
          }
          return a.player_name.localeCompare(b.player_name);
        });

      const grouped = sortBy==="prediction"
        ? {"rankings":filteredRoster}
        : filteredRoster.reduce((acc,p)=>{ (acc[p.team]=acc[p.team]||[]).push(p); return acc; },{});

      const fetchInsight = async()=>{
        setAiLoading(true);
        const last10=gameData.slice(-10), l10H=last10.reduce((a,g)=>a+g.hits,0), l10AB=last10.reduce((a,g)=>a+g.ab,0), l10HR=last10.reduce((a,g)=>a+g.hr,0);
        const last5=gameData.slice(-5), l5H=last5.reduce((a,g)=>a+g.hits,0), l5AB=last5.reduce((a,g)=>a+g.ab,0);
        const ssLine=seasonStats?`Season ${SEASON}: AVG ${seasonStats.avg}, OPS ${seasonStats.ops}, HR ${seasonStats.hr}, RBI ${seasonStats.rbi}, G ${seasonStats.games}`:`${gameData.length} games sampled`;
        let cycleSection;
        if(cycleAnalysis && cycleAnalysis.dominantCycles.length > 0){
          const cycles = cycleAnalysis.dominantCycles.map((c,i)=>`  Cycle ${i+1}: ${c.periodDays}-day period, ${c.pctVariance}% of variance, amplitude ${c.amplitude.toFixed(3)}`).join("\n");
          const fv = cycleAnalysis.forecastValues.slice(0,7);
          const fSlope = fv[fv.length-1] - fv[0];
          const fDir = fSlope > 0.015 ? "strongly rising" : fSlope > 0.005 ? "rising" : fSlope < -0.015 ? "strongly falling" : fSlope < -0.005 ? "falling" : "flat";
          const fAvg = (fv.reduce((a,b)=>a+b,0)/fv.length + cycleAnalysis.mean).toFixed(3);
          cycleSection=`Detected performance cycles (DFT analysis, R²=${cycleAnalysis.r2.toFixed(2)}):\n${cycles}\nForecast next 7 games: trend is ${fDir}, projected avg ~${fAvg}`;
        } else {
          const ps=PHASE_CONFIG.map(p=>`  ${p.name}: AVG ${phaseAvg(gameData,p.name,"avg")}, OPS ${phaseAvg(gameData,p.name,"ops")}`).join("\n");
          cycleSection=`Fixed 28-day cycle phase averages (insufficient data for DFT):\n${ps}\nCurrent: ${currentPhase?.name} phase, day ${currentCycleDay+1}/${CYCLE_LENGTH}`;
        }
        const predLine=currentPred?`\nPerformance prediction score: ${currentPred.score}/99 (${currentPred.tier}) — ${currentPred.label}`:"";
        const prompt=`You are a baseball analytics AI specializing in time-series performance cycle analysis.

Player: ${selectedPlayer?.player_name} (${seasonStats?.team||selectedPlayer?.team||""})
${ssLine}
Last 10 games: ${l10H}H / ${l10AB}AB (.${l10AB>0?Math.round(l10H/l10AB*1000).toString().padStart(3,"0"):"000"}), ${l10HR} HR
Last 5 games:  ${l5H}H / ${l5AB}AB (.${l5AB>0?Math.round(l5H/l5AB*1000).toString().padStart(3,"0"):"000"})
${predLine}

${cycleSection}

Based specifically on the detected cycle periods and forecast direction above — not generic baseball intuition — provide 3-4 sentences covering: what the dominant cycle(s) tell us about this player's rhythm, where they are in that cycle right now, a concrete fantasy/lineup recommendation for the next 3-5 days, and one bold prediction grounded in the cycle data.`;

        try{
          const res=await fetch("/api/scout",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt})});
          if(!res.ok){ const e=await res.text(); throw new Error(`API ${res.status}: ${e}`); }
          const d=await res.json();
          setAiInsight(d.text||"No insight returned.");
        }catch(e){ setAiInsight("Error: "+e.message); }
        setAiLoading(false);
      };

      const s = {
        card:{background:"#1e293b",borderRadius:12,padding:16},
        input:{background:"#0f172a",border:"1px solid #334155",borderRadius:6,padding:"7px 10px",color:"#f1f5f9",fontSize:12,width:"100%",boxSizing:"border-box"},
        btn:(active,color="#3b82f6")=>({padding:"7px 14px",borderRadius:8,border:"none",cursor:"pointer",fontWeight:700,fontSize:12,background:active?color:"#334155",color:active?"#fff":"#94a3b8"}),
      };

      return(
        <div style={{background:"#0f172a",minHeight:"100vh",color:"#f1f5f9",fontFamily:"Inter,sans-serif",padding:"20px 16px"}}>
          <div style={{maxWidth:980,margin:"0 auto"}}>

            <div style={{marginBottom:20}}>
              <h1 style={{fontSize:22,fontWeight:800}}>⚾ MLB Cycle Analyzer</h1>
              <p style={{color:"#64748b",fontSize:13,marginTop:4}}>28-day performance cycle · Season {SEASON} · MIN_AT_BATS: {MIN_AT_BATS} · {roster.length} players</p>
            </div>

            {/* Source bar */}
            <div style={{...s.card,marginBottom:20}}>
              <div style={{display:"flex",gap:8,marginBottom:12,flexWrap:"wrap"}}>
                {[["demo","🎭 Demo"],["mlb","⚾ MLB API"],["live","🔴 Supabase"]].map(([m,label])=>(
                  <button key={m} onClick={()=>setDataSource(m)} style={s.btn(dataSource===m,m==="live"?"#22c55e":m==="mlb"?"#f59e0b":"#3b82f6")}>{label}</button>
                ))}
                {rosterLoading&&<span style={{fontSize:12,color:"#64748b",alignSelf:"center"}}>Loading...</span>}
                {dataSource==="live"&&!rosterLoading&&roster.length>0&&!rosterError&&<span style={{fontSize:12,color:"#22c55e",alignSelf:"center"}}>✓ {roster.length} players</span>}
              </div>
              {dataSource==="mlb"&&(
                <div style={{display:"flex",gap:8}}>
                  <input ref={mlbRef} value={mlbQuery} onChange={e=>setMlbQuery(e.target.value)} onKeyDown={e=>e.key==="Enter"&&doMlbSearch()} placeholder="Search any MLB player…" style={{...s.input,flex:1}}/>
                  <button onClick={doMlbSearch} disabled={mlbSearching} style={{...s.btn(true,"#f59e0b"),whiteSpace:"nowrap",opacity:mlbSearching?0.6:1}}>{mlbSearching?"Searching…":"Search ↗"}</button>
                </div>
              )}
              {mlbError&&<div style={{fontSize:12,color:"#fca5a5",marginTop:4}}>{mlbError}</div>}
              {dataSource==="live"&&(
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr auto",gap:8,marginTop:8}}>
                  <div><div style={{fontSize:11,color:"#64748b",marginBottom:4}}>Supabase URL</div><input value={sbUrl} onChange={e=>setSbUrl(e.target.value)} placeholder="https://xxxx.supabase.co" style={s.input}/></div>
                  <div><div style={{fontSize:11,color:"#64748b",marginBottom:4}}>Anon Key</div><input type="password" value={sbKey} onChange={e=>setSbKey(e.target.value)} placeholder="eyJhbGci…" style={s.input}/></div>
                  <div style={{alignSelf:"flex-end"}}><button onClick={saveCredentials} style={{...s.btn(true,"#22c55e"),padding:"8px 16px"}}>Connect</button></div>
                </div>
              )}
              {(rosterError||dataError)&&<div style={{marginTop:10,padding:"8px 12px",background:"#450a0a",borderRadius:6,fontSize:12,color:"#fca5a5"}}>⚠️ {rosterError||dataError}</div>}
            </div>

            {/* ── Main tab bar: Hitters / Pitchers ── */}
            <div style={{display:"flex",gap:4,marginBottom:16,borderBottom:"1px solid #334155",paddingBottom:0}}>
              {[["hitters","🏏 Hitters"],["pitchers","⚾ Pitchers"]].map(([tab,label])=>(
                <button key={tab} onClick={()=>setMainTab(tab)}
                  style={{padding:"9px 20px",borderRadius:"8px 8px 0 0",border:"none",cursor:"pointer",fontWeight:700,fontSize:13,
                    background:mainTab===tab?"#1e293b":"transparent",
                    color:mainTab===tab?"#f1f5f9":"#64748b",
                    borderBottom:mainTab===tab?"2px solid #3b82f6":"2px solid transparent",
                    marginBottom:"-1px"}}>
                  {label}
                </button>
              ))}
            </div>

            {/* ── PITCHERS TAB ── */}
            {mainTab === "pitchers" && (
              <PitchersTab
                dataSource={dataSource}
                sbUrl={sbUrl}
                sbKey={sbKey}
                teamFilter={teamFilter}
              />
            )}

            {/* ── HITTERS TAB ── */}
            {mainTab === "hitters" && (
            <div style={{display:"grid",gridTemplateColumns:"280px 1fr",gap:16,alignItems:"start"}}>

              {/* Sidebar */}
              <div style={{...s.card,padding:12}}>
                <div style={{fontSize:12,fontWeight:700,color:"#94a3b8",marginBottom:10}}>PLAYERS</div>
                <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Search…" style={{...s.input,marginBottom:8}}/>
                <div style={{display:"flex",gap:6,marginBottom:8}}>
                  <button onClick={()=>setSortBy("name")} style={{...s.btn(sortBy==="name"),flex:1,padding:"5px 8px",fontSize:11}}>A–Z</button>
                  <button onClick={()=>setSortBy("prediction")} style={{...s.btn(sortBy==="prediction","#f59e0b"),flex:1,padding:"5px 8px",fontSize:11}}>🔮 Predicted</button>
                </div>
                {dataSource!=="mlb"&&sortBy==="name"&&(
                  <select value={teamFilter} onChange={e=>setTeamFilter(e.target.value)} style={{...s.input,marginBottom:8,cursor:"pointer"}}>
                    {teams.map(t=><option key={t} value={t}>{t==="ALL"?"All Teams":t}</option>)}
                  </select>
                )}
                <div style={{maxHeight:520,overflowY:"auto",fontSize:12}}>
                  {Object.keys(grouped).sort().map(groupKey=>(
                    <div key={groupKey}>
                      {sortBy==="prediction"&&(
                        <div style={{fontSize:10,fontWeight:800,color:"#f59e0b",textTransform:"uppercase",letterSpacing:1,padding:"4px 6px",marginBottom:4}}>🔮 3–5 Day Rankings</div>
                      )}
                      {sortBy==="name"&&dataSource!=="mlb"&&(
                        <div style={{fontSize:10,fontWeight:800,color:"#475569",textTransform:"uppercase",letterSpacing:1,padding:"4px 6px",marginBottom:2}}>{groupKey}</div>
                      )}
                      {grouped[groupKey].map((p,rank)=>{
                        const pred = predCache[p.player_name];
                        const isSel = selectedPlayer?.player_name===p.player_name;
                        return(
                          <div key={p.player_name} onClick={()=>setSelectedPlayer(p)}
                            style={{padding:"8px 10px",borderRadius:6,cursor:"pointer",marginBottom:3,
                              background:isSel?"#3b82f6":"transparent"}}>
                            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:pred?3:0}}>
                              <span style={{color:isSel?"#fff":"#cbd5e1",fontWeight:isSel?700:400,fontSize:12}}>
                                {sortBy==="prediction"&&<span style={{color:isSel?"rgba(255,255,255,0.6)":"#475569",marginRight:5,fontSize:10}}>#{rank+1}</span>}
                                {p.player_name}
                              </span>
                              {pred&&<span style={{fontSize:11,fontWeight:700,color:isSel?"#fff":TIER_COLOR[pred.tier]}}>{pred.score}</span>}
                            </div>
                            {pred&&!isSel&&<ScoreBar score={pred.score} tier={pred.tier}/>}
                          </div>
                        );
                      })}
                    </div>
                  ))}
                  {Object.keys(grouped).length===0&&(
                    <div style={{color:"#475569",fontStyle:"italic",padding:8}}>{dataSource==="mlb"?"Search a player above.":"No players match."}</div>
                  )}
                </div>
              </div>

              {/* Main panel */}
              <div>
                {!selectedPlayer?(
                  <div style={{...s.card,textAlign:"center",padding:60,color:"#64748b"}}>{dataSource==="mlb"?"Search a player above.":"Select a player to begin."}</div>
                ):dataLoading?(
                  <div style={{...s.card,textAlign:"center",padding:60,color:"#64748b"}}>Loading game data…</div>
                ):(
                  <>
                    {/* Header */}
                    <div style={{...s.card,marginBottom:12,borderLeft:`4px solid ${currentPhase?.color}`,display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:12}}>
                      <div style={{flex:1,minWidth:200}}>
                        <div style={{fontSize:18,fontWeight:800}}>{selectedPlayer.player_name}</div>
                        <div style={{fontSize:12,color:"#64748b"}}>{seasonStats?.team||selectedPlayer.team}{seasonStats?.pos?` · ${seasonStats.pos}`:""} · {SEASON}</div>
                        <div style={{fontSize:13,color:currentPhase?.color,fontWeight:700,marginTop:4}}>
                          {cycleAnalysis
                            ? `Detected cycles: ${cycleAnalysis.dominantCycles.slice(0,2).map(c=>c.periodDays+"d").join(", ")} · R²: ${cycleAnalysis.r2.toFixed(2)}`
                            : `${currentPhase?.name} Phase · Day ${currentCycleDay+1}/${CYCLE_LENGTH}`}
                        </div>
                        {currentPred&&(
                          <div style={{display:"flex",alignItems:"center",gap:10,marginTop:8}}>
                            <ScoreBar score={currentPred.score} tier={currentPred.tier} size="lg"/>
                            <span style={{fontSize:11,color:"#64748b",whiteSpace:"nowrap"}}>3–5 day outlook</span>
                          </div>
                        )}
                      </div>
                      {seasonStats&&(
                        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                          {[["AVG",seasonStats.avg],["OPS",seasonStats.ops],["HR",seasonStats.hr],["RBI",seasonStats.rbi],["G",seasonStats.games]].map(([l,v])=>(
                            <div key={l} style={{background:"#0f172a",borderRadius:8,padding:"6px 12px",textAlign:"center",minWidth:48}}>
                              <div style={{fontSize:10,color:"#64748b"}}>{l}</div>
                              <div style={{fontSize:16,fontWeight:800}}>{v}</div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>

                    {/* Tabs */}
                    <div style={{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap"}}>
                      {[["timeline","📈 Timeline"],["cycle","🔄 Cycle"],["phases","📊 Phases"],["streak","🔥 Streak"],["predict","🔮 Predict"]].map(([v,label])=>(
                        <button key={v} onClick={()=>setView(v)} style={s.btn(view===v)}>{label}</button>
                      ))}
                    </div>

                    {/* Timeline */}
                    {view==="timeline"&&(
                      <div style={{...s.card,padding:"20px 12px 12px"}}>
                        <ResponsiveContainer width="100%" height={220}>
                          <AreaChart data={gameData.slice(-60)} margin={{left:-10,right:10}}>
                            <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="5%" stopColor="#3b82f6" stopOpacity={0.3}/><stop offset="95%" stopColor="#3b82f6" stopOpacity={0}/></linearGradient></defs>
                            <CartesianGrid strokeDasharray="3 3" stroke="#334155"/>
                            <XAxis dataKey="date" tick={{fontSize:10,fill:"#64748b"}} interval={Math.max(1,Math.floor(gameData.length/8))}/>
                            <YAxis domain={[0.100,0.500]} tick={{fontSize:10,fill:"#64748b"}}/>
                            <Tooltip content={<CustomTooltip/>}/>
                            <ReferenceLine y={0.260} stroke="#64748b" strokeDasharray="4 4" label={{value:".260",fontSize:9,fill:"#64748b"}}/>
                            <Area type="monotone" dataKey="avg" stroke="#3b82f6" strokeWidth={2} fill="url(#ag)"
                              dot={({cx,cy,payload})=><circle key={payload.date+payload.cycleDay} cx={cx} cy={cy} r={3} fill={payload.phaseColor} stroke="none"/>}/>
                          </AreaChart>
                        </ResponsiveContainer>
                        <div style={{display:"flex",gap:12,justifyContent:"center",marginTop:10,flexWrap:"wrap"}}>
                          {PHASE_CONFIG.map(p=>(
                            <div key={p.name} style={{display:"flex",alignItems:"center",gap:5,fontSize:11}}>
                              <div style={{width:8,height:8,borderRadius:"50%",background:p.color}}/><span style={{color:"#94a3b8"}}>{p.name}</span>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}

                    {/* Cycle */}
                    {view==="cycle"&&(()=>{
                      const merged = buildCycleChartData(gameData, cycleAnalysis);
                      const yVals = merged.map(p=>p.actual||p.fitted||p.forecast).filter(Boolean);
                      const yMin  = Math.max(0.050, +(Math.min(...yVals)-0.030).toFixed(3));
                      const yMax  = Math.min(0.600, +(Math.max(...yVals)+0.030).toFixed(3));
                      return(
                      <div style={{...s.card,padding:"20px 12px 12px"}}>
                        {!cycleAnalysis ? (
                          <div style={{color:"#64748b",fontSize:12,padding:20,textAlign:"center"}}>Not enough data for cycle analysis — need at least 10 games.</div>
                        ) : (
                          <>
                            <div style={{display:"flex",gap:8,marginBottom:12,flexWrap:"wrap",alignItems:"center"}}>
                              <span style={{fontSize:11,color:"#64748b",marginRight:4}}>Detected cycles:</span>
                              {cycleAnalysis.dominantCycles.map((c,i)=>(
                                <span key={i} style={{fontSize:11,fontWeight:700,padding:"2px 10px",borderRadius:10,
                                  background:["#22c55e22","#3b82f622","#f59e0b22","#ef444422","#a855f722"][i]||"#33415522",
                                  color:["#22c55e","#3b82f6","#f59e0b","#ef4444","#a855f7"][i]||"#64748b"}}>
                                  {c.periodDays}d <span style={{fontWeight:400,opacity:0.7}}>({c.pctVariance}%)</span>
                                </span>
                              ))}
                              <span style={{fontSize:11,color:"#475569",marginLeft:"auto"}}>R² {cycleAnalysis.r2.toFixed(2)}</span>
                            </div>
                            <ResponsiveContainer width="100%" height={220}>
                              <AreaChart data={merged} margin={{left:-10,right:10}}>
                                <defs>
                                  <linearGradient id="actualGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="5%" stopColor="#3b82f6" stopOpacity={0.15}/><stop offset="95%" stopColor="#3b82f6" stopOpacity={0}/></linearGradient>
                                  <linearGradient id="fitGrad"    x1="0" y1="0" x2="0" y2="1"><stop offset="5%" stopColor="#22c55e" stopOpacity={0.20}/><stop offset="95%" stopColor="#22c55e" stopOpacity={0}/></linearGradient>
                                  <linearGradient id="fcastGrad"  x1="0" y1="0" x2="0" y2="1"><stop offset="5%" stopColor="#f59e0b" stopOpacity={0.30}/><stop offset="95%" stopColor="#f59e0b" stopOpacity={0}/></linearGradient>
                                </defs>
                                <CartesianGrid strokeDasharray="3 3" stroke="#334155"/>
                                <XAxis dataKey="date" tick={{fontSize:9,fill:"#64748b"}} interval={Math.max(1,Math.floor(merged.length/9))}/>
                                <YAxis domain={[yMin,yMax]} tick={{fontSize:10,fill:"#64748b"}}/>
                                <Tooltip content={({active,payload,label})=>{
                                  if(!active||!payload?.length) return null;
                                  const isFc = payload[0]?.payload?.isForecast;
                                  const vals = payload.filter(p=>p.value!=null);
                                  return(
                                    <div style={{background:"#1e293b",border:`1px solid ${isFc?"#f59e0b":"#334155"}`,borderRadius:8,padding:"8px 12px",fontSize:12}}>
                                      <div style={{color:"#94a3b8",marginBottom:3}}>{label}{isFc?" (forecast)":""}</div>
                                      {vals.map(p=>(
                                        <div key={p.dataKey} style={{color:p.color}}>
                                          {p.dataKey==="actual"?"Actual":p.dataKey==="fitted"?"FFT fit":"Forecast"}: <b>{(+p.value).toFixed(3)}</b>
                                        </div>
                                      ))}
                                    </div>
                                  );
                                }}/>
                                <ReferenceLine x={gameData[gameData.length-1]?.date} stroke="#94a3b8" strokeDasharray="3 3" label={{value:"NOW",fontSize:9,fill:"#94a3b8",position:"insideTopRight"}}/>
                                <Area type="monotone" dataKey="actual"   connectNulls={false} stroke="#3b82f6" strokeWidth={1.5} fill="url(#actualGrad)" dot={({cx,cy,payload})=>payload.actual!=null?<circle key={cx} cx={cx} cy={cy} r={2} fill="#3b82f6" stroke="none"/>:<g key={cx}/>}/>
                                <Area type="monotone" dataKey="fitted"   connectNulls={false} stroke="#22c55e" strokeWidth={2}   fill="url(#fitGrad)"    dot={false}/>
                                <Area type="monotone" dataKey="forecast" connectNulls={false} stroke="#f59e0b" strokeWidth={2}   strokeDasharray="5 3" fill="url(#fcastGrad)" dot={false}/>
                              </AreaChart>
                            </ResponsiveContainer>
                            <div style={{display:"flex",gap:16,justifyContent:"center",marginTop:10,flexWrap:"wrap"}}>
                              {[["#3b82f6","Actual avg"],["#22c55e","FFT reconstruction"],["#f59e0b","14-day forecast"]].map(([c,l])=>(
                                <div key={l} style={{display:"flex",alignItems:"center",gap:5,fontSize:11}}>
                                  <div style={{width:24,height:2,background:c,borderRadius:1}}/><span style={{color:"#94a3b8"}}>{l}</span>
                                </div>
                              ))}
                            </div>
                            <div style={{display:"grid",gridTemplateColumns:`repeat(${Math.min(cycleAnalysis.dominantCycles.length,3)},1fr)`,gap:8,marginTop:14}}>
                              {cycleAnalysis.dominantCycles.slice(0,3).map((c,i)=>{
                                const colors=["#22c55e","#3b82f6","#f59e0b","#ef4444","#a855f7"];
                                return(
                                  <div key={i} style={{background:"#0f172a",borderRadius:8,padding:"10px 12px",borderTop:`2px solid ${colors[i]}`}}>
                                    <div style={{fontSize:10,color:"#64748b",marginBottom:2}}>Cycle {i+1}</div>
                                    <div style={{fontSize:18,fontWeight:800,color:colors[i]}}>{c.periodDays}d</div>
                                    <div style={{fontSize:10,color:"#64748b",marginTop:2}}>{c.pctVariance}% variance · amp {c.amplitude.toFixed(3)}</div>
                                  </div>
                                );
                              })}
                            </div>
                            <div style={{marginTop:10,padding:"8px 10px",background:"#0f172a",borderRadius:6,fontSize:10,color:"#475569",lineHeight:1.5}}>
                              DFT on {gameData.length}-game batting avg signal. Top {cycleAnalysis.dominantCycles.length} frequency component{cycleAnalysis.dominantCycles.length!==1?"s":""} kept (amplitude ≥ 0.005, period ≥ 4 games). Forecast extrapolates these cycles {FORECAST_DAYS} games forward.
                            </div>
                          </>
                        )}
                      </div>
                      );
                    })()}

                    {/* Phases */}
                    {view==="phases"&&(
                      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                        {PHASE_CONFIG.map(p=>{
                          const pg=gameData.filter(g=>g.phase===p.name), isActive=p.name===currentPhase?.name;
                          return(
                            <div key={p.name} style={{...s.card,borderTop:`3px solid ${p.color}`,outline:isActive?`1px solid ${p.color}`:undefined}}>
                              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                                <div style={{fontWeight:700,color:p.color,fontSize:14}}>{p.name}</div>
                                {isActive&&<span style={{fontSize:10,background:p.color+"33",color:p.color,padding:"2px 7px",borderRadius:10}}>NOW</span>}
                              </div>
                              <div style={{fontSize:11,color:"#64748b",marginBottom:10}}>{p.desc}</div>
                              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
                                {[["AVG",phaseAvg(gameData,p.name,"avg")],["OPS",phaseAvg(gameData,p.name,"ops")],["Hits",pg.reduce((s,g)=>s+g.hits,0)],["HRs",pg.reduce((s,g)=>s+g.hr,0)]].map(([label,val])=>(
                                  <div key={label} style={{background:"#0f172a",borderRadius:8,padding:"8px 10px"}}>
                                    <div style={{fontSize:10,color:"#64748b"}}>{label}</div>
                                    <div style={{fontSize:17,fontWeight:800}}>{val}</div>
                                  </div>
                                ))}
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    )}

                    {/* Streak */}
                    {view==="streak"&&(
                      <div style={{...s.card,padding:"20px 12px 12px"}}>
                        <div style={{fontSize:11,color:"#64748b",marginBottom:12}}>Last {Math.min(gameData.length,20)} games — hits per game, colored by phase</div>
                        <ResponsiveContainer width="100%" height={160}>
                          <BarChart data={gameData.slice(-20)} margin={{left:-10,right:10}}>
                            <CartesianGrid strokeDasharray="3 3" stroke="#334155"/>
                            <XAxis dataKey="date" tick={{fontSize:9,fill:"#64748b"}}/>
                            <YAxis tick={{fontSize:10,fill:"#64748b"}} allowDecimals={false}/>
                            <Tooltip content={<CustomTooltip/>}/>
                            <Bar dataKey="hits" radius={[3,3,0,0]}>
                              {gameData.slice(-20).map((g,i)=><Cell key={i} fill={g.phaseColor}/>)}
                            </Bar>
                          </BarChart>
                        </ResponsiveContainer>
                        <div style={{marginTop:14,overflowX:"auto"}}>
                          <table style={{width:"100%",fontSize:11,borderCollapse:"collapse"}}>
                            <thead><tr style={{color:"#64748b"}}>{["Date","AB","H","HR","RBI","AVG","Phase"].map(h=><td key={h} style={{padding:"4px 8px",borderBottom:"1px solid #334155",textAlign:h==="Date"||h==="Phase"?"left":"center"}}>{h}</td>)}</tr></thead>
                            <tbody>
                              {gameData.slice(-15).reverse().map((g,i)=>(
                                <tr key={i} style={{borderBottom:"1px solid #1e293b"}}>
                                  <td style={{padding:"4px 8px",color:"#94a3b8"}}>{g.date}</td>
                                  <td style={{padding:"4px 8px",textAlign:"center"}}>{g.ab}</td>
                                  <td style={{padding:"4px 8px",textAlign:"center",fontWeight:g.hits>=2?700:400,color:g.hits>=2?"#22c55e":"#f1f5f9"}}>{g.hits}</td>
                                  <td style={{padding:"4px 8px",textAlign:"center",color:g.hr>0?"#f59e0b":"#f1f5f9",fontWeight:g.hr>0?700:400}}>{g.hr}</td>
                                  <td style={{padding:"4px 8px",textAlign:"center"}}>{g.rbi||0}</td>
                                  <td style={{padding:"4px 8px",textAlign:"center"}}>{g.avg.toFixed(3)}</td>
                                  <td style={{padding:"4px 8px",color:g.phaseColor,fontWeight:700}}>{g.phase}</td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    )}

                    {/* Predict */}
                    {view==="predict"&&(
                      <div style={{...s.card}}>
                        {currentPred
                          ?<PredictionPanel pred={currentPred}/>
                          :<div style={{color:"#64748b",padding:20,textAlign:"center"}}>Load player data to generate prediction.</div>}
                      </div>
                    )}

                    {/* AI panel */}
                    <div style={{...s.card,marginTop:12}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                        <div style={{fontWeight:700,fontSize:13}}>🤖 AI Scouting Insight</div>
                        <button onClick={fetchInsight} disabled={aiLoading} style={{...s.btn(!aiLoading),opacity:aiLoading?0.6:1}}>
                          {aiLoading?"Analyzing…":`Analyze ${selectedPlayer.player_name.split(" ").pop()}`}
                        </button>
                      </div>
                      {aiInsight
                        ?<p style={{fontSize:13,color:"#cbd5e1",lineHeight:1.7,margin:0}}>{aiInsight}</p>
                        :<p style={{fontSize:13,color:"#475569",fontStyle:"italic",margin:0}}>Click Analyze for a Claude-powered scouting report, incorporating the prediction score.</p>}
                    </div>
                  </>
                )}
              </div>
            </div>
            )}

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
