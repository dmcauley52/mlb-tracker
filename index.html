                </div>
              </div>
              <div style={{marginTop:6,fontSize:10,color:'#334155',textAlign:'center'}}>
                Score: {g.home.avgScore}/99 · W%: {Math.round(g.homeWinPct*100)}%
              </div>
            </div>
          </div>

          {/* ── Edge Meter ──────────────────────────────────────────────────── */}
          {(()=>{
            const ceColor = s => s>=65?'#22c55e':s>=50?'#f59e0b':'#ef4444';
            const ce = g.cycleEdge;
            // Per-signal rows: label | away% | home% | agree icon
            const sigRows = [];
            // Model row always shown
            sigRows.push({
              label:'Model', labelColor:'#3b82f6',
              awayPct: g.away?.winProb, homePct: g.home?.winProb,
              fav: modelFav, agrees: true,
            });
            // Cycle row
            if (ce?.home && ce?.away) sigRows.push({
              label:'Cycle', labelColor:'#6366f1',
              awayPct: ce.awayProb, homePct: ce.homeProb,
              fav: ceFav, agrees: ceFav === modelFav,
              extra: `${ce.away.score}/${ce.home.score}`,
            });
            // Vegas row
            if (vegasHomeP != null) sigRows.push({
              label:'Vegas', labelColor:'#10b981',
              awayPct: 1 - vegasHomeP, homePct: vegasHomeP,
              fav: vegasFav, agrees: vegasFav === modelFav,
            });
            // Kalshi row
            if (kalshi && !kalshi.error && kalshiHomeProb != null) sigRows.push({
              label:'Kalshi', labelColor:'#f59e0b',
              awayPct: kalshiAwayProb, homePct: kalshiHomeProb,
              fav: kalshiFav, agrees: kalshiFav === modelFav,
              live: isLive,
            });

            const filledDots = agreeCount;
            const totalDots  = Math.max(signalCount, 1);

            return (
              <div style={{marginTop:10,background:ec.bg,borderRadius:8,padding:'10px 14px',
                border:`1px solid ${ec.border}30`}}>
                {/* Header */}
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8,flexWrap:'wrap',gap:6}}>
                  <div style={{display:'flex',alignItems:'center',gap:8}}>
                    <span style={{fontSize:10,fontWeight:700,color:'#475569',letterSpacing:0.8,textTransform:'uppercase'}}>
                      Edge Meter
                    </span>
                    {/* Signal dots */}
                    <div style={{display:'flex',gap:3}}>
                      {Array.from({length: totalDots}).map((_,i) => (
                        <div key={i} style={{width:8,height:8,borderRadius:'50%',
                          background: i < filledDots ? ec.badge : '#1e293b',
                          border:`1px solid ${i < filledDots ? ec.badge : '#334155'}`}} />
                      ))}
                    </div>
                    <span style={{fontSize:10,color:'#475569'}}>{agreeCount}/{signalCount} signals agree</span>
                  </div>
                  {/* Edge badge + tooltip */}
                  {edgeStrength !== 'none' && edgeBadgeLabel && (
                    <div style={{position:'relative',display:'inline-block'}}>
                      <span
                        onMouseEnter={() => setBadgeHovered(true)}
                        onMouseLeave={() => setBadgeHovered(false)}
                        style={{fontSize:11,fontWeight:800,color:ec.badge,cursor:'help',
                          background:`${ec.badge}18`,borderRadius:5,padding:'3px 10px',letterSpacing:0.3,
                          borderBottom:`1px dashed ${ec.badge}80`}}>
                        {edgeBadgeLabel}
                      </span>
                      {badgeHovered && edgeTooltip && (
                        <div style={{position:'absolute',right:0,top:'calc(100% + 6px)',zIndex:100,
                          background:'#0f172a',border:`1px solid ${ec.badge}50`,borderRadius:8,
                          padding:'10px 14px',minWidth:220,maxWidth:300,boxShadow:'0 8px 24px rgba(0,0,0,0.5)'}}>
                          <div style={{fontSize:10,fontWeight:700,color:ec.badge,
                            textTransform:'uppercase',letterSpacing:0.5,marginBottom:6}}>
                            Why this edge?
                          </div>
                          {edgeTooltip.map((line, i) => (
                            <div key={i} style={{fontSize:11,color: i===0?'#e2e8f0':'#94a3b8',
                              marginBottom: i < edgeTooltip.length-1 ? 4 : 0,
                              paddingLeft: i > 0 ? 8 : 0,
                              borderLeft: i > 0 ? `2px solid ${ec.badge}30` : 'none'}}>
                              {line}
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  )}
                </div>

                {/* Signal table */}
                <div style={{display:'grid',gridTemplateColumns:'52px 1fr 28px 1fr 20px',gap:'3px 6px',alignItems:'center'}}>
                  {/* Column headers */}
                  <div/>
                  <div style={{fontSize:9,color:'#334155',fontWeight:700,textAlign:'center',textTransform:'uppercase',letterSpacing:0.5}}>{g.awayAbbr}</div>
                  <div/>
                  <div style={{fontSize:9,color:'#334155',fontWeight:700,textAlign:'center',textTransform:'uppercase',letterSpacing:0.5}}>{g.homeAbbr}</div>
                  <div/>
                  {sigRows.map(row => {
                    const awayIsFav = row.fav === 'away';
                    const homeIsFav = row.fav === 'home';
                    return (
                      <React.Fragment key={row.label}>
                        {/* Source label */}
                        <div style={{display:'flex',alignItems:'center',gap:4}}>
                          <span style={{fontSize:10,fontWeight:700,color:row.labelColor,letterSpacing:0.3}}>
                            {row.label}
                          </span>
                          {row.live && <span style={{fontSize:8,color:'#22c55e',fontWeight:700}}>LIVE</span>}
                        </div>
                        {/* Away % */}
                        <div style={{textAlign:'center',padding:'2px 0',
                          background: awayIsFav ? `${row.labelColor}18` : 'transparent',
                          borderRadius:4}}>
                          <span style={{fontSize:13,fontWeight: awayIsFav?800:600,
                            color: awayIsFav ? row.labelColor : '#64748b'}}>
                            {row.awayPct != null ? Math.round(row.awayPct*100)+'%' : '—'}
                          </span>
                        </div>
                        {/* VS */}
                        <div style={{textAlign:'center',fontSize:9,color:'#334155'}}>vs</div>
                        {/* Home % */}
                        <div style={{textAlign:'center',padding:'2px 0',
                          background: homeIsFav ? `${row.labelColor}18` : 'transparent',
                          borderRadius:4}}>
                          <span style={{fontSize:13,fontWeight: homeIsFav?800:600,
                            color: homeIsFav ? row.labelColor : '#64748b'}}>
                            {row.homePct != null ? Math.round(row.homePct*100)+'%' : '—'}
                          </span>
                        </div>
                        {/* Agree icon */}
                        <div style={{textAlign:'center',fontSize:12}}>
                          {row.agrees
                            ? <span style={{color:'#22c55e'}} title="Agrees with model">✓</span>
                            : <span style={{color:'#f59e0b'}} title="Differs from model">✗</span>}
                        </div>
                      </React.Fragment>
                    );
                  })}
                </div>

                {/* Market gap summary */}
                {bestGap != null && !isLive && (
                  <div style={{marginTop:8,paddingTop:6,borderTop:'1px solid #1e293b',
                    display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
                    <span style={{fontSize:9,color:'#475569',textTransform:'uppercase',letterSpacing:0.5}}>Market gap</span>
                    <span style={{fontSize:12,fontWeight:700,color: gapPct >= 10 ? ec.badge : gapPct > 0 ? '#64748b' : '#ef4444'}}>
                      {favoredGap > 0 ? '+' : ''}{gapPct.toFixed(0)}pp
                    </span>
                    <span style={{fontSize:9,color:'#475569'}}>
                      {favoredGap > 0
                        ? `market underprices ${edgeTeamAbbr} — potential value`
                        : `market overprices ${edgeTeamAbbr} — no value`}
                    </span>
                    {homeGap != null && vegasGap != null && (
                      <span style={{fontSize:9,color:'#334155',marginLeft:'auto'}}>
                        Kalshi {homeGap>0?'+':''}{(homeGap*100).toFixed(0)}pp · Vegas {vegasGap>0?'+':''}{(vegasGap*100).toFixed(0)}pp
                      </span>
                    )}
                  </div>
                )}
              </div>
            );
          })()}

          {/* Lineup panels */}
          {showLineups && (
            <div style={{display:'flex',gap:10,marginTop:12,flexWrap:'wrap'}}>
              <LineupPanel
                title={`${g.awayAbbr} Lineup`}
                lineup={lineups?.away}
                sp={g.homeSp}
                spEra={g.homeSpEra}
                accentColor='#3b82f6'
              />
              <LineupPanel
                title={`${g.homeAbbr} Lineup`}
                lineup={lineups?.home}
                sp={g.awaySp}
                spEra={g.awaySpEra}
                accentColor='#7c3aed'
              />
            </div>
          )}
        </div>
      );
    }

    function TodayMatchupsTab({roster, predCache, sbUrl, sbKey}) {
      const [games,      setGames]      = React.useState([]);
      const [loading,    setLoading]    = React.useState(true);
      const [error,      setError]      = React.useState(null);
      const [lastFetch,  setLastFetch]  = React.useState(null);
      const [kalshiOdds,     setKalshiOdds]     = React.useState({});
      const [polymarketOdds, setPolymarketOdds] = React.useState({});
      const [tracker,        setTracker]        = React.useState([]);

      // Keep a ref to latest roster/predCache so load() doesn't re-fire when batch updates predCache
      const rosterRef   = React.useRef(roster);
      const predCacheRef = React.useRef(predCache);
      React.useEffect(() => { rosterRef.current   = roster;   }, [roster]);
      React.useEffect(() => { predCacheRef.current = predCache; }, [predCache]);

      const load = React.useCallback(async () => {
        setLoading(true); setError(null);
        try {
          const result = await fetchTodayGames(rosterRef.current, predCacheRef.current);
          setGames(result);
          setLastFetch(new Date());
          // Fetch market odds in parallel — don't block if they fail
          if (result.length) {
            const gameList = result.map(g => ({
              gamePk:   g.gamePk,
              homeTeam: g.homeName,
              awayTeam: g.awayName,
              dateStr:  g.dateStr,
            }));
            fetch('/api/kalshi', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({ games: gameList }),
            }).then(r => r.ok ? r.json() : null)
              .then(d => { if (d?.odds) setKalshiOdds(d.odds); })
              .catch(() => {});
            fetch('/api/polymarket', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({ games: gameList }),
            }).then(r => r.ok ? r.json() : null)
              .then(d => { if (d?.odds) setPolymarketOdds(d.odds); })
              .catch(() => {});
          }
        } catch(e) {
          setError(e.message);
        } finally {
          setLoading(false);
        }
      }, []); // stable — reads roster/predCache via refs at call time

      React.useEffect(() => { load(); }, [load]);


      // Load disagreement tracker from Supabase
      React.useEffect(() => {
        if (!sbUrl || !sbKey) return;
        sbFetch(sbUrl, sbKey,
          `kalshi_tracker?select=game_pk,game_date,home_team,away_team,model_pick,kalshi_pick,cycle_pick,vegas_pick,prob_gap,signal_type,model_confidence,model_correct,kalshi_correct,cycle_correct,vegas_correct,actual_winner,pregame_model_home_prob,pregame_kalshi_home_prob,pregame_signal_type,lineup_source,vegas_home_prob,kalshi_home_prob,kalshi_away_prob,model_home_prob,model_away_prob,cycle_home_prob,cycle_away_prob,cycle_home_score,cycle_away_score&order=game_date.desc&limit=100`
        ).then(rows => { if (rows?.length) setTracker(rows); }).catch(() => {});
      }, [sbUrl, sbKey]);

      const fmtTime = (iso) => {
        if (!iso) return '—';
        try {
          const d = new Date(iso);
          const date = d.toLocaleDateString([], {month:'short', day:'numeric'});
          const time = d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit', timeZoneName:'short'});
          return `${date} · ${time}`;
        } catch(e) { return iso; }
      };

      const fmtPct = (v) => v != null ? Math.round(v * 100) + '%' : '—';

      const winColor = (prob) => {
        if (prob == null) return '#94a3b8';
        if (prob >= 0.65) return '#22c55e';
        if (prob >= 0.55) return '#f59e0b';
        return '#94a3b8';
      };

      const mismatchColor = (m) => {
        if (m >= 0.30) return '#22c55e';
        if (m >= 0.15) return '#f59e0b';
        return '#64748b';
      };

      const spLabel = (sp, era) => {
        if (!sp) return <span style={{color:'#475569'}}>TBD ({era?.toFixed(2) ?? '?'} ERA)</span>;
        return <span>{sp.hand ? <span style={{color:'#94a3b8',fontSize:10}}>[{sp.hand}] </span> : null}{sp.name} <span style={{color:'#475569',fontSize:11}}>({sp.era?.toFixed(2) ?? era?.toFixed(2) ?? '?'} ERA)</span></span>;
      };

      const today = (() => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); })();

      if (loading) return (
        <div style={{background:'#1e293b',borderRadius:12,padding:48,textAlign:'center',color:'#64748b',fontSize:13}}>
          Loading today's matchups…
        </div>
      );
      if (error) return (
        <div style={{background:'#1e293b',borderRadius:12,padding:24,color:'#fca5a5'}}>⚠️ {error}</div>
      );

      const todayGames     = games.filter(g => g.dateStr === today);
      const tomorrowGames  = games.filter(g => g.dateStr !== today);
      const vegasByPk = Object.fromEntries(
        tracker.filter(r => r.vegas_home_prob != null)
                .map(r => [r.game_pk, {home_prob: parseFloat(r.vegas_home_prob)}])
      );

      const renderGroup = (label, group) => {
        if (!group.length) return null;
        return (
          <div style={{marginBottom:24}}>
            <div style={{fontSize:11,fontWeight:700,color:'#475569',letterSpacing:1,textTransform:'uppercase',marginBottom:10}}>
              {label} — {group.length} game{group.length!==1?'s':''} · sorted by prediction confidence
            </div>
            {group.map(g => (
              <MatchupCard key={g.gamePk} g={g} roster={roster} predCache={predCache}
                fmtTime={fmtTime} fmtPct={fmtPct} winColor={winColor}
                mismatchColor={mismatchColor} spLabel={spLabel}
                kalshi={kalshiOdds[g.gamePk] || null}
                vegas={vegasByPk[g.gamePk] || null} />
            ))}
          </div>
        );
      };

      return (
        <div>
          <div style={{background:'#1e293b',borderRadius:12,padding:16,marginBottom:16,
            display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:10}}>
            <div>
              <span style={{fontWeight:700,fontSize:14,color:'#f1f5f9'}}>Today's & Tomorrow's Matchups</span>
              <div style={{fontSize:11,color:'#475569',marginTop:2}}>
                Ranked by prediction confidence (largest mismatch first) · lineups refresh automatically when confirmed
                {lastFetch && <span> · updated {lastFetch.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}</span>}
              </div>
            </div>
            <button onClick={load} disabled={loading}
              style={{padding:'8px 18px',borderRadius:8,border:'none',cursor:loading?'not-allowed':'pointer',
                fontWeight:700,fontSize:13,background:'#3b82f6',color:'#fff',opacity:loading?0.6:1}}>
              {loading ? 'Loading…' : 'Refresh'}
            </button>
          </div>

          {games.length === 0 && !loading && (
            <div style={{background:'#1e293b',borderRadius:12,padding:32,textAlign:'center',color:'#475569',fontSize:13}}>
              No upcoming games found for today or tomorrow.
            </div>
          )}

          {renderGroup('Today', todayGames)}
          {renderGroup('Tomorrow', tomorrowGames)}

          {games.length > 0 && (
            <div style={{fontSize:10,color:'#334155',padding:'4px 8px'}}>
              Confidence = how strongly the model favors one side (0% = coin flip, 100% = certain) ·
              Green border = model's pick · Est. lineup uses season avg wOBA until official lineups post ·
              <span style={{color:'#22c55e'}}> Green border + ⚡ = strong model edge vs Kalshi (confidence ≥25%, gap ≥10%)</span> ·
              <span style={{color:'#f59e0b'}}> Amber border = low-confidence disagreement</span>
            </div>
          )}

          {/* ── Disagreement Tracker is now its own tab ── */}
        </div>
      );
    }

    // ── Disagreement Tracker Tab ──────────────────────────────────────────────
    function DisagreementTrackerTab({sbUrl, sbKey}) {
      const [tracker, setTracker] = React.useState([]);

      React.useEffect(() => {
        if (!sbUrl || !sbKey) return;
        sbFetch(sbUrl, sbKey,
          `kalshi_tracker?select=game_pk,game_date,home_team,away_team,model_pick,kalshi_pick,cycle_pick,vegas_pick,prob_gap,signal_type,model_confidence,model_correct,kalshi_correct,cycle_correct,vegas_correct,actual_winner,pregame_model_home_prob,pregame_kalshi_home_prob,pregame_signal_type,lineup_source,vegas_home_prob,kalshi_home_prob,kalshi_away_prob,model_home_prob,model_away_prob,cycle_home_prob,cycle_away_prob,cycle_home_score,cycle_away_score&order=game_date.desc&limit=100`
        ).then(rows => { if (rows?.length) setTracker(rows); }).catch(() => {});
      }, [sbUrl, sbKey]);

      const resolved = tracker.filter(r => r.actual_winner);
      const strong   = resolved.filter(r => r.signal_type === 'strong_edge');
      const weak     = resolved.filter(r => r.signal_type === 'disagreement');
      const pct = (arr, key) => arr.length ? Math.round(arr.filter(r=>r[key]).length/arr.length*100) : null;
      const statCell = (label, val, sub, color) => (
        <div style={{textAlign:'center',minWidth:60}}>
          <div style={{fontSize:20,fontWeight:800,color:color||'#94a3b8',lineHeight:1}}>{val!=null?val+'%':'—'}</div>
          <div style={{fontSize:9,color:'#475569',marginTop:1}}>{label}</div>
          {sub&&<div style={{fontSize:8,color:'#334155'}}>{sub}</div>}
        </div>
      );
      const col = v => v==null?'#475569':v>=60?'#22c55e':v>=50?'#f59e0b':'#ef4444';

      const overallSources = [
        {label:'Model',  key:'model_correct',  color:'#3b82f6'},
        {label:'Cycle',  key:'cycle_correct',  color:'#6366f1'},
        {label:'Kalshi', key:'kalshi_correct', color:'#f59e0b'},
        {label:'Vegas',  key:'vegas_correct',  color:'#10b981'},
      ];

      return (
        <div style={{background:'#1e293b',borderRadius:12,padding:16,marginTop:16}}>
          <div style={{fontWeight:700,fontSize:13,color:'#f1f5f9',marginBottom:4}}>
            Model vs Kalshi — Disagreement Tracker
          </div>
          <div style={{fontSize:11,color:'#475569',marginBottom:14}}>
            Tracks flagged games (≥10% gap) · outcomes filled next day · {resolved.length} resolved so far
          </div>

          {/* ── Overall success rate banner ── */}
          {resolved.length > 0 && (
            <div style={{background:'#0f172a',borderRadius:8,padding:'10px 16px',marginBottom:16,display:'flex',gap:0,flexWrap:'wrap'}}>
              <div style={{fontSize:9,fontWeight:700,color:'#475569',textTransform:'uppercase',letterSpacing:0.5,width:'100%',marginBottom:10}}>
                Overall Success Rate — all {resolved.length} resolved games
              </div>
              {overallSources.map(src => {
                const eligible = src.key === 'vegas_correct'
                  ? resolved.filter(r => r[src.key] != null)
                  : resolved;
                const wins = eligible.filter(r => r[src.key]).length;
                const rate = eligible.length ? Math.round(wins / eligible.length * 100) : null;
                const barColor = rate == null ? '#1e293b' : rate >= 60 ? '#22c55e' : rate >= 50 ? '#f59e0b' : '#ef4444';
                return (
                  <div key={src.key} style={{flex:1,minWidth:100,textAlign:'center',padding:'0 8px',borderRight:'1px solid #1e293b'}}>
                    <div style={{fontSize:9,color:src.color,fontWeight:700,marginBottom:6,textTransform:'uppercase',letterSpacing:0.4}}>
                      {src.label}
                    </div>
                    <div style={{fontSize:28,fontWeight:900,color:barColor,lineHeight:1}}>
                      {rate != null ? rate + '%' : '—'}
                    </div>
                    <div style={{fontSize:9,color:'#334155',marginTop:3}}>
                      {eligible.length ? `${wins} / ${eligible.length}` : 'no data'}
                    </div>
                    <div style={{marginTop:6,height:3,borderRadius:2,background:'#1e293b'}}>
                      {rate != null && (
                        <div style={{height:'100%',borderRadius:2,width:rate+'%',background:barColor,transition:'width 0.4s'}}/>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          )}

                {resolved.length === 0 && (
                  <div style={{color:'#475569',fontSize:12,padding:'12px 0'}}>
                    No resolved games yet — outcomes fill in the morning after each game.
                  </div>
                )}

                {resolved.length > 0 && (
                  <div style={{display:'flex',gap:16,flexWrap:'wrap'}}>
                    {/* Strong edge */}
                    <div style={{flex:1,minWidth:200,background:'#0f172a',borderRadius:8,padding:'10px 14px',borderTop:'2px solid #22c55e'}}>
                      <div style={{fontSize:10,fontWeight:700,color:'#22c55e',marginBottom:10,textTransform:'uppercase',letterSpacing:0.5}}>
                        ⚡ Strong Edge (confidence ≥25%)  · {strong.length} games
                      </div>
                      <div style={{display:'flex',gap:16,flexWrap:'wrap'}}>
                        {statCell('Model', pct(strong,'model_correct'), `${strong.filter(r=>r.model_correct).length}/${strong.length}`, col(pct(strong,'model_correct')))}
                        {statCell('Kalshi', pct(strong,'kalshi_correct'), `${strong.filter(r=>r.kalshi_correct).length}/${strong.length}`, col(pct(strong,'kalshi_correct')))}
                        {statCell('Cycle', pct(strong,'cycle_correct'), `${strong.filter(r=>r.cycle_correct).length}/${strong.length}`, col(pct(strong,'cycle_correct')))}
                        {strong.some(r=>r.vegas_correct!=null) && statCell('Vegas', pct(strong,'vegas_correct'), `${strong.filter(r=>r.vegas_correct).length}/${strong.filter(r=>r.vegas_correct!=null).length}`, col(pct(strong,'vegas_correct')))}
                      </div>
                    </div>
                    {/* Weak disagreement */}
                    <div style={{flex:1,minWidth:200,background:'#0f172a',borderRadius:8,padding:'10px 14px',borderTop:'2px solid #f59e0b'}}>
                      <div style={{fontSize:10,fontWeight:700,color:'#f59e0b',marginBottom:10,textTransform:'uppercase',letterSpacing:0.5}}>
                        Disagreement (confidence &lt;25%)  · {weak.length} games
                      </div>
                      <div style={{display:'flex',gap:16,flexWrap:'wrap'}}>
                        {statCell('Model', pct(weak,'model_correct'), `${weak.filter(r=>r.model_correct).length}/${weak.length}`, col(pct(weak,'model_correct')))}
                        {statCell('Kalshi', pct(weak,'kalshi_correct'), `${weak.filter(r=>r.kalshi_correct).length}/${weak.length}`, col(pct(weak,'kalshi_correct')))}
                        {statCell('Cycle', pct(weak,'cycle_correct'), `${weak.filter(r=>r.cycle_correct).length}/${weak.length}`, col(pct(weak,'cycle_correct')))}
                        {weak.some(r=>r.vegas_correct!=null) && statCell('Vegas', pct(weak,'vegas_correct'), `${weak.filter(r=>r.vegas_correct).length}/${weak.filter(r=>r.vegas_correct!=null).length}`, col(pct(weak,'vegas_correct')))}
                      </div>
                    </div>
                  </div>
                )}

                {/* ── Daily W/L % + Cumulative P&L charts ── */}
                {resolved.length >= 2 && (()=>{
                  // Sort ascending by date
                  const byDate = [...resolved].sort((a,b) => a.game_date < b.game_date ? -1 : 1);

                  // Build daily buckets: { date, model, kalshi, cycle, vegas, count }
                  const buckets = {};
                  byDate.forEach(r => {
                    if (!buckets[r.game_date]) buckets[r.game_date] = {date:r.game_date,model:[],kalshi:[],cycle:[],vegas:[]};
                    const b = buckets[r.game_date];
                    if (r.model_correct  != null) b.model.push(r.model_correct);
                    if (r.kalshi_correct != null) b.kalshi.push(r.kalshi_correct);
                    if (r.cycle_correct  != null) b.cycle.push(r.cycle_correct);
                    if (r.vegas_correct  != null) b.vegas.push(r.vegas_correct);
                  });
                  const days = Object.values(buckets).sort((a,b) => a.date < b.date ? -1 : 1);
                  const winPct = arr => arr.length ? Math.round(arr.filter(Boolean).length / arr.length * 100) : null;

                  // Cumulative $10 P&L on Kalshi — three strategies:
                  // 1. Follow Model pick on Kalshi
                  // 2. Follow Cycle pick on Kalshi
                  // 3. Only bet when Model + Cycle agree, follow that pick on Kalshi
                  // Payout on a $10 bet at implied prob p: win → +10*(1-p)/p, lose → -10
                  // Use pregame_kalshi_home_prob if available, else kalshi_home_prob
                  const buildPnlSeries = (filterFn) => {
                    let running = 0;
                    const points = [];
                    byDate.forEach(r => {
                      const khp = parseFloat(r.pregame_kalshi_home_prob ?? r.kalshi_home_prob ?? 0);
                      const kap = khp > 0 ? +(1 - khp).toFixed(3) : 0;
                      if (!khp) return;
                      const bet = filterFn(r); // returns 'home'|'away'|null
                      if (!bet) return;
                      const isCorrect = bet === r.actual_winner;
                      if (r.actual_winner == null) return;
                      const betProb = bet === 'home' ? khp : kap;
                      if (betProb <= 0 || betProb >= 1) return;
                      const profit = isCorrect ? +(10 * (1 - betProb) / betProb).toFixed(2) : -10;
                      running = +(running + profit).toFixed(2);
                      points.push({date: r.game_date, pnl: running});
                    });
                    return points;
                  };

                  const pnlModel  = buildPnlSeries(r => r.model_pick  ?? null);
                  const pnlCycle  = buildPnlSeries(r => r.cycle_pick  ?? null);
                  const pnlBoth   = buildPnlSeries(r =>
                    r.model_pick && r.cycle_pick && r.model_pick === r.cycle_pick
                      ? r.model_pick : null
                  );

                  const pnlSeries = [
                    {points: pnlModel, color: '#3b82f6', label: 'Model'},
                    {points: pnlCycle, color: '#6366f1', label: 'Cycle'},
                    {points: pnlBoth,  color: '#22c55e', label: 'Model+Cycle agree'},
                  ].filter(s => s.points.length >= 1);

                  // Chart dimensions
                  const W = 560, H = 120, PX = 40, PY = 12;
                  const cW = W - PX, cH = H - PY * 2;

                  // Win% chart
                  const signals = [
                    {key:'model',  color:'#3b82f6', label:'Model'},
                    {key:'cycle',  color:'#6366f1', label:'Cycle'},
                    {key:'vegas',  color:'#10b981', label:'Vegas'},
                    {key:'kalshi', color:'#f59e0b', label:'Kalshi'},
                  ];
                  const allPcts = days.flatMap(d => signals.map(s => winPct(d[s.key]))).filter(v=>v!=null);
                  const minPct = Math.max(0, Math.min(...allPcts) - 10);
                  const maxPct = Math.min(100, Math.max(...allPcts) + 10);
                  const xScale = i => PX + (i / Math.max(days.length - 1, 1)) * cW;
                  const yScalePct = v => PY + (1 - (v - minPct) / (maxPct - minPct)) * cH;

                  const polyline = (s) => {
                    const pts = days.map((d,i) => {
                      const v = winPct(d[s.key]);
                      return v != null ? `${xScale(i)},${yScalePct(v)}` : null;
                    }).filter(Boolean);
                    return pts.length >= 2 ? pts.join(' ') : null;
                  };

                  // P&L chart scales — across all three series
                  const allPnlVals = pnlSeries.flatMap(s => s.points.map(p => p.pnl));
                  const minPnl = Math.min(0, ...allPnlVals) - 2;
                  const maxPnl = Math.max(0, ...allPnlVals) + 2;
                  const yScalePnl = v => PY + (1 - (v - minPnl) / (maxPnl - minPnl)) * cH;
                  const zeroY = yScalePnl(0);
                  // Map dates → x positions using the shared days x-scale
                  const dateToX = {};
                  days.forEach((d,i) => { dateToX[d.date] = xScale(i); });
                  // Build polyline string for each series
                  pnlSeries.forEach(s => {
                    s.poly = s.points
                      .filter(p => dateToX[p.date] != null)
                      .map(p => `${dateToX[p.date]},${yScalePnl(p.pnl)}`).join(' ');
                    s.last = s.points.length ? s.points[s.points.length-1].pnl : null;
                  });

                  return (
                    <div style={{marginTop:16,display:'flex',flexDirection:'column',gap:12}}>
                      {/* Win% chart */}
                      <div style={{background:'#0f172a',borderRadius:8,padding:'12px 14px'}}>
                        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
                          <span style={{fontSize:10,fontWeight:700,color:'#475569',textTransform:'uppercase',letterSpacing:0.5}}>
                            Daily Win % by Signal
                          </span>
                          <div style={{display:'flex',gap:10}}>
                            {signals.map(s => (
                              <div key={s.key} style={{display:'flex',alignItems:'center',gap:4}}>
                                <div style={{width:10,height:2,background:s.color,borderRadius:1}}/>
                                <span style={{fontSize:9,color:s.color}}>{s.label}</span>
                              </div>
                            ))}
                          </div>
                        </div>
                        <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:H,overflow:'visible'}}>
                          {/* 50% reference line */}
                          {minPct <= 50 && maxPct >= 50 && (
                            <>
                              <line x1={PX} y1={yScalePct(50)} x2={W} y2={yScalePct(50)}
                                stroke="#334155" strokeWidth="1" strokeDasharray="3,3"/>
                              <text x={PX-2} y={yScalePct(50)+4} fontSize="8" fill="#475569" textAnchor="end">50%</text>
                            </>
                          )}
                          {/* Y axis labels */}
                          {[minPct, maxPct].map(v => (
                            <text key={v} x={PX-2} y={yScalePct(v)+4} fontSize="8" fill="#334155" textAnchor="end">
                              {Math.round(v)}%
                            </text>
                          ))}
                          {/* X axis date labels */}
                          {days.filter((_,i) => i===0 || i===days.length-1 || (days.length>4 && i===Math.floor(days.length/2))).map((d,_,arr) => {
                            const i = days.indexOf(d);
                            return <text key={d.date} x={xScale(i)} y={H} fontSize="7" fill="#334155" textAnchor="middle">{d.date.slice(5)}</text>;
                          })}
                          {/* Signal lines */}
                          {signals.map(s => {
                            const pts = polyline(s);
                            if (!pts) return null;
                            return (
                              <g key={s.key}>
                                <polyline points={pts} fill="none" stroke={s.color} strokeWidth="1.5" strokeLinejoin="round"/>
                                {days.map((d,i) => {
                                  const v = winPct(d[s.key]);
                                  return v != null ? <circle key={i} cx={xScale(i)} cy={yScalePct(v)} r="2.5" fill={s.color}/> : null;
                                })}
                              </g>
                            );
                          })}
                        </svg>
                      </div>

                      {/* P&L chart — 3 lines */}
                      {pnlSeries.length >= 1 && (
                        <div style={{background:'#0f172a',borderRadius:8,padding:'12px 14px'}}>
                          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8,flexWrap:'wrap',gap:8}}>
                            <span style={{fontSize:10,fontWeight:700,color:'#475569',textTransform:'uppercase',letterSpacing:0.5}}>
                              Cumulative P&amp;L — $10/game on Kalshi
                            </span>
                            <div style={{display:'flex',gap:12,alignItems:'center',flexWrap:'wrap'}}>
                              {pnlSeries.map(s => (
                                <div key={s.label} style={{display:'flex',alignItems:'center',gap:5}}>
                                  <div style={{width:14,height:2,background:s.color,borderRadius:1}}/>
                                  <span style={{fontSize:9,color:'#64748b'}}>{s.label}</span>
                                  {s.last != null && (
                                    <span style={{fontSize:10,fontWeight:800,color:s.last>=0?s.color:'#ef4444'}}>
                                      {s.last>=0?'+':''}{s.last.toFixed(2)}
                                    </span>
                                  )}
                                </div>
                              ))}
                            </div>
                          </div>
                          <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:H,overflow:'visible'}}>
                            {/* Zero line */}
                            <line x1={PX} y1={zeroY} x2={W} y2={zeroY}
                              stroke="#334155" strokeWidth="1" strokeDasharray="3,3"/>
                            <text x={PX-2} y={zeroY+4} fontSize="8" fill="#475569" textAnchor="end">$0</text>
                            {/* Y axis labels */}
                            {[minPnl, maxPnl].map(v => (
                              <text key={v} x={PX-2} y={yScalePnl(v)+4} fontSize="8" fill="#334155" textAnchor="end">
                                ${v.toFixed(0)}
                              </text>
                            ))}
                            {/* X axis date labels */}
                            {days.filter((_,i) => i===0 || i===days.length-1 || (days.length>4 && i===Math.floor(days.length/2))).map(d => {
                              const i = days.indexOf(d);
                              return <text key={d.date} x={xScale(i)} y={H} fontSize="7" fill="#334155" textAnchor="middle">{d.date.slice(5)}</text>;
                            })}
                            {/* One line per strategy */}
                            {pnlSeries.map(s => {
                              if (!s.poly) return null;
                              const lastPt = s.points[s.points.length-1];
                              const lx = lastPt && dateToX[lastPt.date];
                              return (
                                <g key={s.label}>
                                  <polyline points={s.poly} fill="none" stroke={s.color}
                                    strokeWidth="2" strokeLinejoin="round" opacity="0.9"/>
                                  {lx != null && (
                                    <circle cx={lx} cy={yScalePnl(lastPt.pnl)} r="3" fill={s.color}/>
                                  )}
                                </g>
                              );
                            })}
                          </svg>
                        </div>
                      )}
                    </div>
                  );
                })()}

                {/* Recent rows */}
                {resolved.length > 0 && (
                  <div style={{marginTop:12}}>
                    <div style={{fontSize:9,color:'#334155',fontWeight:700,textTransform:'uppercase',letterSpacing:0.5,marginBottom:6}}>Recent</div>
                    <div style={{display:'grid',gridTemplateColumns:'80px 1fr 55px 55px 65px 65px 65px 65px 65px',gap:0,
                      padding:'4px 8px',fontSize:9,color:'#475569',fontWeight:700,borderBottom:'1px solid #0f172a'}}>
                      <span>Date</span><span>Game</span>
                      <span style={{textAlign:'center'}}>AM Gap</span>
                      <span style={{textAlign:'center'}}>Pre-game</span>
                      <span style={{textAlign:'center',color:'#3b82f6'}}>Model</span>
                      <span style={{textAlign:'center',color:'#f59e0b'}}>Kalshi</span>
                      <span style={{textAlign:'center',color:'#6366f1'}}>Cycle</span>
                      <span style={{textAlign:'center',color:'#10b981'}}>Vegas</span>
                      <span style={{textAlign:'center'}}>Result</span>
                    </div>
                    {resolved.slice(0,10).map((r,i) => {
                      const kalshiMoved = r.pregame_kalshi_home_prob != null;
                      const pgGap = kalshiMoved && r.pregame_model_home_prob != null
                        ? +(r.pregame_model_home_prob - r.pregame_kalshi_home_prob).toFixed(2) : null;
                      const shortName = t => t?.split(' ').pop() ?? '—';
                      const pickCell = (pick, correct, prob, color) => (
                        <div style={{textAlign:'center'}}>
                          <div style={{fontSize:10,fontWeight:600,color:color||'#94a3b8'}}>{shortName(pick)}</div>
                          {prob != null && <div style={{fontSize:8,color:'#475569'}}>{Math.round(prob*100)}%</div>}
                          <div style={{fontSize:12,color:correct===true?'#22c55e':correct===false?'#ef4444':'#334155'}}>
                            {correct===true?'✓':correct===false?'✗':'—'}
                          </div>
                        </div>
                      );
                      const modelProb = r.pregame_model_home_prob != null
                        ? (r.model_pick === 'home' ? parseFloat(r.pregame_model_home_prob) : 1 - parseFloat(r.pregame_model_home_prob))
                        : r.model_home_prob != null
                          ? (r.model_pick === 'home' ? parseFloat(r.model_home_prob) : parseFloat(r.model_away_prob))
                          : null;
                      const kalshiProb = r.pregame_kalshi_home_prob != null
                        ? (r.kalshi_pick === 'home' ? parseFloat(r.pregame_kalshi_home_prob) : 1 - parseFloat(r.pregame_kalshi_home_prob))
                        : (r.kalshi_home_prob != null
                          ? (r.kalshi_pick === 'home' ? parseFloat(r.kalshi_home_prob) : parseFloat(r.kalshi_away_prob))
                          : null);
                      const cycleProb = r.cycle_home_prob != null
                        ? (r.cycle_pick === 'home' ? parseFloat(r.cycle_home_prob) : 1 - parseFloat(r.cycle_home_prob))
                        : null;
                      const vegasProb = r.vegas_home_prob != null
                        ? (r.vegas_pick === 'home' ? parseFloat(r.vegas_home_prob) : 1 - parseFloat(r.vegas_home_prob))
                        : null;
                      return (
                        <div key={i} style={{display:'grid',gridTemplateColumns:'80px 1fr 55px 55px 65px 65px 65px 65px 65px',
                          gap:0,padding:'5px 8px',fontSize:10,borderBottom:'1px solid #0f172a',
                          background:i%2===0?'rgba(15,23,42,0.4)':'transparent',alignItems:'center'}}>
                          <span style={{color:'#475569'}}>{r.game_date}</span>
                          <div>
                            <span style={{color:'#e2e8f0',fontWeight:600}}>{r.away_team?.split(' ').pop()} @ {r.home_team?.split(' ').pop()}</span>
                            {r.lineup_source==='actual'&&<span style={{fontSize:8,color:'#3b82f6',marginLeft:4}}>lineup</span>}
                          </div>
                          <span style={{textAlign:'center',color:r.signal_type==='strong_edge'?'#22c55e':'#f59e0b',fontWeight:700}}>
                            {r.prob_gap>0?'+':''}{Math.round(r.prob_gap*100)}%
                          </span>
                          <span style={{textAlign:'center',color:pgGap!=null?(r.pregame_signal_type==='strong_edge'?'#22c55e':'#f59e0b'):'#334155',fontSize:9}}>
                            {pgGap!=null ? `${pgGap>0?'+':''}${Math.round(pgGap*100)}%` : '—'}
                          </span>
                          {pickCell(r.model_pick,  r.model_correct,  modelProb,  '#3b82f6')}
                          {pickCell(r.kalshi_pick, r.kalshi_correct, kalshiProb, '#f59e0b')}
                          {pickCell(r.cycle_pick,  r.cycle_correct,  cycleProb,  '#6366f1')}
                          {pickCell(r.vegas_pick,  r.vegas_correct,  vegasProb,  '#10b981')}
                          <span style={{textAlign:'center',color:'#64748b'}}>{r.actual_winner ? shortName(r.actual_winner) : '—'}</span>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
      );
    }

    // ── Prediction Accuracy Tab ───────────────────────────────────────────────
    function PredictionAccuracyTab({roster, predCache, sbUrl, sbKey}) {
      const [results,    setResults]    = React.useState([]);
      const [running,    setRunning]    = React.useState(false);
      const [progress,   setProgress]   = React.useState("");
      const [done,       setDone]       = React.useState(false);
      const [cacheDate,  setCacheDate]  = React.useState(null);
      const [fromCache,  setFromCache]  = React.useState(false);

      const teams = React.useMemo(()=>[...new Set(roster.map(p=>p.team).filter(Boolean))].sort(),[roster]);

      // Load from backtest_results cache on mount if Supabase is available
      React.useEffect(()=>{
        if(!sbUrl||!sbKey) return;
        (async()=>{
          try{
            // Get the most recent run_date
            const rows = await sbFetch(sbUrl, sbKey,
              `backtest_results?select=team,run_date,games_eval,win_accuracy,avg_run_mae,avg_woba_mae&order=win_accuracy.desc.nullslast&limit=200`);
            if(!rows||!rows.length) return;
            // Group by most recent run_date
            const latest = rows.reduce((max,r)=>r.run_date>max?r.run_date:max, rows[0].run_date);
            const filtered = rows.filter(r=>r.run_date===latest);
            setResults(filtered.map(r=>({
              team:        r.team,
              winAccuracy: r.win_accuracy,
              avgRunMAE:   r.avg_run_mae,
              avgWobaMAE:  r.avg_woba_mae,
              gamesEval:   r.games_eval,
              error:       null,
            })).sort((a,b)=>(b.winAccuracy??-1)-(a.winAccuracy??-1)));
            setCacheDate(latest);
            setFromCache(true);
            setDone(true);
          }catch(e){ /* silent — fall back to live */ }
        })();
      },[sbUrl,sbKey]);

      // Live computation fallback (hits MLB API per team)
      const runAll = async () => {
        setRunning(true); setDone(false); setResults([]); setProgress(""); setFromCache(false); setCacheDate(null);
        const out = [];
        for(let i=0; i<teams.length; i++){
          const t = teams[i];
          setProgress(`Running ${t}… (${i+1}/${teams.length})`);
          try{
            const r = await backtestGamePlan(t, roster, predCache, null, null, 21);
            if(r.error){
              out.push({team:t, error:r.error, winAccuracy:null, avgRunMAE:null, gamesEval:0});
            } else {
              const s = r.actualSummary || r.suggestedSummary;
              out.push({team:t, winAccuracy:s?.winAccuracy??null, avgRunMAE:s?.avgRunMAE??null,
                         avgWobaMAE:s?.avgWobaMAE??null, gamesEval:r.gamesEval, error:null});
            }
          } catch(e){
            out.push({team:t, error:e.message, winAccuracy:null, avgRunMAE:null, gamesEval:0});
          }
          setResults([...out].sort((a,b)=>(b.winAccuracy??-1)-(a.winAccuracy??-1)));
        }
        setRunning(false); setDone(true); setProgress("");
      };

      const scoreCol = v => v==null?"#475569":v>=0.60?"#22c55e":v>=0.50?"#f59e0b":"#ef4444";
      const maeCol   = v => v==null?"#475569":v<=1.5?"#22c55e":v<=2.5?"#f59e0b":"#ef4444";
      const medal    = i => i===0?"🥇":i===1?"🥈":i===2?"🥉":null;

      return(
        <div>
          <div style={{background:"#1e293b",borderRadius:12,padding:16,marginBottom:16}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
              <div>
                <span style={{fontWeight:700,fontSize:14,color:"#f1f5f9"}}>Prediction Accuracy — All Teams</span>
                <div style={{fontSize:11,color:"#475569",marginTop:2}}>
                  {fromCache&&cacheDate
                    ? <><span style={{color:"#22c55e"}}>● Cached</span> · nightly run from {cacheDate} · <span style={{color:"#475569",cursor:"pointer",textDecoration:"underline"}} onClick={runAll}>recompute live</span></>
                    : "Backtests every team over the last 3 weeks · ranked by W/L accuracy"
                  }
                </div>
              </div>
              <button onClick={runAll} disabled={running}
                style={{padding:"8px 20px",borderRadius:8,border:"none",cursor:running?"not-allowed":"pointer",
                  fontWeight:700,fontSize:13,background:"#7c3aed",color:"#fff",opacity:running?0.6:1,whiteSpace:"nowrap"}}>
                {running?"Running…":fromCache?"Recompute Live":"Run All Teams"}
              </button>
            </div>
            {progress&&<div style={{marginTop:10,fontSize:12,color:"#7c3aed"}}>{progress}</div>}
          </div>

          {results.length>0&&(
            <div style={{background:"#1e293b",borderRadius:12,overflow:"hidden"}}>
              <div style={{display:"grid",gridTemplateColumns:"28px 1fr 90px 90px 80px 60px",
                gap:0,padding:"8px 16px",borderBottom:"1px solid #0f172a",
                fontSize:10,fontWeight:700,color:"#475569",textTransform:"uppercase",letterSpacing:0.8}}>
                <span/><span>Team</span>
                <span style={{textAlign:"center"}}>W/L Accuracy</span>
                <span style={{textAlign:"center"}}>Run MAE</span>
                <span style={{textAlign:"center"}}>wOBA MAE</span>
                <span style={{textAlign:"center"}}>Games</span>
              </div>

              {results.map((r,i)=>(
                <div key={r.team} style={{
                  display:"grid",gridTemplateColumns:"28px 1fr 90px 90px 80px 60px",
                  gap:0,padding:"10px 16px",borderBottom:"1px solid #0f172a",
                  background:i===0?"rgba(34,197,94,0.05)":i%2===0?"rgba(15,23,42,0.4)":"transparent",
                  alignItems:"center"}}>
                  <span style={{fontSize:14}}>{medal(i)||<span style={{fontSize:11,color:"#334155"}}>{i+1}</span>}</span>
                  <span style={{fontWeight:700,fontSize:13,color:r.error?"#ef4444":"#e2e8f0"}}>
                    {r.team}{r.error&&<span style={{fontSize:10,color:"#475569",marginLeft:6}}>— {r.error}</span>}
                  </span>
                  <div style={{textAlign:"center"}}>
                    {r.winAccuracy!=null
                      ?<><div style={{fontSize:18,fontWeight:800,color:scoreCol(r.winAccuracy)}}>{Math.round(r.winAccuracy*100)}%</div>
                         <div style={{fontSize:9,color:"#334155"}}>win/loss</div></>
                      :<span style={{color:"#334155"}}>—</span>}
                  </div>
                  <div style={{textAlign:"center"}}>
                    {r.avgRunMAE!=null
                      ?<><div style={{fontSize:18,fontWeight:800,color:maeCol(r.avgRunMAE)}}>{r.avgRunMAE}</div>
                         <div style={{fontSize:9,color:"#334155"}}>runs off</div></>
                      :<span style={{color:"#334155"}}>—</span>}
                  </div>
                  <div style={{textAlign:"center"}}>
                    {r.avgWobaMAE!=null
                      ?<><div style={{fontSize:15,fontWeight:700,color:"#64748b"}}>{r.avgWobaMAE}</div>
                         <div style={{fontSize:9,color:"#334155"}}>wOBA MAE</div></>
                      :<span style={{color:"#334155"}}>—</span>}
                  </div>
                  <div style={{textAlign:"center",fontSize:12,color:"#475569"}}>{r.gamesEval||"—"}</div>
                </div>
              ))}

              {done&&(
                <div style={{padding:"10px 16px",fontSize:10,color:"#334155"}}>
                  W/L Accuracy: <span style={{color:"#22c55e"}}>green ≥60%</span> · <span style={{color:"#f59e0b"}}>amber ≥50%</span> · <span style={{color:"#ef4444"}}>red &lt;50%</span> · random baseline = 50%.
                  {fromCache?" Loaded from nightly cache — zero API calls.":" Live computation — results appeared team by team."}
                </div>
              )}
            </div>
          )}

          {!running&&!done&&results.length===0&&(
            <div style={{background:"#1e293b",borderRadius:12,padding:32,textAlign:"center",color:"#475569",fontSize:13}}>
              {sbUrl&&sbKey
                ? "Loading cached results…"
                : <>Click <b style={{color:"#7c3aed"}}>Run All Teams</b> to backtest every team (30–60 seconds).<br/>
                   <span style={{fontSize:11,color:"#334155",marginTop:6,display:"block"}}>Connect Supabase to load instantly from the nightly cache.</span></>
              }
            </div>
          )}
        </div>
      );
    }

    // ── Monte Carlo Simulation Engine ────────────────────────────────────────
    const LEAGUE_AVG_K9  = 8.5;
    const SPOT_PA        = [4.5,4.4,4.3,4.2,4.1,4.0,3.95,3.9,3.8];

    function computePlayerDistribution(games) {
      let pa=0,hr=0,trip=0,dbl=0,hit=0,bbHbp=0,k=0;
      for(const g of games){
        pa    += g.plate_appearances||g.at_bats||0;
        hr    += g.home_runs||0;
        trip  += g.triples||0;
        dbl   += g.doubles||0;
        hit   += g.hits||0;
        bbHbp += (g.walks||0)+(g.hit_by_pitch||0);
        k     += g.strikeouts||0;
      }
      if(pa<1) return null;
      const p1b = Math.max(0,(hit-dbl-trip-hr)/pa);
      const pBb = bbHbp/pa, pK = k/pa, pHr = hr/pa, pTrip = trip/pa, pDbl = dbl/pa;
      return {hr:pHr,trip:pTrip,dbl:pDbl,s1b:p1b,bb:pBb,k:pK,
              out:Math.max(0,1-pHr-pTrip-pDbl-p1b-pBb-pK),
              paCount:pa,gameCount:games.length};
    }

    function distributionFromMLBStats(s) {
      const pa=(s.atBats||0)+(s.baseOnBalls||0)+(s.hitByPitch||0)+(s.sacFlies||0);
      if(pa<1) return null;
      const hr=s.homeRuns||0,trip=s.triples||0,dbl=s.doubles||0,hit=s.hits||0;
      const bbHbp=(s.baseOnBalls||0)+(s.hitByPitch||0),k=s.strikeOuts||0;
      const p1b=Math.max(0,(hit-dbl-trip-hr)/pa);
      const pBb=bbHbp/pa,pK=k/pa,pHr=hr/pa,pTrip=trip/pa,pDbl=dbl/pa;
      return {hr:pHr,trip:pTrip,dbl:pDbl,s1b:p1b,bb:pBb,k:pK,
              out:Math.max(0,1-pHr-pTrip-pDbl-p1b-pBb-pK),
              paCount:pa,gameCount:0,fromFallback:true};
    }

    function applySpAdjustment(dist,sp) {
      if(!dist||!sp) return dist;
      const kMult  = Math.min(2.0,Math.max(0.5,(sp.k9||LEAGUE_AVG_K9)/LEAGUE_AVG_K9));
      // eraAdj < 1 = better-than-avg SP → reduce hits; >1 = worse → inflate hits
      // Clamp tightly so we never blow up probabilities
      const eraAdj = Math.min(1.25,Math.max(0.75,(sp.era||LEAGUE_AVG_ERA)/LEAGUE_AVG_ERA));
      const newK   = Math.min(0.40,dist.k*kMult);
      const kDelta = newK-dist.k;
      const hitSum = dist.hr+dist.trip+dist.dbl+dist.s1b;
      // Remove k-increase delta from hits proportionally
      const hitScale = hitSum>0?Math.max(0.5,1-kDelta/Math.max(hitSum,0.01)):1;
      // ERA scales all positive events, clamped so total never exceeds 0.85
      const rawHr  = dist.hr  *hitScale*eraAdj;
      const rawTrip= dist.trip*hitScale*eraAdj;
      const rawDbl = dist.dbl *hitScale*eraAdj;
      const raw1b  = dist.s1b *hitScale*eraAdj;
      const rawBb  = dist.bb  *eraAdj;
      // Normalise so positive events + K never exceed 0.90 (leaving room for outs)
      const positiveSum = rawHr+rawTrip+rawDbl+raw1b+rawBb+newK;
      const norm = positiveSum>0.90 ? 0.90/positiveSum : 1;
      const hr2=rawHr*norm,trip2=rawTrip*norm,dbl2=rawDbl*norm,
            s1b2=raw1b*norm,bb2=rawBb*norm,k2=newK*norm;
      return {hr:hr2,trip:trip2,dbl:dbl2,s1b:s1b2,bb:bb2,k:k2,
              out:Math.max(0.10,1-hr2-trip2-dbl2-s1b2-bb2-k2),
              paCount:dist.paCount,gameCount:dist.gameCount,fromFallback:dist.fromFallback};
    }

    function samplePA(d) {
      const r=Math.random();
      let c=d.hr;       if(r<c) return 'hr';
      c+=d.trip;        if(r<c) return 'trip';
      c+=d.dbl;         if(r<c) return 'dbl';
      c+=d.s1b;         if(r<c) return 's1b';
      c+=d.bb;          if(r<c) return 'bb';
      c+=d.k;           if(r<c) return 'k';
      return 'out';
    }

    // bases store batter slot index (0-8) of the runner, or -1 if empty
    // rTally/rbiTally are length-9 arrays accumulated across the full game
    function simulateHalfInning(dists, start, rTally, rbiTally) {
      let outs=0, b=[-1,-1,-1], bIdx=start, innRuns=0;
      const score=(runner, rbi)=>{
        if(runner>=0){ rTally[runner]++; innRuns++; }
        if(rbi>=0)    rbiTally[rbi]++;
      };
      while(outs<3){
        const bat=bIdx%9, outcome=samplePA(dists[bat]); bIdx++;
        if(outcome==='hr'){
          [b[2],b[1],b[0]].forEach(r=>score(r,bat));
          score(bat,bat);            // batter scores + RBI for self
          b=[-1,-1,-1];
        } else if(outcome==='trip'){
          [b[2],b[1],b[0]].forEach(r=>score(r,bat));
          b=[-1,-1,bat];
        } else if(outcome==='dbl'){
          score(b[2],bat); score(b[1],bat);
          b=[-1,-1, b[0]];           // runner from 1B advances to 3B (no score)
        } else if(outcome==='s1b'){
          score(b[2],bat);
          const s2=b[1]>=0&&Math.random()<0.60;
          if(s2) score(b[1],bat);
          b=[bat, b[0], s2?-1:b[1]];
        } else if(outcome==='bb'){
          if(b[0]>=0&&b[1]>=0&&b[2]>=0){ score(b[2],bat); b=[bat,b[0],b[1]]; }
          else if(b[0]>=0&&b[1]>=0)     { b=[bat,b[0],b[1]]; }
          else if(b[0]>=0)              { b=[bat,b[0],b[2]]; }
          else                          { b=[bat,b[1],b[2]]; }
        } else if(outcome==='k'){
          outs++;
        } else {
          if(b[0]>=0&&outs<2&&Math.random()<0.15){ outs+=2; b[0]=-1; }
          else outs++;
        }
      }
      return{ innRuns, nextBatter: bIdx%9 };
    }

    function simulateGame(homeDists, awayDists) {
      let hB=0, aB=0;
      const hInnings=[], aInnings=[];
      const hRun=new Array(9).fill(0), hRbi=new Array(9).fill(0);
      const aRun=new Array(9).fill(0), aRbi=new Array(9).fill(0);
      for(let inn=0;inn<9;inn++){
        const ah=simulateHalfInning(awayDists,aB,aRun,aRbi);
        aInnings.push(ah.innRuns); aB=ah.nextBatter;
        const hh=simulateHalfInning(homeDists,hB,hRun,hRbi);
        hInnings.push(hh.innRuns); hB=hh.nextBatter;
      }
      return{
        homeRuns: hInnings.reduce((a,b)=>a+b,0),
        awayRuns: aInnings.reduce((a,b)=>a+b,0),
        hInnings, aInnings,
        hRun, hRbi, aRun, aRbi,
      };
    }

    async function fetchLast30Games(sbUrl,sbKey,playerNames) {
      if(!playerNames.length||!sbUrl||!sbKey) return {};
      const since=new Date();since.setDate(since.getDate()-60);
      const iso=since.toISOString().split("T")[0];
      const nameParam=`(${playerNames.map(n=>JSON.stringify(n)).join(",")})`;
      try{
        const rows=await sbFetch(sbUrl,sbKey,
          `player_gamelogs?player_name=in.${encodeURIComponent(nameParam)}`+
          `&game_date=gte.${iso}&order=player_name.asc,game_date.desc`+
          `&select=player_name,plate_appearances,at_bats,hits,doubles,triples,`+
          `home_runs,walks,hit_by_pitch,strikeouts,sac_flies,runs,rbi&limit=1000`);
        const byPlayer={};
        for(const r of rows){
          if(!byPlayer[r.player_name])byPlayer[r.player_name]=[];
          if(byPlayer[r.player_name].length<30)byPlayer[r.player_name].push(r);
        }
        return byPlayer;
      }catch{return{};}
    }

    async function fetchMLBSeasonStats(mlbId) {
      try{
        const r=await fetch(`https://statsapi.mlb.com/api/v1/people/${mlbId}/stats?stats=season&group=hitting&season=2026&gameType=R`);
        const d=await r.json();
        return d.stats?.[0]?.splits?.[0]?.stat||null;
      }catch{return null;}
    }

    async function fetchOfficialLineup(teamId,gameDate) {
      try{
        const r=await fetch(`https://statsapi.mlb.com/api/v1/schedule?sportId=1&teamId=${teamId}&startDate=${gameDate}&endDate=${gameDate}&hydrate=lineups`);
        const d=await r.json();
        const game=d.dates?.[0]?.games?.[0];
        if(!game)return null;
        const isHome=game.teams.home.team.id===teamId;
        const lu=game.lineups||{};
        return{myPlayers:lu[isHome?'homePlayers':'awayPlayers']||[],
               oppPlayers:lu[isHome?'awayPlayers':'homePlayers']||[],
               gamePk:game.gamePk,isHome};
      }catch{return null;}
    }

    // idMap: optional {playerName -> mlbId} for players not in MLB_IDS hardcoded list
    // Returns {dists, coverage} where coverage is array of {name, source} per slot
    async function buildDistributions(names, gamesMap, sp, idMap={}) {
      const LEAGUE_AVG={hr:0.033,trip:0.004,dbl:0.047,s1b:0.145,bb:0.084,k:0.220,
                        out:0.467,paCount:0,gameCount:0,fromFallback:true};
      const dists=[], coverage=[];
      for(let i=0;i<9;i++){
        const name=names[i]; let dist=null, source='league-avg';
        if(name&&gamesMap[name]?.length>=10){
          dist=computePlayerDistribution(gamesMap[name]);
          source=`db(${gamesMap[name].length}g)`;
        }
        if(!dist&&name){
          const mlbId=MLB_IDS[name]||idMap[name];
          if(mlbId){
            const stat=await fetchMLBSeasonStats(mlbId);
            if(stat){dist=distributionFromMLBStats(stat); source='mlb-api';}
            else source='mlb-api-fail';
          } else {
            source='no-id';
          }
        }
        coverage.push({name:name||'—', source});
        dists.push(sp?applySpAdjustment(dist||LEAGUE_AVG,sp):(dist||LEAGUE_AVG));
      }
      return {dists, coverage};
    }

    function MonteCarloSimPanel({myTeam,selectedGame,likelyLineup,oppLineup,sbUrl,sbKey,onOfficialLineup}) {
      const [simPhase,      setSimPhase]      = React.useState("idle");
      const [officialLineup,setOfficialLineup]= React.useState(null);
      const [simProgress,   setSimProgress]   = React.useState(0);
      const [simResult,     setSimResult]     = React.useState(null);
      const [simError,      setSimError]      = React.useState("");
      const pollRef   = React.useRef(null);
      const abortRef  = React.useRef(false);
      const ACCENT    = "#f472b6";

      // Poll for official lineup once game is within 4 hours
      React.useEffect(()=>{
        if(pollRef.current){clearInterval(pollRef.current);pollRef.current=null;}
        setSimPhase("idle");setOfficialLineup(null);setSimResult(null);setSimError("");
        if(!selectedGame||!myTeam)return;
        // Only poll for today's game (dayOffset 0) or past games — future games won't have lineups
        if(selectedGame.dayOffset>0)return;
        const iso=new Date().toISOString().slice(0,10);
        const doCheck=async()=>{
          try{
            // Search by date only — find our team's game in today's schedule
            const r=await fetch(`https://statsapi.mlb.com/api/v1/schedule?sportId=1&startDate=${iso}&endDate=${iso}&hydrate=lineups`);
            const d=await r.json();
            const allGames=(d.dates||[]).flatMap(dt=>dt.games||[]);
            const game=allGames.find(g=>
              g.teams.home.team.name===myTeam||g.teams.away.team.name===myTeam
            );
            if(!game){setSimPhase("waiting");return;}
            const isHome=game.teams.home.team.name===myTeam;
            const lu=game.lineups||{};
            const myPlayers=lu[isHome?'homePlayers':'awayPlayers']||[];
            const oppPlayers=lu[isHome?'awayPlayers':'homePlayers']||[];
            if(myPlayers.length>0){
              const confirmed={myPlayers,oppPlayers,gamePk:game.gamePk,isHome};
              setOfficialLineup(confirmed);
              setSimPhase("ready");
              clearInterval(pollRef.current);pollRef.current=null;
              if(onOfficialLineup) onOfficialLineup(confirmed);
            }else{setSimPhase("waiting");}
          }catch{setSimPhase("waiting");}
        };
        doCheck();
        pollRef.current=setInterval(doCheck,60000);
        return()=>{if(pollRef.current)clearInterval(pollRef.current);};
      },[selectedGame,myTeam]);

      const runSimulation=React.useCallback(async()=>{
        setSimPhase("simulating");setSimProgress(0);setSimResult(null);setSimError("");
        abortRef.current=false;
        try{
          const myNames = officialLineup
            ? officialLineup.myPlayers.map(p=>p.fullName)
            : Array.from({length:9},(_,i)=>likelyLineup?.[i]?.player?.player_name||null);
          const oppNames = officialLineup
            ? officialLineup.oppPlayers.map(p=>p.fullName)
            : Array.from({length:9},(_,i)=>oppLineup?.[i]?.player?.player_name||null);
          // Build name→id maps from official lineup so any player not in MLB_IDS
          // still gets real season stats as fallback instead of league average
          const myIdMap = officialLineup
            ? Object.fromEntries(officialLineup.myPlayers.map(p=>[p.fullName,p.id]))
            : {};
          const oppIdMap = officialLineup
            ? Object.fromEntries(officialLineup.oppPlayers.map(p=>[p.fullName,p.id]))
            : {};
          const sp=selectedGame?.detail?.pitcher||null;
          const [myGames,oppGames]=await Promise.all([
            fetchLast30Games(sbUrl,sbKey,myNames.filter(Boolean)),
            fetchLast30Games(sbUrl,sbKey,oppNames.filter(Boolean)),
          ]);
          const [myBuild,oppBuild]=await Promise.all([
            buildDistributions(myNames,myGames,sp,myIdMap),
            buildDistributions(oppNames,oppGames,null,oppIdMap),
          ]);
          const myDists=myBuild.dists, oppDists=oppBuild.dists;
          const myCoverage=myBuild.coverage, oppCoverage=oppBuild.coverage;
          const isHome=officialLineup?.isHome??selectedGame?.detail?.isHome??true;
          const homeDists=isHome?myDists:oppDists;
          const awayDists=isHome?oppDists:myDists;
          const myRunsArr=[],oppRunsArr=[];
          const myInnArr=Array.from({length:9},()=>[]);
          const oppInnArr=Array.from({length:9},()=>[]);
          // Per-batter R and RBI accumulators (sum across all sims, divide by TOTAL for mean)
          const myRSum=new Array(9).fill(0),  myRbiSum=new Array(9).fill(0);
          const oppRSum=new Array(9).fill(0), oppRbiSum=new Array(9).fill(0);
          const TOTAL=10000,CHUNK=500;
          let done=0;
          await new Promise(resolve=>{
            function chunk(){
              if(abortRef.current){resolve();return;}
              const end=Math.min(done+CHUNK,TOTAL);
              for(let i=done;i<end;i++){
                const{homeRuns,awayRuns,hInnings,aInnings,hRun,hRbi,aRun,aRbi}=simulateGame(homeDists,awayDists);
                myRunsArr.push(isHome?homeRuns:awayRuns);
                oppRunsArr.push(isHome?awayRuns:homeRuns);
                const myInn=isHome?hInnings:aInnings;
                const oppInn=isHome?aInnings:hInnings;
                const myR=isHome?hRun:aRun, myRbi=isHome?hRbi:aRbi;
                const oppR=isHome?aRun:hRun, oppRbi=isHome?aRbi:hRbi;
                for(let n=0;n<9;n++){
                  myInnArr[n].push(myInn[n]); oppInnArr[n].push(oppInn[n]);
                  myRSum[n]+=myR[n];   myRbiSum[n]+=myRbi[n];
                  oppRSum[n]+=oppR[n]; oppRbiSum[n]+=oppRbi[n];
                }
              }
              done=end;setSimProgress(Math.round(done/TOTAL*100));
              if(done<TOTAL)setTimeout(chunk,0);else resolve();
            }
            setTimeout(chunk,0);
          });
          if(abortRef.current)return;
          // Count wins BEFORE sorting (pairing is index-aligned from the sim loop)
          const myWins=myRunsArr.filter((r,i)=>r>oppRunsArr[i]).length;
          myRunsArr.sort((a,b)=>a-b);oppRunsArr.sort((a,b)=>a-b);
          const pct=(arr,p)=>arr[Math.floor(arr.length*p)];
          // Convert per-inning means into whole-run linescore:
          // accumulate fractional means; each time the running total crosses an integer, assign 1 run to that inning.
          const innWhole=arr=>{
            const means=arr.map(a=>a.reduce((s,b)=>s+b,0)/a.length);
            const total=means.reduce((s,b)=>s+b,0);
            let carry=0; const out=means.map(m=>{carry+=m; const r=Math.floor(carry); carry-=r; return r;});
            // distribute any remaining carry from rounding into the highest-mean inning
            const rem=Math.round(total)-out.reduce((a,b)=>a+b,0);
            if(rem>0){let idx=0;means.forEach((m,i)=>{if(m>means[idx])idx=i;});out[idx]+=rem;}
            return out;
          };
          const myInnMedians=innWhole(myInnArr);
          const oppInnMedians=innWhole(oppInnArr);
          // Per-player rows: H/HR/BB from distributions, R/RBI from sim means
          const makeRows=(dists,rSum,rbiSum)=>dists.map((d,i)=>{
            const pa=SPOT_PA[i]||4.0;
            return{
              projH:  +((d.s1b+d.dbl+d.trip+d.hr)*pa).toFixed(2),
              projHR: +(d.hr*pa).toFixed(2),
              projBB: +(d.bb*pa).toFixed(2),
              projR:  +(rSum[i]/TOTAL).toFixed(2),
              projRBI:+(rbiSum[i]/TOTAL).toFixed(2),
            };
          });
          const hasDB=myCoverage.filter(c=>c.source.startsWith('db')).length;
          const hasAPI=myCoverage.filter(c=>c.source==='mlb-api').length;
          const hasLeague=myCoverage.filter(c=>c.source==='league-avg'||c.source==='no-id'||c.source==='mlb-api-fail').length;
          setSimResult({
            myMedian:pct(myRunsArr,0.5),myP10:pct(myRunsArr,0.1),myP90:pct(myRunsArr,0.9),
            oppMedian:pct(oppRunsArr,0.5),oppP10:pct(oppRunsArr,0.1),oppP90:pct(oppRunsArr,0.9),
            winProb:+(myWins/TOTAL).toFixed(3),
            playerRows:makeRows(myDists,myRSum,myRbiSum),playerNames:myNames,
            oppRows:makeRows(oppDists,oppRSum,oppRbiSum),oppNames,
            myInnMedians,oppInnMedians,
            hasDB, hasAPI, hasLeague,
            myCoverage, oppCoverage,
            usingOfficial:!!officialLineup,
          });
          setSimPhase("done");
        }catch(e){setSimError(e.message||"Simulation failed");setSimPhase("ready");}
      },[officialLineup,likelyLineup,oppLineup,selectedGame,sbUrl,sbKey,myTeam]);

      if(!selectedGame)return null;

      const oppName=selectedGame.opponent||"Opponent";

      return(
        <div style={{background:"#1e293b",borderRadius:12,padding:16,marginTop:16}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <div>
              <span style={{fontWeight:700,fontSize:13,color:ACCENT}}>Monte Carlo Box Score</span>
              <span style={{fontSize:11,color:"#475569",marginLeft:8}}>10,000-game simulation</span>
            </div>
            {simPhase==="idle"&&(
              <span style={{fontSize:11,color:"#475569"}}>Available ~4h before first pitch</span>
            )}
            {simPhase==="waiting"&&(
              <span style={{fontSize:11,color:"#f59e0b"}}>Waiting for official lineup… (checking every 60s)</span>
            )}
            {(simPhase==="ready"||simPhase==="done")&&(
              <button onClick={runSimulation}
                style={{padding:"7px 16px",borderRadius:8,border:"none",cursor:"pointer",
                  fontWeight:700,fontSize:12,
                  background:simPhase==="done"?"#334155":ACCENT,
                  color:simPhase==="done"?"#94a3b8":"#fff"}}>
                {simPhase==="done"?"Re-run ▶":"Run Simulation ▶"}
              </button>
            )}
            {simPhase==="simulating"&&(
              <div style={{display:"flex",alignItems:"center",gap:10}}>
                <div style={{width:120,height:6,background:"#0f172a",borderRadius:3,overflow:"hidden"}}>
                  <div style={{width:simProgress+"%",height:"100%",background:ACCENT,borderRadius:3,transition:"width 0.15s"}}/>
                </div>
                <span style={{fontSize:11,color:"#94a3b8"}}>{simProgress}%</span>
              </div>
            )}
          </div>

          {officialLineup&&(
            <div style={{fontSize:10,color:"#22c55e",marginBottom:8}}>
              Official lineup confirmed · {officialLineup.myPlayers.length} batters · {officialLineup.isHome?"Home":"Away"}
            </div>
          )}
          {!officialLineup&&simPhase!=="idle"&&simPhase!=="waiting"&&(
            <div style={{fontSize:10,color:"#f59e0b",marginBottom:8}}>
              Using projected lineup (official card not yet posted)
            </div>
          )}
          {simError&&<div style={{color:"#ef4444",fontSize:12,marginBottom:8}}>{simError}</div>}

          {simResult&&(
            <>
              {/* Score prediction */}
              <div style={{background:"#0f172a",borderRadius:8,padding:"14px 16px",marginBottom:12}}>
                <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:24,marginBottom:10}}>
                  <div style={{textAlign:"center"}}>
                    <div style={{fontSize:11,color:"#64748b",marginBottom:2}}>{myTeam}</div>
                    <div style={{fontSize:32,fontWeight:800,color:"#22c55e",lineHeight:1}}>{simResult.myMedian}</div>
                    <div style={{fontSize:10,color:"#475569",marginTop:2}}>{simResult.myP10}–{simResult.myP90} range</div>
                  </div>
                  <div style={{fontSize:22,color:"#334155",fontWeight:700}}>—</div>
                  <div style={{textAlign:"center"}}>
                    <div style={{fontSize:11,color:"#64748b",marginBottom:2}}>{oppName}</div>
                    <div style={{fontSize:32,fontWeight:800,color:"#ef4444",lineHeight:1}}>{simResult.oppMedian}</div>
                    <div style={{fontSize:10,color:"#475569",marginTop:2}}>{simResult.oppP10}–{simResult.oppP90} range</div>
                  </div>
                </div>
                <div style={{height:8,background:"#1e293b",borderRadius:4,overflow:"hidden",marginBottom:4}}>
                  <div style={{width:(simResult.winProb*100)+"%",height:"100%",background:"#22c55e",transition:"width 0.4s"}}/>
                </div>
                <div style={{display:"flex",justifyContent:"space-between",fontSize:10}}>

              {/* Data source breakdown */}
              {(()=>{

    // ── Game Plan Tab ─────────────────────────────────────────────────────────
    function GamePlanTab({roster, predCache, dataSource, sbUrl, sbKey}) {
      const [myTeam,       setMyTeam]       = React.useState(readMeta("default-team")||"");

      const [schedLoading, setSchedLoading] = React.useState(false);
      const [selectedGame, setSelectedGame] = React.useState(null);
      const [myLineup,            setMyLineup]           = React.useState(null);
      const [historicalLikely,    setHistoricalLikely]   = React.useState(null);
      const [historicalOpp,       setHistoricalOpp]      = React.useState(null);
      const [confirmedLineup,     setConfirmedLineup]    = React.useState(null);
      const [officialLikely,      setOfficialLikely]     = React.useState(null);
      const [officialOpp,         setOfficialOpp]        = React.useState(null);
      // Derived: official wins over historical — no state race possible
      const likelyLineup = officialLikely || historicalLikely;
      const oppLineup    = officialOpp    || historicalOpp;
      const [aiSummary,    setAiSummary]    = React.useState("");
      const [aiLoading,    setAiLoading]    = React.useState(false);
      const [btResult,     setBtResult]     = React.useState(null);
      const [btLoading,    setBtLoading]    = React.useState(false);
      const [btError,      setBtError]      = React.useState("");
      const [myWinPct,     setMyWinPct]     = React.useState(0.500);
      const [myTeamEra,    setMyTeamEra]    = React.useState(LEAGUE_AVG_ERA);

      const teams = React.useMemo(()=>[...new Set(roster.map(p=>p.team).filter(Boolean))].sort(),[roster]);

      React.useEffect(()=>{
        if(!myTeam) return;
        setSchedLoading(true); setSchedule(null); setSelectedGame(null); setMyLineup(null); setHistoricalLikely(null); setHistoricalOpp(null); setConfirmedLineup(null); setOfficialLikely(null); setOfficialOpp(null); setAiSummary("");
        setBtResult(null); setBtError("");
        fetchUpcomingSchedule(myTeam).then(sched=>{
          const games = sched.opponents.map((opp,i)=>({
            dayOffset:i,
            date: new Date(Date.now()+i*86400000).toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"}),
            opponent: opp,
            detail: sched.matchupDetails?.[i],
            factor: sched.opponentFactors?.[i],
          })).filter(g=>g.opponent&&g.opponent!=='---');
          setMyWinPct(sched.myWinPct ?? 0.500);
          setMyTeamEra(sched.myTeamEra ?? LEAGUE_AVG_ERA);
          setSchedule({games,sched}); setSchedLoading(false);
        }).catch(()=>setSchedLoading(false));
      },[myTeam]);

      // Reset official lineup when game changes
      React.useEffect(()=>{
        setConfirmedLineup(null); setOfficialLikely(null); setOfficialOpp(null);
      },[selectedGame]);

      // Build historical lineup — runs whenever game/roster/predCache changes
      // Never touches official state so the two can't race
      React.useEffect(()=>{
        if(!selectedGame||!myTeam) return;
        const oppFull = selectedGame.detail?.teamFullName;
        const myPool = roster.filter(p=>p.team===myTeam&&(p.gamesPlayed||0)>=5)
          .sort((a,b)=>(predCache[b.player_name]?.score||0)-(predCache[a.player_name]?.score||0)).slice(0,14);
        setMyLineup(buildOptimalLineup(myPool, predCache));
        setHistoricalLikely(buildOpponentLineup(myPool, predCache));
        if(oppFull){
          const oppPool = roster.filter(p=>p.team===oppFull&&(p.gamesPlayed||0)>=5)
            .sort((a,b)=>(predCache[b.player_name]?.score||0)-(predCache[a.player_name]?.score||0)).slice(0,14);
          setHistoricalOpp(buildOpponentLineup(oppPool, predCache));
        } else { setHistoricalOpp(null); }
      },[selectedGame, roster, predCache, myTeam]);

      // Called by MonteCarloSimPanel when official lineup is confirmed
      // Only sets official* state — never touches historical*, so the two can't overwrite each other
      const handleOfficialLineup = React.useCallback((official)=>{
        setConfirmedLineup(official);
        const toEntry=(p,i,team)=>{
          const rosterPlayer=roster.find(r=>r.player_name===p.fullName)
            ||{player_name:p.fullName,team,position:p.primaryPosition?.abbreviation||'',avgWoba:null};
          return{spot:i+1,player:rosterPlayer};
        };
        setOfficialLikely(official.myPlayers.map((p,i)=>toEntry(p,i,myTeam)));
        setOfficialOpp(official.oppPlayers.map((p,i)=>toEntry(p,i,selectedGame?.opponent||'')));
      },[roster, myTeam, selectedGame]);

      const runBacktest = async()=>{
        if(!myTeam||!roster.length) return;
        setBtLoading(true); setBtResult(null); setBtError("");
        try{
          const result = await backtestGamePlan(myTeam, roster, predCache, null, null, 21);
          if(result.error){ setBtError(result.error); }
          else { setBtResult(result); }
        }catch(e){ setBtError(e.message||"Backtest failed"); }
        setBtLoading(false);
      };

      const generateAI = async()=>{
        if(!myLineup||!selectedGame) return;
        setAiLoading(true); setAiSummary("");
        const fmtMine = myLineup.map((e,i)=>{
          if(!e) return `${i+1}. TBD`;
          const p=e.player, pr=predCache[p.player_name];
          return `${i+1}. ${p.player_name} (${p.position?.split(",")[0]||"?"}) wOBA ${p.avgWoba?.toFixed(3)||"—"} Score ${pr?.score||"—"} ${pr?.tier==="hot"?"Peak":pr?.tier==="warm"?"Rising":pr?.tier==="neutral"?"Holding":"Fading"}`;
        }).join("\n");
        const fmtOpp = oppLineup?oppLineup.map(e=>{
          if(!e) return "";
          const p=e.player, pr=predCache[p.player_name];
          return `${e.spot}. ${p.player_name} (${p.position?.split(",")[0]||"?"}) wOBA ${p.avgWoba?.toFixed(3)||"—"} Score ${pr?.score||"—"}`;
        }).join("\n"):"Not available";
        const sp=selectedGame.detail?.pitcher;
        const prompt=`You are a baseball manager writing a pregame lineup brief.
